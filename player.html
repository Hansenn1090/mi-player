<html class="h-full bg-black select-none" lang="es"><head>
<meta charset="utf-8"/>

<script>
    tailwind.config = {
      theme: { extend: {
        colors: { brand: { cyan:'#00d2ff', blue:'#2563eb', dark:'#0a0a0c', track:'#383a42', card:'rgba(20,22,28,0.85)' } },
        fontFamily: { sans: ['Inter','system-ui','-apple-system','Segoe UI','Roboto','sans-serif'] }

<style>
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;cursor:pointer}
input[type=range]:focus{outline:none}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:9999px;background:transparent}
input[type=range]::-moz-range-track{height:4px;border-radius:9999px;background:transparent}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;height:14px;width:14px;border-radius:50%;background:#00d2ff;margin-top:-5px;box-shadow:0 0 10px rgba(0,210,255,.85);border:2px solid #fff}
input[type=range]::-moz-range-thumb{height:14px;width:14px;border-radius:50%;background:#00d2ff;border:2px solid #fff}
input[type=range]:hover::-webkit-slider-thumb{transform:scale(1.3);box-shadow:0 0 14px #00d2ff}
.hud-transition{transition:opacity .35s cubic-bezier(.16,1,.3,1),transform .35s cubic-bezier(.16,1,.3,1)}
.hud-hidden{opacity:0!important;pointer-events:none!important;transform:translateY(16px)}
.key-badge{background:rgba(255,255,255,.9);color:#000;font-size:10px;font-weight:800;border-radius:2px;padding:1px 4px;display:inline-flex;align-items:center;line-height:1.2}
.aspect-mode-16-9{width:100%!important;height:100%!important;object-fit:contain;transform:scale(1)}
.aspect-mode-stretch{width:100%!important;height:100%!important;transform:scale(1.05,1.05)}
.aspect-mode-4-3{width:75%!important;height:100%!important;margin:0 auto}
.tv-btn-normal{background:rgba(43,50,63,.82);backdrop-filter:blur(10px);color:#d1d5db;transition:all .2s}
.tv-btn-normal:hover{background:rgba(60,70,88,.95);color:#fff}
.tv-btn-active{background:rgba(72,85,107,.98)!important;backdrop-filter:blur(10px);color:#fff!important;box-shadow:0 2px 8px rgba(0,0,0,.4);border-color:#00d2ff!important}
.options-drawer-panel{transition:opacity .3s cubic-bezier(.16,1,.3,1),transform .3s cubic-bezier(.16,1,.3,1),max-height .3s cubic-bezier(.16,1,.3,1)}
.options-drawer-collapsed{opacity:0;pointer-events:none;transform:translateY(16px) scale(.98);max-height:0;margin-bottom:0!important;padding-top:0!important;padding-bottom:0!important;overflow:hidden}
.options-drawer-expanded{opacity:1;pointer-events:auto;transform:translateY(0) scale(1);max-height:560px}
.custom-scrollbar::-webkit-scrollbar{width:4px}
.custom-scrollbar::-webkit-scrollbar-thumb{background:rgba(0,210,255,.4);border-radius:4px}
.srv-btn-dyn{display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;font-size:13px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;border:none;cursor:pointer;transition:all .2s;color:#d1d5db}
.srv-btn-dyn .dot{width:8px;height:8px;border-radius:50%;background:#64748b;flex-shrink:0}
.srv-btn-dyn.active .dot{background:#22c55e;box-shadow:0 0 8px #22c55e}
#load-overlay{position:fixed;inset:0;z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:rgba(0,0,0,.85);backdrop-filter:blur(14px)}
#load-overlay.on{display:flex}
#load-overlay .ld-spin{width:40px;height:40px;border:3px solid rgba(255,255,255,.12);border-top-color:#00d2ff;border-radius:50%;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#load-overlay .ld-msg{font-size:14px;color:rgba(255,255,255,.8);text-align:center;padding:0 20px;max-width:500px;line-height:1.5}
#load-overlay .ld-msg small{display:block;font-size:11px;color:rgba(255,255,255,.4);margin-top:6px}
</style>
</head>
<body class="h-full w-full overflow-hidden bg-black text-white font-sans antialiased relative">

<div class="absolute inset-0 w-full h-full flex items-center justify-center z-[1] bg-black" id="video-wrapper">
<!-- IFRAME ORIGINAL SIN SANDBOX (pero con ad blocker en el parent) -->
<iframe
  allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
  allowfullscreen="true"
  class="w-full h-full absolute inset-0 border-0 aspect-mode-16-9 transition-transform duration-300 bg-black pointer-events-auto"
  height="100%"
  id="unlimplay-iframe"
  mozallowfullscreen="true"
  referrerpolicy="no-referrer"
  scrolling="no"
  src="about:blank"

</div>

<div class="grid grid-cols-1 lg:grid-cols-2 gap-4 pb-3 border-b border-white/10">

</div>

<div class="flex items-center gap-4 sm:gap-5">

</div>

<div class="fixed inset-0 z-50 bg-black/85 backdrop-blur-md opacity-0 pointer-events-none transition-opacity duration-300 flex items-center justify-center p-4" id="info-modal">
<div class="bg-zinc-900/95 border border-white/15 max-w-2xl w-full rounded-2xl p-6 shadow-2xl transform scale-95 transition-transform duration-300" id="info-modal-card">
<button class="absolute top-4 right-4 text-neutral-400 hover:text-white p-2 rounded-lg bg-white/5" id="btn-close-modal">✕</button>
<div class="flex flex-col sm:flex-row gap-6">
  <img alt="Poster" class="w-32 h-48 sm:w-44 sm:h-64 object-cover rounded-lg border border-white/10 flex-shrink-0 mx-auto" id="info-poster" src=""/>
  <div class="flex-1 space-y-3">
    <div class="flex items-center gap-2 flex-wrap" id="info-badges"></div>
    <h2 class="text-2xl font-bold text-white" id="info-title">—</h2>
    <p class="text-xs font-mono text-cyan-400" id="info-original">—</p>
    <p class="text-neutral-300 text-sm leading-relaxed" id="info-description">—</p>
    <div class="pt-2 border-t border-white/10 grid grid-cols-2 gap-2 text-xs text-neutral-400" id="info-meta"></div>
  </div>
</div>
</div>
</div>
</main>

<!-- ═══════════════════════════════════════════════════════════════════
     AD BLOCKER (funciona sobre el parent + intercepta window.open)
     ═══════════════════════════════════════════════════════════════════ -->
<script data-purpose="ad-blocker">
(function() {
  const AD_DOMAINS = [
    'doubleclick.net','googlesyndication.com','googleadservices.com','googletagmanager.com',
    'googletagservices.com','adservice.google.com','popads.net','popcash.net',
    'propellerads.com','adcash.com','exoclick.com','juicyads.com','trafficjunky.com',
    'adsterra.com','hilltopads.net','clickadu.com','mgid.com','revcontent.com',
    'taboola.com','outbrain.com','zedo.com','adbrite.com','servetraff.com',
    'vidoomy.com','onclickads.net','adnium.com','bidvertiser.com','adf.ly',
    'shorte.st','linkbucks.com','clickaine.com','adplugg.com','adroll.com',
    'criteo.com','pubmatic.com','rubiconproject.com','openx.net','appnexus.com',
    'smartadserver.com','adform.net','serving-sys.com','adnxs.com','adsrvr.org',
    'yieldmo.com','33across.com','sharethrough.com','triplelift.com','sovrn.com',
    'indexww.com','amazon-adsystem.com','casalemedia.com','contextweb.com',
    'districtm.io','gumgum.com','media.net','sonobi.com','spotxchange.com',
    'teads.tv','undertone.com','video.unrulymedia.com','yieldlab.net'
  ];

  function isAdUrl(url) {
    try {
      const u = String(url || '').toLowerCase();
      return AD_DOMAINS.some(d => u.includes(d));
    } catch { return false; }
  }

  // 1) Bloquear window.open (popups)
  const origOpen = window.open;
  window.open = function(url, ...args) {
    if (isAdUrl(url) || !url) {
      console.log('[AdBlock] 🛡️ Popup bloqueado:', url);
      return null;
    }
    return origOpen.apply(this, [url, ...args]);
  };

  // 2) Interceptar fetch
  const origFetch = window.fetch;
  window.fetch = function(input, init) {
    const url = typeof input === 'string' ? input : (input && input.url);
    if (isAdUrl(url)) {
      console.log('[AdBlock] 🛡️ Fetch bloqueado:', url);
      return Promise.reject(new Error('Blocked by AdBlock'));
    }
    return origFetch.apply(this, arguments);
  };

  // 3) Interceptar XHR
  const origXHROpen = XMLHttpRequest.prototype.open;
  XMLHttpRequest.prototype.open = function(method, url, ...rest) {
    if (isAdUrl(url)) {
      console.log('[AdBlock] 🛡️ XHR bloqueado:', url);
      this._blocked = true;
      return;
    }
    return origXHROpen.apply(this, [method, url, ...rest]);
  };
  const origXHRSend = XMLHttpRequest.prototype.send;
  XMLHttpRequest.prototype.send = function(...args) {
    if (this._blocked) return;
    return origXHRSend.apply(this, args);
  };

  // 4) Interceptar Image (pixels de tracking)
  const origImgDesc = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, 'src');
  if (origImgDesc) {
    Object.defineProperty(HTMLImageElement.prototype, 'src', {
      set: function(value) {
        if (isAdUrl(value)) {
          console.log('[AdBlock] 🛡️ Pixel bloqueado:', value);
          return;
        }
        return origImgDesc.set.call(this, value);
      },
      get: function() { return origImgDesc.get.call(this); }
    });
  }

  // 5) Bloquear click en popups desde iframes
  document.addEventListener('click', function(e) {
    const a = e.target.closest && e.target.closest('a');
    if (!a) return;
    const target = (a.getAttribute('target') || '').toLowerCase();
    const href = a.getAttribute('href') || '';
    if (target === '_blank' && isAdUrl(href)) {
      e.preventDefault();
      e.stopImmediatePropagation();
      console.log('[AdBlock] 🛡️ Link popup bloqueado:', href);
    }
  }, true);

  console.log('[AdBlock] ✅ Bloqueador activo - ' + AD_DOMAINS.length + ' dominios en lista negra');
})();
</script>

<!-- ═══════════════════════════════════════════════════════════════════
     LÓGICA DEL PLAYER + DETECTOR
     ═══════════════════════════════════════════════════════════════════ -->
<script data-purpose="smart-tv-player-controller">
const CONFIG = {
  API_URL: 'https://mi-player-api.onrender.com',
  DEFAULT_TMDB_ID: '550',
  DEFAULT_TYPE: 'movie',
  idleTimeout: 3800,
};

let SERVERS = {};
let SERVERS_BY_LANG = {};
let CURRENT_LANG = 'latino';
let CURRENT_SERVER_ID = null;

const state = {
  isPlaying: false, currentTime: 0, duration: 0,
  isHudVisible: true, isOptionsDrawerOpen: false,
  isModalOpen: false, isFeedbackOpen: false,
  isDirectMode: false, isSeeking: false, idleTimer: null,
  currentAudio: 'latino', currentSubtitle: 'off', currentAspect: '16-9',
  activePlayer: null,
};

const $ = id => document.getElementById(id);
const els = {
  iframe: $('unlimplay-iframe'), hud: $('osd-hud'),
  slider: $('seek-slider'), progressFill: $('progress-fill'),
  currentTimeText: $('current-time-text'), durationTimeText: $('duration-time-text'),
  optionsPanel: $('options-panel-container'), btnToggleOptions: $('btn-toggle-options'),
  btnRevealHud: $('btn-reveal-hud'), toggleChevron: $('toggle-chevron'),
  actionFlash: $('action-flash'), actionFlashIcon: $('action-flash-icon'),
  toastNotify: $('toast-notify'), toastText: $('toast-text'),
  infoModal: $('info-modal'), infoModalCard: $('info-modal-card'),
  btnCloseModal: $('btn-close-modal'), btnModalPlay: $('btn-modal-action-play'),
  posterThumb: $('poster-thumb'), btnExit: $('btn-legend-exit'),
  btnPlay: $('btn-legend-play'), btnRewind: $('btn-legend-rewind'),
  btnForward: $('btn-legend-forward'), btnInfo: $('btn-legend-info'),
  legendPlayLabel: $('legend-play-label'), btnBarFeedback: $('btn-bar-feedback'),
  badgeActiveAudio: $('badge-active-audio'), badgeActiveSubtitle: $('badge-active-subtitle'),
  feedbackModal: $('feedback-modal'), feedbackCard: $('feedback-card'),
  btnCloseFeedback: $('btn-close-feedback'), btnCancelFeedback: $('btn-cancel-feedback'),
  feedbackForm: $('feedback-form'), bottomHoverDetector: $('bottom-hover-detector'),
  serverButtonsContainer: $('server-buttons-container'), serverStatusPill: $('server-status-pill'),
  movieTitle: $('movie-title'), movieSubtitle: $('movie-subtitle'),
  posterImg: $('poster-img'), infoPoster: $('info-poster'),
  infoTitle: $('info-title'), infoOriginal: $('info-original'),
  infoDescription: $('info-description'), infoBadges: $('info-badges'), infoMeta: $('info-meta'),
  loadOverlay: $('load-overlay'), loadMsg: $('load-msg'),
};

const ICONS = {
  play: '<polygon points="5 3 19 12 5 21 5 3"/>',
  pause: '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>',
  forward: '<polygon points="13 19 22 12 13 5 13 19"/><polygon points="2 19 11 12 2 5 2 19"/>',
  rewind: '<polygon points="11 19 2 12 11 5 11 19"/><polygon points="22 19 13 12 22 5 22 19"/>',
  check: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" fill="none" stroke="currentColor"/>'
};

let toastTimeout;
function showToast(m) {
  if (!els.toastNotify) return;
  els.toastText.textContent = m;
  els.toastNotify.classList.remove('opacity-0','-translate-y-3');
  els.toastNotify.classList.add('opacity-100','translate-y-0');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => {
    els.toastNotify.classList.remove('opacity-100','translate-y-0');
    els.toastNotify.classList.add('opacity-0','-translate-y-3');
  }, 3000);
}
function triggerActionFlash(iconMarkup) {
  if (!els.actionFlash) return;
  els.actionFlashIcon.innerHTML = iconMarkup;
  els.actionFlash.classList.remove('opacity-0','scale-75');
  els.actionFlash.classList.add('opacity-100','scale-100');
  clearTimeout(triggerActionFlash.timer);
  triggerActionFlash.timer = setTimeout(() => {
    els.actionFlash.classList.remove('opacity-100','scale-100');
    els.actionFlash.classList.add('opacity-0','scale-75');
  }, 550);
}
function showLoad(m) { if (m) els.loadMsg.innerHTML = m; els.loadOverlay.classList.add('on'); }
function hideLoad() { els.loadOverlay.classList.remove('on'); }

function detectType(url) {
  if (!url) return 'iframe';
  if (/\.m3u8(\?|$)/i.test(url)) return 'hls';
  if (/\.(mp4|webm|mkv|mov|ts)(\?|$)/i.test(url)) return 'mp4';
  return 'iframe';
}
function formatTime(s) {
  if (isNaN(s) || s < 0) s = 0;
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), x = Math.floor(s%60);
  const p = n => String(n).padStart(2,'0');
  return h > 0 ? `${p(h)}:${p(m)}:${p(x)}` : `${p(m)}:${p(x)}`;
}
function updateScrubberUI() {
  if (state.duration <= 0) return;
  const pct = Math.min(Math.max((state.currentTime/state.duration)*100, 0), 100);
  if (!state.isSeeking) els.slider.value = pct;
  els.progressFill.style.width = `${pct}%`;
  els.currentTimeText.textContent = formatTime(state.currentTime);
  els.durationTimeText.textContent = formatTime(state.duration);
}
function showHUD() { if (state.isDirectMode) return; state.isHudVisible = true; els.hud.classList.remove('hud-hidden'); els.btnRevealHud.classList.add('opacity-0','pointer-events-none'); }
function hideHUD() {
  if (state.isModalOpen || state.isFeedbackOpen || state.isOptionsDrawerOpen) return;
  state.isHudVisible = false;
  els.hud.classList.add('hud-hidden');
  els.btnRevealHud.classList.remove('opacity-0','pointer-events-none');
}
function resetIdleTimer() {
  if (!state.isHudVisible && !state.isDirectMode) showHUD();
  clearTimeout(state.idleTimer);
  state.idleTimer = setTimeout(() => {
    if (!state.isModalOpen && !state.isFeedbackOpen && !state.isOptionsDrawerOpen) hideHUD();
  }, CONFIG.idleTimeout);
}

/* ═══════════════════════════════════════════════════════════════════
   DETECTOR: intenta HLS o MP4 nativo; si falla → iframe
   ═══════════════════════════════════════════════════════════════════ */
async function tryPlayAsNative(url) {
  return new Promise((resolve) => {
    const video = document.createElement('video');
    video.id = 'player-slot';
    video.className = 'w-full h-full absolute inset-0 border-0 aspect-mode-16-9 bg-black';
    video.controls = false; video.playsInline = true; video.preload = 'metadata';
    video.crossOrigin = 'anonymous';
    const host = els.iframe.parentElement;
    let hls = null, settled = false;

    const cleanup = (success) => {
      if (settled) return;
      settled = true;
      clearTimeout(timeout);
      if (!success) {
        try { if (hls) hls.destroy(); } catch(e) {}
        try { video.pause(); video.src = ''; video.load(); } catch(e) {}
        video.remove();
      }
      resolve(success);
    };
    const timeout = setTimeout(() => { console.log('[Detector] ⏱️ Timeout'); cleanup(false); }, 12000);
    host.appendChild(video);

    const onReady = () => {
      console.log('[Detector] ✅ Nativo OK → CONTROL TOTAL');
      state.activePlayer = { type: 'native', el: video, hls };
      wireNativeVideo(video);
      cleanup(true);
    };

    if (/\.m3u8(\?|$)/i.test(url) && window.Hls && Hls.isSupported()) {
      console.log('[Detector] Probando HLS (.m3u8)...');
      try {
        hls = new Hls({ maxBufferLength: 30, enableWorker: true });
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, onReady);
        hls.on(Hls.Events.ERROR, (e, data) => {
          if (data.fatal) { console.log('[Detector] ❌ HLS fatal:', data.type); cleanup(false); }
        });
      } catch(e) { cleanup(false); }
    } else if (/\.(mp4|webm|mkv|mov|ts)(\?|$)/i.test(url)) {
      console.log('[Detector] Probando MP4...');
      video.src = url;
      video.addEventListener('loadedmetadata', onReady, { once: true });
      video.addEventListener('error', () => cleanup(false), { once: true });
    } else {
      console.log('[Detector] No es HLS/MP4, usando iframe');
      cleanup(false);
    }
  });
}
function destroyActivePlayer() {
  const ap = state.activePlayer;
  if (!ap) return;
  if (ap.hls) try { ap.hls.destroy(); } catch(e){}
  if (ap.type === 'native') { try { ap.el.pause(); ap.el.src = ''; ap.el.load(); ap.el.remove(); } catch(e){} }
  state.activePlayer = null;
}
function wireNativeVideo(video) {
  if (video._wired) return;
  video._wired = true;
  video.addEventListener('loadedmetadata', () => {
    if (isFinite(video.duration) && video.duration > 0) { state.duration = video.duration; updateScrubberUI(); }
  });
  video.addEventListener('timeupdate', () => {
    if (state.isSeeking) return;
    state.currentTime = video.currentTime;
    updateScrubberUI();
  });
  video.addEventListener('play', () => { state.isPlaying = true; if (els.legendPlayLabel) els.legendPlayLabel.textContent = 'Pausar'; hideLoad(); });
  video.addEventListener('pause', () => { state.isPlaying = false; if (els.legendPlayLabel) els.legendPlayLabel.textContent = 'Reproducir'; });
  video.addEventListener('playing', () => hideLoad());
  video.addEventListener('waiting', () => showLoad('Buffering…'));
}

async function switchServer(serverId) {
  const target = SERVERS[serverId];
  if (!target) return;
  CURRENT_SERVER_ID = serverId;
  destroyActivePlayer();
  document.querySelectorAll('#server-buttons-container .srv-btn-dyn').forEach(b => {
    b.classList.toggle('active', b.dataset.server === serverId);
  });
  state.currentTime = 0; state.duration = 0;
  updateScrubberUI();
  const type = detectType(target.url);
  showLoad(`Cargando servidor…<small>Detectando: ${type.toUpperCase()}</small>`);

  if (type === 'hls' || type === 'mp4') {
    const ok = await tryPlayAsNative(target.url);
    if (ok) {
      hideLoad();
      showToast('✅ Control total activado');
      triggerActionFlash(ICONS.play);
      setTimeout(() => {
        const ap = state.activePlayer;
        if (ap && ap.type === 'native') {
          ap.el.play().catch(() => {});
          state.isPlaying = true;
          if (els.legendPlayLabel) els.legendPlayLabel.textContent = 'Pausar';
        }
      }, 200);
      resetIdleTimer();
      return;
    }
  }
  // Fallback iframe (sin sandbox)
  els.iframe.src = target.url;
  state.activePlayer = { type: 'iframe', el: els.iframe };
  hideLoad();
  showToast('Reproducción externa (sin control)');
  triggerActionFlash(ICONS.play);
  state.isPlaying = true;
  if (els.legendPlayLabel) els.legendPlayLabel.textContent = 'Pausar';
  resetIdleTimer();
}

function renderServerButtons() {
  const container = els.serverButtonsContainer;
  if (!container) return;
  const ids = SERVERS_BY_LANG[CURRENT_LANG] || [];
  container.innerHTML = '';
  if (!ids.length) {
    container.innerHTML = `<div class="w-full text-center text-xs text-neutral-500 py-3 italic">Sin servidores</div>`;
    return;
  }
  ids.slice(0, 2).forEach((id, index) => {
    const srv = SERVERS[id];
    if (!srv) return;
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'tv-btn-normal srv-btn-dyn' + (id === CURRENT_SERVER_ID ? ' active' : '');
    btn.dataset.server = id;
    btn.innerHTML = `<span class="dot"></span><span class="truncate">Servidor ${index + 1}</span>`;
    btn.onclick = () => switchServer(id);
    container.appendChild(btn);
  });
}
function renderLangTabs() {
  const container = $('group-reproductor-bar');
  if (!container) return;
  const prev = container.querySelector('.lang-tabs-row');
  if (prev) prev.remove();
  const langs = Object.keys(SERVERS_BY_LANG);
  if (langs.length <= 1) return;
  const META = { latino:'🇲🇽 LATINO', español:'🇪🇸 ESPAÑOL', castellano:'🇪🇸 CASTELLANO', subtitulado:'🇺🇸 SUBTITULADO' };
  const tabsRow = document.createElement('div');
  tabsRow.className = 'lang-tabs-row flex gap-2 mb-2';
  langs.forEach(lang => {
    const tab = document.createElement('button');
    tab.className = 'tv-btn-normal px-3 py-1.5 text-xs rounded-lg' + (lang === CURRENT_LANG ? ' tv-btn-active' : '');
    tab.textContent = META[lang] || lang.toUpperCase();
    tab.onclick = () => {
      CURRENT_LANG = lang;
      const firstId = (SERVERS_BY_LANG[lang] || [])[0];
      renderLangTabs(); renderServerButtons();
      if (firstId) switchServer(firstId);
      showToast(`Idioma: ${lang.toUpperCase()}`);
    };
    tabsRow.appendChild(tab);
  });
  container.insertBefore(tabsRow, container.querySelector('#server-buttons-container'));
}
function hydrateMetadata(meta) {
  if (!meta) return;
  if (meta.title) { if (els.movieTitle) els.movieTitle.textContent = meta.title; document.title = `${meta.title} - Smart TV Player`; }
  const metaLine = [meta.originalTitle, meta.year, meta.genres, meta.voteAverage ? `★ ${meta.voteAverage.toFixed(1)}` : ''].filter(Boolean).join(' • ');
  if (els.movieSubtitle) els.movieSubtitle.textContent = metaLine;
  if (meta.poster) { els.posterImg.src = meta.poster; els.infoPoster.src = meta.poster; }
  if (meta.backdrop) {
    let bd = document.getElementById('poster-backdrop-img');
    if (!bd) {
      bd = document.createElement('img');
      bd.id = 'poster-backdrop-img';
      bd.className = 'absolute inset-0 w-full h-full object-cover brightness-[0.35]';
      bd.style.zIndex = '-1';
      document.querySelector('main').prepend(bd);
    }
    bd.src = meta.backdrop;
  }
  if (els.infoTitle) els.infoTitle.textContent = meta.title || '—';
  if (els.infoOriginal) els.infoOriginal.textContent = meta.originalTitle ? `Título Original: ${meta.originalTitle}` : '';
  if (els.infoDescription) els.infoDescription.textContent = meta.overview || '—';
  if (els.infoBadges) els.infoBadges.innerHTML = meta.year ? `
    <span class="px-2 py-0.5 text-xs font-semibold rounded bg-amber-500/20 text-amber-300 border border-amber-500/30">TMDB ${meta.voteAverage?.toFixed(1) || '—'}</span>
    <span class="text-xs text-neutral-400">${meta.year}</span>
    <span class="text-xs text-neutral-400">• ${meta.runtime || '—'} min</span>` : '';
  if (els.infoMeta) els.infoMeta.innerHTML = meta.genres ? `
    <div><strong class="text-neutral-200">Género:</strong> ${meta.genres}</div>
    <div><strong class="text-neutral-200">Año:</strong> ${meta.year || '—'}</div>` : '';
}
async function loadServersFromAPI() {
  const params = new URLSearchParams(location.search);
  const tmdbId = params.get('id') || CONFIG.DEFAULT_TMDB_ID;
  const type = params.get('type') || CONFIG.DEFAULT_TYPE;
  if (els.serverStatusPill) els.serverStatusPill.textContent = 'Conectando…';
  showLoad('Conectando con la API…<small>Primera carga: hasta 60 segundos</small>');
  try {
    const r = await fetch(`${CONFIG.API_URL}/api/servers?id=${tmdbId}&type=${type}`, { signal: AbortSignal.timeout(90000) });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    if (data.meta) hydrateMetadata(data.meta);
    if (!data.servers || !Object.keys(data.servers).length) {
      if (els.serverStatusPill) els.serverStatusPill.textContent = 'Sin servidores';
      hideLoad(); showToast('No se encontraron servidores'); return;
    }
    SERVERS = {}; SERVERS_BY_LANG = {};
    let idx = 0;
    const priority = ['latino','español','castellano','subtitulado'];
    const langs = Object.keys(data.servers).sort((a,b) => (priority.indexOf(a) === -1 ? 99 : priority.indexOf(a)) - (priority.indexOf(b) === -1 ? 99 : priority.indexOf(b)));
    langs.forEach(lang => {
      SERVERS_BY_LANG[lang] = [];
      Object.entries(data.servers[lang]).forEach(([name, url]) => {
        const id = 'srv_' + (idx++);
        SERVERS[id] = { id, name, url, lang, type: detectType(url) };
        SERVERS_BY_LANG[lang].push(id);
      });
    });
    CURRENT_LANG = SERVERS_BY_LANG.latino ? 'latino' : SERVERS_BY_LANG.español ? 'español' : SERVERS_BY_LANG.castellano ? 'castellano' : SERVERS_BY_LANG.subtitulado ? 'subtitulado' : Object.keys(SERVERS_BY_LANG)[0];
    renderLangTabs(); renderServerButtons();
    const total = Object.keys(SERVERS).length;
    if (els.serverStatusPill) els.serverStatusPill.textContent = `${total} servidores`;
    const firstId = SERVERS_BY_LANG[CURRENT_LANG][0];
    if (firstId) await switchServer(firstId);
  } catch (err) {
    console.error('[API]', err);
    if (els.serverStatusPill) els.serverStatusPill.textContent = 'Reintentando…';
    showLoad('Error al conectar<small>Reintentando en 30 segundos…</small>');
    setTimeout(loadServersFromAPI, 30000);
  }
}
function toggleOptionsDrawer(force) {
  const shouldOpen = typeof force === 'boolean' ? force : !state.isOptionsDrawerOpen;
  state.isOptionsDrawerOpen = shouldOpen;
  if (shouldOpen) {
    els.optionsPanel.classList.remove('options-drawer-collapsed');
    els.optionsPanel.classList.add('options-drawer-expanded');
    els.toggleChevron.classList.add('rotate-180','text-brand-cyan');
    clearTimeout(state.idleTimer);
  } else {
    els.optionsPanel.classList.remove('options-drawer-expanded');
    els.optionsPanel.classList.add('options-drawer-collapsed');
    els.toggleChevron.classList.remove('rotate-180','text-brand-cyan');
    resetIdleTimer();
  }
}
function toggleInfoModal(open) {
  state.isModalOpen = typeof open === 'boolean' ? open : !state.isModalOpen;
  if (state.isModalOpen) {
    els.infoModal.classList.remove('opacity-0','pointer-events-none');
    els.infoModalCard.classList.remove('scale-95');
    els.infoModalCard.classList.add('scale-100');
    clearTimeout(state.idleTimer);
  } else {
    els.infoModal.classList.add('opacity-0','pointer-events-none');
    els.infoModalCard.classList.add('scale-95');
    els.infoModalCard.classList.remove('scale-100');
    resetIdleTimer();
  }
}
function toggleFeedbackModal(open) {
  state.isFeedbackOpen = typeof open === 'boolean' ? open : !state.isFeedbackOpen;
  if (state.isFeedbackOpen) {
    els.feedbackModal.classList.remove('opacity-0','pointer-events-none');
    els.feedbackCard.classList.remove('scale-95');
    els.feedbackCard.classList.add('scale-100');
  } else {
    els.feedbackModal.classList.add('opacity-0','pointer-events-none');
    els.feedbackCard.classList.add('scale-95');
    els.feedbackCard.classList.remove('scale-100');
  }
}
function applyAspectRatio(mode) {
  state.currentAspect = mode;
  const targets = [els.iframe, document.querySelector('#player-slot')].filter(Boolean);
  targets.forEach(el => {
    el.classList.remove('aspect-mode-16-9','aspect-mode-stretch','aspect-mode-4-3');
    if (mode === 'stretch') el.classList.add('aspect-mode-stretch');
    else if (mode === '4-3') el.classList.add('aspect-mode-4-3');
    else el.classList.add('aspect-mode-16-9');
  });
  showToast(`Formato: ${mode.toUpperCase()}`);
}
function togglePlayPause() {
  const ap = state.activePlayer;
  if (ap && ap.type === 'native') {
    if (ap.el.paused) ap.el.play().catch(()=>{});
    else ap.el.pause();
    return;
  }
  if (state.isPlaying) {
    try { els.iframe.contentWindow.postMessage({ action: 'pause' }, '*'); } catch(e){}
    state.isPlaying = false;
    if (els.legendPlayLabel) els.legendPlayLabel.textContent = 'Reproducir';
    triggerActionFlash(ICONS.pause);
  } else {
    try { els.iframe.contentWindow.postMessage({ action: 'play' }, '*'); } catch(e){}
    state.isPlaying = true;
    if (els.legendPlayLabel) els.legendPlayLabel.textContent = 'Pausar';
    triggerActionFlash(ICONS.play);
  }
  showHUD(); resetIdleTimer();
}
function rewind10() {
  const ap = state.activePlayer;
  if (ap && ap.type === 'native') {
    ap.el.currentTime = Math.max(0, ap.el.currentTime - 10);
  } else {
    state.currentTime = Math.max(0, state.currentTime - 10);
    try { els.iframe.contentWindow.postMessage({ action: 'seek', position: state.currentTime }, '*'); } catch(e){}
    updateScrubberUI();
  }
  triggerActionFlash(ICONS.rewind);
  showHUD(); resetIdleTimer();
}
function forward10() {
  const ap = state.activePlayer;
  if (ap && ap.type === 'native') {
    ap.el.currentTime = Math.min(ap.el.duration || state.duration, ap.el.currentTime + 10);
  } else {
    state.currentTime = Math.min(state.duration, state.currentTime + 10);
    try { els.iframe.contentWindow.postMessage({ action: 'seek', position: state.currentTime }, '*'); } catch(e){}
    updateScrubberUI();
  }
  triggerActionFlash(ICONS.forward);
  showHUD(); resetIdleTimer();
}
document.querySelectorAll('#group-formato-pantalla button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#group-formato-pantalla button').forEach(b => b.classList.remove('tv-btn-active'));
    btn.classList.add('tv-btn-active');
    applyAspectRatio(btn.dataset.aspect);
  });
});
document.querySelectorAll('#group-audio-options button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#group-audio-options button').forEach(b => b.classList.remove('tv-btn-active'));
    btn.classList.add('tv-btn-active');
    state.currentAudio = btn.dataset.audio;
    const labels = { latino:'🇲🇽 Español Latino', castellano:'🇪🇸 Castellano', ingles:'🇺🇸 Inglés VOSE' };
    if (els.badgeActiveAudio) els.badgeActiveAudio.textContent = (labels[btn.dataset.audio] || btn.dataset.audio) + ' (Activo)';
    try { els.iframe.contentWindow.postMessage({ action: 'setAudio', audio: btn.dataset.audio }, '*'); } catch(e){}
    showToast('Audio: ' + (labels[btn.dataset.audio] || btn.dataset.audio));
  });
});
document.querySelectorAll('#group-subtitle-options button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#group-subtitle-options button').forEach(b => b.classList.remove('tv-btn-active'));
    btn.classList.add('tv-btn-active');
    state.currentSubtitle = btn.dataset.sub;
    if (els.badgeActiveSubtitle) els.badgeActiveSubtitle.textContent = btn.dataset.sub === 'off' ? 'DESACTIVADOS' : btn.dataset.sub.toUpperCase();
    try { els.iframe.contentWindow.postMessage({ action: 'setSubtitle', lang: btn.dataset.sub }, '*'); } catch(e){}
    showToast(btn.dataset.sub === 'off' ? 'Subtítulos desactivados' : 'Subtítulos: ' + btn.dataset.sub);
  });
});
els.btnToggleOptions.addEventListener('click', e => { e.stopPropagation(); toggleOptionsDrawer(); });
els.btnInfo.addEventListener('click', () => toggleInfoModal(true));
els.posterThumb.addEventListener('click', () => toggleInfoModal(true));
els.btnCloseModal.addEventListener('click', () => toggleInfoModal(false));
els.btnModalPlay.addEventListener('click', () => { toggleInfoModal(false); togglePlayPause(); });
els.btnBarFeedback.addEventListener('click', () => toggleFeedbackModal(true));
els.btnCloseFeedback.addEventListener('click', () => toggleFeedbackModal(false));
els.btnCancelFeedback.addEventListener('click', () => toggleFeedbackModal(false));
els.feedbackForm.addEventListener('submit', e => {
  e.preventDefault(); toggleFeedbackModal(false);
  showToast('Reporte enviado'); triggerActionFlash(ICONS.check);
});
els.btnExit.addEventListener('click', () => {
  if (state.isFeedbackOpen) toggleFeedbackModal(false);
  else if (state.isOptionsDrawerOpen) toggleOptionsDrawer(false);
  else if (state.isModalOpen) toggleInfoModal(false);
  else hideHUD();
});
els.btnRevealHud.addEventListener('click', () => {
  state.isDirectMode = false;
  document.body.classList.remove('mode-direct');
  showHUD(); resetIdleTimer();
});
els.btnPlay.addEventListener('click', togglePlayPause);
els.btnRewind.addEventListener('click', rewind10);
els.btnForward.addEventListener('click', forward10);
els.bottomHoverDetector.addEventListener('mouseenter', () => {
  if (!state.isDirectMode) { showHUD(); resetIdleTimer(); }
});
els.slider.addEventListener('pointerdown', () => { state.isSeeking = true; });
els.slider.addEventListener('input', e => {
  const pct = parseFloat(e.target.value);
  state.currentTime = Math.floor((pct/100)*(state.duration||0));
  els.progressFill.style.width = `${pct}%`;
  els.currentTimeText.textContent = formatTime(state.currentTime);
  resetIdleTimer();
});
els.slider.addEventListener('change', e => {
  state.isSeeking = false;
  const pct = parseFloat(e.target.value);
  state.currentTime = Math.floor((pct/100)*(state.duration||0));
  const ap = state.activePlayer;
  if (ap && ap.type === 'native') ap.el.currentTime = state.currentTime;
  else { try { els.iframe.contentWindow.postMessage({ action: 'seek', position: state.currentTime }, '*'); } catch(e){} }
  resetIdleTimer();
});
els.slider.addEventListener('pointerup', () => { state.isSeeking = false; });
window.addEventListener('mousemove', resetIdleTimer);
window.addEventListener('touchstart', resetIdleTimer);
window.addEventListener('message', event => {
  const data = event.data;
  if (!data || typeof data !== 'object') return;
  let evt = data.event || data.name || data.action || data.type;
  if (!evt) return;
  switch (evt) {
    case 'position': case 'timeupdate':
      if (typeof data.position === 'number') state.currentTime = data.position;
      else if (typeof data.currentTime === 'number') state.currentTime = data.currentTime;
      if (typeof data.duration === 'number' && data.duration > 0) state.duration = data.duration;
      updateScrubberUI(); break;
    case 'play': state.isPlaying = true; if (els.legendPlayLabel) els.legendPlayLabel.textContent = 'Pausar'; break;
    case 'pause': state.isPlaying = false; if (els.legendPlayLabel) els.legendPlayLabel.textContent = 'Reproducir'; break;
    case 'ready': hideLoad(); break;
  }
});
window.addEventListener('keydown', e => {
  if (state.isFeedbackOpen && e.key === 'Escape') { toggleFeedbackModal(false); return; }
  switch (e.key) {
    case ' ': case 'Enter':
      if (state.isModalOpen) { e.preventDefault(); toggleInfoModal(false); return; }
      e.preventDefault(); togglePlayPause(); break;
    case 'ArrowLeft': if (state.isModalOpen) return; e.preventDefault(); rewind10(); break;
    case 'ArrowRight': if (state.isModalOpen) return; e.preventDefault(); forward10(); break;
    case 'ArrowUp': e.preventDefault(); if (state.isOptionsDrawerOpen) toggleOptionsDrawer(false); toggleInfoModal(!state.isModalOpen); break;
    case 'ArrowDown': e.preventDefault(); if (state.isModalOpen) toggleInfoModal(false); toggleOptionsDrawer(); break;
    case 'f': case 'F':
      e.preventDefault();
      if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
      else document.exitFullscreen().catch(()=>{});
      break;
    case 'Escape': case 'Backspace':
      e.preventDefault();
      if (state.isFeedbackOpen) toggleFeedbackModal(false);
      else if (state.isOptionsDrawerOpen) toggleOptionsDrawer(false);
      else if (state.isModalOpen) toggleInfoModal(false);
      else hideHUD(); break;
  }
});
updateScrubberUI();
resetIdleTimer();
loadServersFromAPI();
</script>
</body></html>
