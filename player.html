<!DOCTYPE html>
<html class="h-full bg-black select-none" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Smart TV Player</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script>
  tailwind.config = {
    theme: { extend: {
      colors: { brand: { cyan:'#00d2ff', blue:'#3b82f6', dark:'#0a0a0c', track:'#383a42' } },
      fontFamily: { sans: ['Inter','system-ui','-apple-system','Segoe UI','Roboto','sans-serif'] }
    }}
  }
</script>
<style>
  input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;cursor:pointer}
  input[type=range]:focus{outline:none}
  input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:9999px;background:transparent}
  input[type=range]::-moz-range-track{height:4px;border-radius:9999px;background:transparent}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;height:14px;width:14px;border-radius:50%;background:#00d2ff;margin-top:-5px;box-shadow:0 0 10px rgba(0,210,255,.85);border:2px solid #fff}
  input[type=range]::-moz-range-thumb{height:14px;width:14px;border-radius:50%;background:#00d2ff;border:2px solid #fff}
  .hud-transition{transition:opacity .4s cubic-bezier(.16,1,.3,1),transform .4s cubic-bezier(.16,1,.3,1)}
  .hud-hidden{opacity:0!important;pointer-events:none!important;transform:translateY(12px)}
  .key-badge{background:rgba(255,255,255,.9);color:#000;font-size:10px;font-weight:800;border-radius:2px;padding:1px 4px;display:inline-flex;align-items:center;line-height:1.2}
  .aspect-normal  #player-slot{object-fit:contain;transform:none;width:100%;height:100%}
  .aspect-stretch #player-slot{object-fit:fill;transform:none;width:100%;height:100%}
  .aspect-16-9    #player-slot{object-fit:contain;transform:none;width:100%;height:100%}
  .aspect-4-3     #player-slot{object-fit:contain;transform:scale(.75);width:100%;height:100%}
  .aspect-zoom    #player-slot{object-fit:contain;transform:scale(1.33);width:100%;height:100%}
  .tv-btn-normal{background:rgba(43,50,63,.78);backdrop-filter:blur(8px);color:#d1d5db;transition:all .2s ease}
  .tv-btn-normal:hover{background:rgba(60,70,88,.9);color:#fff}
  .tv-btn-active{background:rgba(72,85,107,.95)!important;backdrop-filter:blur(8px);color:#fff!important;box-shadow:0 2px 8px rgba(0,0,0,.35)}
  .srv-btn{position:relative;padding:8px 14px;font-size:12px;border-radius:8px;display:inline-flex;align-items:center;gap:8px;min-height:38px}
  .srv-btn .srv-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.25);flex-shrink:0;transition:all .2s}
  .srv-btn.sl .srv-dot{background:#f59e0b;box-shadow:0 0 8px #f59e0b;animation:blink 1s ease-in-out infinite}
  .srv-btn.so .srv-dot{background:#22c55e;box-shadow:0 0 6px #22c55e}
  .srv-btn.se .srv-dot{background:#ef4444;box-shadow:0 0 6px #ef4444}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
  .srv-badge{font-size:9px;font-weight:800;letter-spacing:.5px;padding:2px 6px;border-radius:4px;line-height:1.3}
  .srv-badge.hls{background:rgba(34,197,94,.18);color:#4ade80;border:1px solid rgba(34,197,94,.35)}
  .srv-badge.iframe{background:rgba(148,163,184,.15);color:#94a3b8;border:1px solid rgba(148,163,184,.3)}
  .srv-badge.error{background:#dc2626;color:#fff}
  .srv-badge.checking{background:rgba(251,191,36,.1);color:#fbbf24;border:1px solid rgba(251,191,36,.25)}
  .lang-tab{padding:6px 14px;font-size:12px;font-weight:600;color:rgba(255,255,255,.5);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s}
  .lang-tab:hover{color:#fff;background:rgba(255,255,255,.04)}
  .lang-tab.act{color:#00d2ff;border-bottom-color:#00d2ff;background:rgba(0,210,255,.06)}
  .options-drawer-panel{transition:opacity .35s cubic-bezier(.16,1,.3,1),transform .35s cubic-bezier(.16,1,.3,1),max-height .35s cubic-bezier(.16,1,.3,1)}
  .options-drawer-collapsed{opacity:0;pointer-events:none;transform:translateY(18px) scale(.98);max-height:0;margin-bottom:0!important;padding:0!important;overflow:hidden}
  .options-drawer-expanded{opacity:1;pointer-events:auto;transform:translateY(0) scale(1);max-height:400px}
  #player-slot{position:absolute;inset:0;width:100%;height:100%;border:0;transition:transform .3s ease}
  #load-overlay{position:absolute;inset:0;z-index:5;display:none;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:rgba(0,0,0,.65);backdrop-filter:blur(16px);transition:opacity .35s}
  #load-overlay.on{display:flex}
  #load-overlay.off{opacity:0;pointer-events:none}
  #load-overlay .ld-spin{width:36px;height:36px;border:3px solid rgba(255,255,255,.12);border-top-color:#00d2ff;border-radius:50%;animation:spin .9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #load-overlay .ld-msg{font-size:14px;color:rgba(255,255,255,.7);text-align:center;padding:0 20px}
</style>
</head>
<body class="h-full w-full overflow-hidden bg-black text-white font-sans antialiased relative">

<main class="relative w-full h-full bg-black overflow-hidden flex items-center justify-center" id="player-container">

  <div class="absolute inset-0 z-0 overflow-hidden" id="poster-backdrop-container">
    <img alt="" class="w-full h-full object-cover object-center filter brightness-[0.9] select-none" id="poster-backdrop-img" src=""/>
    <div class="absolute inset-0 bg-gradient-to-t from-black/85 via-black/20 to-black/35 pointer-events-none"></div>
  </div>

  <div class="absolute inset-0 z-20 flex items-center justify-center pointer-events-none transition-all duration-500" id="center-play-wrapper">
    <button aria-label="Iniciar" class="w-20 h-20 sm:w-24 sm:h-24 rounded-full bg-blue-600 hover:bg-blue-500 active:scale-95 shadow-[0_0_35px_rgba(37,99,235,.75)] flex items-center justify-center pointer-events-auto transition-transform duration-200 group focus:outline-none" id="btn-center-play">
      <svg class="w-10 h-10 sm:w-11 sm:h-11 text-white fill-current ml-1 group-hover:scale-110 transition-transform" viewBox="0 0 24 24"><polygon points="6,4 20,12 6,20"></polygon></svg>
    </button>
  </div>

  <div class="w-full h-full flex items-center justify-center transition-all duration-300 relative overflow-hidden z-10 opacity-0 pointer-events-none aspect-normal" id="video-wrapper">
    <div id="player-slot-host" class="w-full h-full absolute inset-0 z-0"></div>
    <div id="load-overlay">
      <div class="ld-spin"></div>
      <div class="ld-msg" id="load-msg">Verificando servidor…</div>
    </div>
  </div>

  <div class="absolute inset-0 z-10 cursor-pointer hidden" id="interaction-catcher"></div>

  <div class="absolute z-30 pointer-events-none opacity-0 scale-75 transition-all duration-300 ease-out flex items-center justify-center p-6 rounded-full bg-black/60 backdrop-blur-md border border-white/10 text-white shadow-2xl" id="action-flash">
    <svg class="w-12 h-12" fill="currentColor" id="action-flash-icon" viewBox="0 0 24 24"></svg>
  </div>

  <div class="absolute inset-x-0 bottom-0 z-30 hud-element hud-transition pb-2 pt-28 bg-gradient-to-t from-black via-black/85 to-transparent pointer-events-none flex flex-col justify-end" id="osd-hud">
    <div class="w-full max-w-[1920px] mx-auto px-6 md:px-12 lg:px-14 pb-2 pointer-events-auto space-y-3">

      <div class="options-drawer-panel options-drawer-collapsed bg-zinc-950/85 backdrop-blur-xl border border-white/15 rounded-2xl p-4 sm:p-5 shadow-[0_20px_50px_rgba(0,0,0,.85)] flex flex-col gap-3.5 mb-2" id="options-panel-container">

        <div class="flex flex-wrap items-end justify-between gap-x-6 gap-y-3">
          <div class="space-y-1.5">
            <span class="block text-[11px] font-semibold text-neutral-400 tracking-wider uppercase">Formato de pantalla</span>
            <div class="inline-flex rounded overflow-hidden shadow-lg border border-white/10 divide-x divide-white/10">
              <button class="tv-btn-normal tv-btn-active px-4 py-2 text-xs font-medium transition" data-aspect="normal" type="button">Normal</button>
              <button class="tv-btn-normal px-4 py-2 text-xs font-medium transition" data-aspect="stretch" type="button">Completa</button>
              <button class="tv-btn-normal px-4 py-2 text-xs font-medium transition" data-aspect="16-9" type="button">16:9</button>
              <button class="tv-btn-normal px-4 py-2 text-xs font-medium transition" data-aspect="4-3" type="button">4:3</button>
              <button class="tv-btn-normal px-4 py-2 text-xs font-medium transition" data-aspect="zoom" type="button">Zoom</button>
            </div>
          </div>
          <div class="space-y-1.5">
            <span class="block text-[11px] font-semibold text-neutral-400 tracking-wider uppercase">Resolución</span>
            <div class="inline-flex rounded overflow-hidden shadow-lg border border-white/10 divide-x divide-white/10" id="group-resolucion-bar">
              <button class="tv-btn-normal px-4 py-2 text-xs font-medium transition" data-res="auto" type="button">Auto</button>
              <button class="tv-btn-normal px-4 py-2 text-xs font-medium transition" data-res="480p" type="button">480p</button>
              <button class="tv-btn-normal tv-btn-active px-4 py-2 text-xs font-medium transition" data-res="720p" type="button">720p</button>
              <button class="tv-btn-normal px-4 py-2 text-xs font-medium transition" data-res="1080p" type="button">1080p</button>
            </div>
          </div>
        </div>

        <div class="flex flex-col gap-2">
          <span class="block text-[11px] font-semibold text-neutral-400 tracking-wider uppercase">Idioma y servidor</span>
          <div class="bg-white/[.03] rounded-xl border border-white/10 overflow-hidden">
            <div class="flex border-b border-white/10 bg-white/[.02]" id="lang-tabs"></div>
            <div class="p-3 flex flex-wrap gap-2" id="server-buttons"></div>
            <div class="px-3 py-2 border-t border-white/10 bg-black/20 flex items-center gap-3">
              <div class="w-3 h-3 rounded-full border-2 border-white/15 border-t-cyan-400 animate-spin flex-shrink-0" id="verify-spin"></div>
              <span class="text-[11px] text-neutral-400 flex-1" id="verify-text">Iniciando…</span>
              <span class="text-[10px] text-neutral-500 font-mono" id="verify-count">0/0</span>
            </div>
          </div>
        </div>

        <div class="flex flex-wrap items-center gap-2 pt-1">
          <button class="tv-btn-normal px-5 py-2 text-xs font-medium transition" id="btn-bar-idioma" type="button">Audio / Subtítulos</button>
          <button class="tv-btn-normal px-5 py-2 text-xs font-medium transition" id="btn-bar-feedback" type="button">Reportar</button>
          <button class="tv-btn-normal px-5 py-2 text-xs font-medium transition ml-auto" id="btn-bar-reload" type="button">↻ Reintentar</button>
        </div>
      </div>

      <div class="flex items-center space-x-4 pt-1">
        <span class="text-sm md:text-base font-medium text-white min-w-[50px] text-right font-mono" id="current-time-text">00:00</span>
        <div class="relative flex-grow flex items-center group py-2">
          <div class="w-full h-1 bg-brand-track rounded-full overflow-hidden relative pointer-events-none">
            <div class="h-full bg-gradient-to-r from-blue-500 to-brand-cyan transition-all duration-75" id="progress-fill" style="width:0%"></div>
          </div>
          <input aria-label="Seek" class="absolute inset-0 w-full h-full opacity-100 cursor-pointer z-10" id="seek-slider" max="100" min="0" step="0.05" type="range" value="0"/>
        </div>
        <span class="text-sm md:text-base font-medium text-gray-300 min-w-[65px] font-mono" id="duration-time-text">--:--</span>
      </div>

      <div class="flex flex-col md:flex-row md:items-end justify-between gap-4 pt-1">
        <div class="flex items-end space-x-4">
          <div class="w-14 h-20 sm:w-16 sm:h-24 md:w-20 md:h-28 rounded overflow-hidden shadow-2xl bg-neutral-900 border border-white/10 flex-shrink-0 relative group cursor-pointer hover:border-brand-cyan transition" id="poster-thumb">
            <img alt="Poster" class="w-full h-full object-cover" id="poster-img" src=""/>
            <div class="absolute inset-0 bg-black/30 group-hover:bg-transparent transition"></div>
          </div>
          <div class="pb-1">
            <h1 class="text-lg md:text-2xl lg:text-3xl font-normal text-white drop-shadow" id="movie-title">Cargando…</h1>
            <p class="text-xs md:text-sm text-neutral-400 font-light hidden sm:block mt-0.5" id="movie-meta">—</p>
          </div>
        </div>

        <div class="flex flex-wrap items-center gap-3 sm:gap-4 pb-2 text-xs md:text-sm text-neutral-200">
          <button class="flex items-center space-x-1.5 hover:text-white transition" id="btn-legend-exit" type="button"><span class="key-badge">EXIT</span><span>Vuelta</span></button>
          <button class="flex items-center space-x-1.5 hover:text-white transition" id="btn-legend-play" type="button"><span class="key-badge">OK</span><span id="legend-play-label">Reproducir/Pausar</span></button>
          <button class="flex items-center space-x-1.5 hover:text-white transition" id="btn-legend-rewind" type="button"><span class="key-badge">◀</span><span>Detrás</span></button>
          <button class="flex items-center space-x-1.5 hover:text-white transition" id="btn-legend-forward" type="button"><span class="key-badge">▶</span><span>Adelante</span></button>
          <button class="flex items-center space-x-1.5 hover:text-white transition" id="btn-legend-info" type="button"><span class="key-badge bg-cyan-400 text-black">▲</span><span class="text-white">Info</span></button>
        </div>
      </div>
    </div>

    <div class="flex justify-center pb-2 pointer-events-auto">
      <button aria-label="Opciones" class="text-neutral-400 hover:text-white focus:outline-none transition-all duration-300 hover:scale-125 p-2 rounded-full hover:bg-white/10" id="btn-toggle-options">
        <svg class="w-7 h-7 transform transition-transform duration-300 ease-out" fill="none" id="toggle-chevron" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"></path></svg>
      </button>
    </div>
  </div>

  <button aria-label="Mostrar controles" class="fixed bottom-3 left-1/2 -translate-x-1/2 z-30 opacity-0 pointer-events-none transition-all duration-300 p-2 text-white/70 hover:text-white bg-black/40 backdrop-blur rounded-full border border-white/10" id="btn-reveal-hud">
    <svg class="w-5 h-5 rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"></path></svg>
  </button>

  <div class="fixed inset-0 z-40 bg-black/75 backdrop-blur-md opacity-0 pointer-events-none transition-all duration-300 flex items-end sm:items-center justify-center p-3 sm:p-6" id="settings-modal">
    <div class="bg-zinc-950/95 border border-white/15 w-full max-w-4xl rounded-2xl shadow-2xl backdrop-blur-xl transform translate-y-6 scale-95 transition-all duration-300 overflow-hidden flex flex-col max-h-[88vh]" id="settings-card">
      <div class="flex items-center justify-between px-6 py-4 border-b border-white/10 bg-white/[.02]">
        <h3 class="text-base font-semibold text-white">Audio y Subtítulos</h3>
        <button class="text-neutral-400 hover:text-white p-2 rounded-lg bg-white/5 transition" id="btn-close-settings"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg></button>
      </div>
      <div class="p-6 space-y-4 text-sm">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="bg-white/5 p-3.5 rounded-xl border border-white/10">
            <label class="block text-xs font-medium text-neutral-300 mb-2">Pista de Audio</label>
            <div class="grid grid-cols-3 gap-2" id="group-audio-tracks">
              <button class="px-2.5 py-2 text-xs rounded-lg border border-cyan-400 bg-cyan-500/20 text-cyan-300" data-audio="latino"><span>Español</span><span class="block text-[10px] text-cyan-400/80">Latino</span></button>
              <button class="px-2.5 py-2 text-xs rounded-lg border border-white/10 bg-white/5 text-neutral-300" data-audio="castellano"><span>Castellano</span><span class="block text-[10px] text-neutral-400">España</span></button>
              <button class="px-2.5 py-2 text-xs rounded-lg border border-white/10 bg-white/5 text-neutral-300" data-audio="original"><span>Inglés</span><span class="block text-[10px] text-neutral-400">VO</span></button>
            </div>
          </div>
          <div class="bg-white/5 p-3.5 rounded-xl border border-white/10">
            <label class="block text-xs font-medium text-neutral-300 mb-2">Subtítulos</label>
            <div class="grid grid-cols-3 gap-2" id="group-subtitles">
              <button class="px-2.5 py-2 text-xs rounded-lg border border-cyan-400 bg-cyan-500/20 text-cyan-300" data-sub="off"><span>Off</span><span class="block text-[10px] text-cyan-400/80">—</span></button>
              <button class="px-2.5 py-2 text-xs rounded-lg border border-white/10 bg-white/5 text-neutral-300" data-sub="es"><span>Español</span><span class="block text-[10px] text-neutral-400">CC</span></button>
              <button class="px-2.5 py-2 text-xs rounded-lg border border-white/10 bg-white/5 text-neutral-300" data-sub="en"><span>Inglés</span><span class="block text-[10px] text-neutral-400">CC</span></button>
            </div>
          </div>
        </div>
      </div>
      <div class="flex items-center justify-end px-6 py-4 border-t border-white/10 bg-white/[.02]">
        <button class="px-5 py-2 rounded-lg bg-cyan-500 hover:bg-cyan-400 text-black font-semibold text-xs transition" id="btn-apply-settings">Listo</button>
      </div>
    </div>
  </div>

  <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md opacity-0 pointer-events-none transition-opacity duration-300 flex items-center justify-center p-4" id="info-modal">
    <div class="bg-zinc-900/95 border border-white/15 max-w-2xl w-full rounded-2xl p-6 shadow-2xl relative transform scale-95 transition-transform duration-300" id="info-modal-card">
      <button class="absolute top-4 right-4 text-neutral-400 hover:text-white p-2 rounded-lg bg-white/5 transition" id="btn-close-modal"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg></button>
      <div class="flex flex-col sm:flex-row gap-6">
        <img alt="Poster" class="w-32 h-48 sm:w-44 sm:h-64 object-cover rounded-lg border border-white/10 flex-shrink-0 mx-auto" id="info-poster" src=""/>
        <div class="flex-1 space-y-3">
          <div class="flex items-center gap-2 flex-wrap" id="info-badges"></div>
          <h2 class="text-2xl font-bold text-white" id="info-title">—</h2>
          <p class="text-neutral-300 text-sm leading-relaxed" id="info-description">—</p>
          <div class="pt-2 border-t border-white/10 grid grid-cols-2 gap-2 text-xs text-neutral-400" id="info-meta"></div>
        </div>
      </div>
    </div>
  </div>

</main>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   CONFIGURACIÓN — IMPORTANTE: Cambia API_URL cuando despliegues en Render
   ═══════════════════════════════════════════════════════════════════════ */
const CONFIG = {
  API_URL: 'https://mi-player-api.onrender.com',   // ← En local. En producción pon tu URL de Render.
  DEFAULT_TMDB_ID: '550',
  DEFAULT_TYPE:    'movie',
  idleTimeout:  5500,
  verifyTimeout: 15000,
  autoAdvance:  true,
};

const state = {
  movie: { title:'Cargando…', poster:'', backdrop:'', duration:0, year:'', genres:'', overview:'', runtime:0, voteAverage:0, originalTitle:'' },
  servers: {},
  serverBadges: {},
  currentLang: null,
  currentServerName: null,
  isPlaying:false, hasStarted:false,
  currentTime:0, duration:0,
  isHudVisible:true, isOptionsDrawerOpen:false,
  isModalOpen:false, isSettingsOpen:false,
  isSeeking:false, idleTimer:null,
  currentAspect:'normal',
  activePlayer: null,
};

const $ = id => document.getElementById(id);
const els = {
  wrapper:$('video-wrapper'), slotHost:$('player-slot-host'),
  centerPlayWrap:$('center-play-wrapper'), btnCenterPlay:$('btn-center-play'),
  hud:$('osd-hud'), slider:$('seek-slider'), progressFill:$('progress-fill'),
  currentTimeText:$('current-time-text'), durationTimeText:$('duration-time-text'),
  optionsPanel:$('options-panel-container'), btnToggleOptions:$('btn-toggle-options'),
  btnRevealHud:$('btn-reveal-hud'), toggleChevron:$('toggle-chevron'),
  actionFlash:$('action-flash'), actionFlashIcon:$('action-flash-icon'),
  interactionCatcher:$('interaction-catcher'),
  infoModal:$('info-modal'), infoModalCard:$('info-modal-card'),
  langTabs:$('lang-tabs'), serverButtons:$('server-buttons'),
  verifyText:$('verify-text'), verifyCount:$('verify-count'),
  loadOverlay:$('load-overlay'), loadMsg:$('load-msg'),
  legendPlayLabel:$('legend-play-label'),
};

const ICONS = {
  play:'<polygon points="5 3 19 12 5 21 5 3"/>',
  pause:'<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>',
  fwd:'<polygon points="13 19 22 12 13 5 13 19"/><polygon points="2 19 11 12 2 5 2 19"/>',
  rew:'<polygon points="11 19 2 12 11 5 11 19"/><polygon points="22 19 13 12 22 5 22 19"/>',
  error:'<circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><line x1="12" y1="8" x2="12" y2="12" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="16" r="1" fill="currentColor"/>'
};

function detectType(name, url) {
  if (!url) return 'empty';
  if (/\.m3u8(\?|$)/i.test(url)) return 'hls';
  if (/\.(mp4|webm|mkv|mov|ts)(\?|$)/i.test(url)) return 'mp4';
  return 'iframe';
}
function baseName(name) { return (name || '').replace(/\s+\d+$/, '').trim(); }
function formatTime(s) {
  if (isNaN(s) || s < 0) s = 0;
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), x = Math.floor(s%60);
  const p = n => String(n).padStart(2,'0');
  return h > 0 ? `${p(h)}:${p(m)}:${p(x)}` : `${p(m)}:${p(x)}`;
}
function showLoad(msg) {
  if (els.loadMsg) els.loadMsg.textContent = msg || 'Cargando…';
  if (els.loadOverlay) { els.loadOverlay.classList.add('on'); els.loadOverlay.classList.remove('off'); }
}
function hideLoad() {
  if (els.loadOverlay) {
    els.loadOverlay.classList.add('off');
    setTimeout(() => els.loadOverlay.classList.remove('on'), 350);
  }
}
function updateVerifyBar(done, total, msg) {
  if (els.verifyText) els.verifyText.textContent = msg || 'Verificando…';
  if (els.verifyCount) els.verifyCount.textContent = `${done}/${total}`;
  const spin = $('verify-spin');
  if (spin) spin.style.display = (done >= total) ? 'none' : '';
}

async function verifyServer(name, url) {
  if (!url) return 'empty';
  const type = detectType(name, url);
  if (type === 'hls' || type === 'mp4') return type;
  try {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 5000);
    await fetch(new URL(url).origin, { method: 'HEAD', mode: 'no-cors', signal: ctrl.signal });
    clearTimeout(t);
    return 'iframe';
  } catch(e) { return 'iframe'; }
}

async function verifyAllServers(lang) {
  const servers = state.servers[lang] || {};
  const names = Object.keys(servers);
  if (!names.length) return;
  names.forEach(n => state.serverBadges[n] = 'checking');
  renderServerButtons(lang);
  updateVerifyBar(0, names.length, 'Verificando servidores…');
  let done = 0;
  const results = await Promise.all(names.map(async name => {
    const type = await verifyServer(name, servers[name]);
    done++;
    state.serverBadges[name] = type === 'empty' ? 'error' : type;
    updateVerifyBar(done, names.length, `Verificando… (${done}/${names.length})`);
    return { name, type };
  }));
  const rank = { hls:0, mp4:1, iframe:2, error:3, empty:4 };
  const sorted = results.sort((a,b) => rank[a.type] - rank[b.type]);
  const reordered = {};
  sorted.forEach(r => reordered[r.name] = servers[r.name]);
  state.servers[lang] = reordered;
  renderServerButtons(lang);
  const ok = results.filter(r => r.type !== 'error' && r.type !== 'empty').length;
  updateVerifyBar(names.length, names.length, `✓ ${ok} de ${names.length} disponibles`);
}

function renderLangTabs() {
  const langs = Object.keys(state.servers);
  if (!langs.length) { els.langTabs.innerHTML = ''; return; }
  if (!state.currentLang || !langs.includes(state.currentLang)) {
    state.currentLang = langs.includes('latino') ? 'latino' : langs[0];
  }
  const META = { latino:'LATINO', español:'ESPAÑOL', castellano:'CASTELLANO', subtitulado:'SUBTITULADO' };
  els.langTabs.innerHTML = '';
  langs.forEach(lang => {
    const tab = document.createElement('button');
    tab.className = 'lang-tab' + (lang === state.currentLang ? ' act' : '');
    tab.textContent = META[lang] || lang.toUpperCase();
    tab.onclick = () => switchLang(lang);
    els.langTabs.appendChild(tab);
  });
}

function renderServerButtons(lang) {
  lang = lang || state.currentLang;
  const servers = state.servers[lang] || {};
  const names = Object.keys(servers);
  els.serverButtons.innerHTML = '';
  if (!names.length) {
    els.serverButtons.innerHTML = '<span class="text-xs text-neutral-500 italic px-2">Sin servidores</span>';
    return;
  }
  names.forEach(name => {
    const badge = state.serverBadges[name] || 'checking';
    const isActive = state.currentServerName === name;
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'tv-btn-normal srv-btn ' + (
      badge === 'error' ? 'se' : badge === 'checking' ? 'sl' : (isActive ? 'tv-btn-active so' : 'so')
    );
    const badgeHtml = {
      hls:'<span class="srv-badge hls">HLS</span>',
      mp4:'<span class="srv-badge hls">MP4</span>',
      iframe:'<span class="srv-badge iframe">IFRAME</span>',
      error:'<span class="srv-badge error">ERROR</span>',
      checking:'<span class="srv-badge checking">VERIF</span>',
    }[badge] || '';
    btn.innerHTML = `<span class="srv-dot"></span><span>${baseName(name)}</span>${badgeHtml}`;
    btn.onclick = () => {
      if (badge === 'error') { triggerActionFlash(ICONS.error); return; }
      loadServer(name, servers[name]);
    };
    els.serverButtons.appendChild(btn);
  });
}

function hydrateMetadata() {
  const m = state.movie;
  if (m.title) $('movie-title').textContent = m.title;
  $('movie-meta').textContent = [m.originalTitle, m.year, m.genres, m.voteAverage ? `★ ${m.voteAverage.toFixed(1)}` : ''].filter(Boolean).join(' • ');
  if (m.poster) { $('poster-img').src = m.poster; $('info-poster').src = m.poster; }
  if (m.backdrop) $('poster-backdrop-img').src = m.backdrop;
  $('info-title').textContent = m.title || '—';
  $('info-description').textContent = m.overview || '—';
  $('info-badges').innerHTML = m.year ? `
    <span class="px-2 py-0.5 text-xs font-semibold rounded bg-amber-500/20 text-amber-300 border border-amber-500/30">TMDB ${m.voteAverage?.toFixed(1) || '—'}</span>
    <span class="text-xs text-neutral-400">${m.year}</span>
    <span class="text-xs text-neutral-400">• ${m.runtime || '—'} min</span>
  ` : '';
  $('info-meta').innerHTML = m.genres ? `
    <div><strong class="text-neutral-200">Género:</strong> ${m.genres}</div>
    <div><strong class="text-neutral-200">Año:</strong> ${m.year || '—'}</div>
  ` : '';
  if (m.runtime) { state.duration = m.runtime * 60; updateScrubberUI(); }
}

function loadServer(name, url) {
  const type = detectType(name, url);
  state.currentServerName = name;
  destroyActivePlayer();
  els.slotHost.innerHTML = '';
  showLoad(`Cargando ${baseName(name)}…`);

  if (type === 'iframe') {
    const iframe = document.createElement('iframe');
    iframe.id = 'player-slot';
    iframe.className = 'w-full h-full absolute inset-0 z-0 border-0';
    iframe.setAttribute('allow', 'autoplay; fullscreen; encrypted-media; picture-in-picture');
    iframe.setAttribute('allowfullscreen', '');
    iframe.setAttribute('scrolling', 'no');
    iframe.setAttribute('referrerpolicy', 'no-referrer');
    iframe.src = url;
    let loaded = false;
    const guardTimer = setTimeout(() => {
      if (loaded || state.currentServerName !== name) return;
      handleServerFail(name);
    }, 18000);
    iframe.onload = () => {
      loaded = true;
      clearTimeout(guardTimer);
      hideLoad();
      els.wrapper.classList.add('opacity-100');
      els.wrapper.classList.remove('opacity-0', 'pointer-events-none');
      els.interactionCatcher.classList.remove('hidden');
      state.activePlayer = { type: 'iframe', el: iframe };
    };
    iframe.onerror = () => { clearTimeout(guardTimer); handleServerFail(name); };
    els.slotHost.appendChild(iframe);
  } else {
    const video = document.createElement('video');
    video.id = 'player-slot';
    video.className = 'w-full h-full absolute inset-0 z-0 bg-black';
    video.controls = false;
    video.playsInline = true;
    video.preload = 'metadata';
    video.crossOrigin = 'anonymous';
    els.slotHost.appendChild(video);
    let ready = false;
    const guardTimer = setTimeout(() => {
      if (ready || state.currentServerName !== name) return;
      handleServerFail(name);
    }, 20000);
    const onReady = () => {
      ready = true;
      clearTimeout(guardTimer);
      wireNativeVideo(video);
      hideLoad();
      els.wrapper.classList.add('opacity-100');
      els.wrapper.classList.remove('opacity-0', 'pointer-events-none');
      els.interactionCatcher.classList.remove('hidden');
      if (state.hasStarted) video.play().catch(()=>{});
    };
    if (type === 'hls' && window.Hls && Hls.isSupported()) {
      const hls = new Hls({ maxBufferLength: 30, enableWorker: true });
      hls.loadSource(url);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => { onReady(); state.activePlayer = { type:'hls', el:video, hls }; });
      hls.on(Hls.Events.ERROR, (e, data) => {
        if (!data.fatal) return;
        if (data.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
        else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
        else { clearTimeout(guardTimer); handleServerFail(name); }
      });
    } else {
      video.src = url;
      video.addEventListener('loadedmetadata', () => { onReady(); state.activePlayer = { type:'mp4', el:video }; }, { once:true });
      video.addEventListener('error', () => { clearTimeout(guardTimer); handleServerFail(name); }, { once:true });
    }
  }
}

function destroyActivePlayer() {
  const ap = state.activePlayer;
  if (!ap) return;
  if (ap.hls) try { ap.hls.destroy(); } catch(e){}
  if (ap.type === 'hls' || ap.type === 'mp4') {
    try { ap.el.pause(); ap.el.src = ''; ap.el.load(); } catch(e){}
  } else if (ap.type === 'iframe') {
    try { ap.el.src = 'about:blank'; } catch(e){}
  }
  state.activePlayer = null;
}

function wireNativeVideo(video) {
  if (video._wired) return;
  video._wired = true;
  video.addEventListener('loadedmetadata', () => {
    if (isFinite(video.duration) && video.duration > 0) { state.duration = video.duration; updateScrubberUI(); }
  });
  video.addEventListener('timeupdate', () => {
    if (state.isSeeking) return;
    state.currentTime = video.currentTime;
    updateScrubberUI();
  });
  video.addEventListener('play', () => { updatePlayPauseUI(true); hideLoad(); });
  video.addEventListener('pause', () => updatePlayPauseUI(false));
  video.addEventListener('playing', () => hideLoad());
  video.addEventListener('waiting', () => showLoad('Cargando…'));
}

function handleServerFail(name) {
  hideLoad();
  state.serverBadges[name] = 'error';
  renderServerButtons(state.currentLang);
  if (!CONFIG.autoAdvance) { triggerActionFlash(ICONS.error); return; }
  const servers = state.servers[state.currentLang] || {};
  const next = Object.keys(servers).find(n => n !== name && state.serverBadges[n] !== 'error');
  if (next) {
    showLoad(`Falló. Probando ${baseName(next)}…`);
    setTimeout(() => loadServer(next, servers[next]), 800);
  } else {
    showLoad('Ningún servidor respondió. Reintentá con ▼');
    setTimeout(hideLoad, 3000);
  }
}

function launchPlayer() {
  if (!state.currentServerName) {
    const servers = state.servers[state.currentLang] || {};
    const first = Object.keys(servers).find(n => state.serverBadges[n] !== 'error');
    if (!first) { triggerActionFlash(ICONS.error); return; }
    loadServer(first, servers[first]);
  }
  state.hasStarted = true;
  state.isPlaying = true;
  els.centerPlayWrap.classList.add('opacity-0', 'scale-90', 'pointer-events-none');
  els.wrapper.classList.remove('opacity-0', 'pointer-events-none');
  els.wrapper.classList.add('opacity-100');
  els.interactionCatcher.classList.remove('hidden');
  const ap = state.activePlayer;
  if (ap && (ap.type === 'hls' || ap.type === 'mp4')) ap.el.play().catch(()=>{});
  sendPlayerAction('play');
  updatePlayPauseUI(true);
  triggerActionFlash(ICONS.play);
  resetIdleTimer();
}

function sendPlayerAction(action, extra = {}) {
  const ap = state.activePlayer;
  if (!ap || ap.type !== 'iframe') return;
  const win = ap.el && ap.el.contentWindow;
  if (!win) return;
  try { win.postMessage({ type:'player.action', action, ...extra }, '*'); } catch(e){}
  try { win.postMessage({ action, ...extra }, '*'); } catch(e){}
}

function togglePlayPause() {
  if (!state.hasStarted) return launchPlayer();
  const ap = state.activePlayer;
  if (ap && (ap.type === 'hls' || ap.type === 'mp4')) {
    if (ap.el.paused) { ap.el.play().catch(()=>{}); updatePlayPauseUI(true); triggerActionFlash(ICONS.play); }
    else { ap.el.pause(); updatePlayPauseUI(false); triggerActionFlash(ICONS.pause); }
  } else {
    if (state.isPlaying) { sendPlayerAction('pause'); updatePlayPauseUI(false); triggerActionFlash(ICONS.pause); }
    else { sendPlayerAction('play'); updatePlayPauseUI(true); triggerActionFlash(ICONS.play); }
  }
  showHudTemporarily();
}

function rewind10() {
  const ap = state.activePlayer;
  if (ap && (ap.type === 'hls' || ap.type === 'mp4')) ap.el.currentTime = Math.max(0, ap.el.currentTime - 10);
  else { state.currentTime = Math.max(0, state.currentTime - 10); sendPlayerAction('seek', { position: state.currentTime }); }
  updateScrubberUI();
  triggerActionFlash(ICONS.rew);
  showHudTemporarily();
}
function forward10() {
  const ap = state.activePlayer;
  if (ap && (ap.type === 'hls' || ap.type === 'mp4')) ap.el.currentTime = Math.min(ap.el.duration || state.duration, ap.el.currentTime + 10);
  else { state.currentTime = Math.min(state.duration, state.currentTime + 10); sendPlayerAction('seek', { position: state.currentTime }); }
  updateScrubberUI();
  triggerActionFlash(ICONS.fwd);
  showHudTemporarily();
}
function seekTo(t) {
  const clamped = Math.max(0, Math.min(state.duration, t));
  state.currentTime = clamped;
  const ap = state.activePlayer;
  if (ap && (ap.type === 'hls' || ap.type === 'mp4')) ap.el.currentTime = clamped;
  else sendPlayerAction('seek', { position: clamped });
  updateScrubberUI();
}

function triggerActionFlash(iconMarkup) {
  els.actionFlashIcon.innerHTML = iconMarkup;
  els.actionFlash.classList.remove('opacity-0', 'scale-75');
  els.actionFlash.classList.add('opacity-100', 'scale-100');
  clearTimeout(triggerActionFlash.timer);
  triggerActionFlash.timer = setTimeout(() => {
    els.actionFlash.classList.remove('opacity-100', 'scale-100');
    els.actionFlash.classList.add('opacity-0', 'scale-75');
  }, 550);
}
function updateScrubberUI() {
  if (state.duration <= 0) return;
  const pct = Math.min(Math.max((state.currentTime / state.duration) * 100, 0), 100);
  if (!state.isSeeking) els.slider.value = pct;
  els.progressFill.style.width = `${pct}%`;
  els.currentTimeText.textContent = formatTime(state.currentTime);
  els.durationTimeText.textContent = formatTime(state.duration);
}
function updatePlayPauseUI(playing) {
  state.isPlaying = playing;
  if (els.legendPlayLabel) els.legendPlayLabel.textContent = playing ? 'Pausar' : 'Reproducir/Pausar';
}
function showHUD() { state.isHudVisible = true; els.hud.classList.remove('hud-hidden'); els.btnRevealHud.classList.add('opacity-0','pointer-events-none'); }
function hideHUD() {
  if (state.isModalOpen || state.isSettingsOpen || state.isOptionsDrawerOpen) return;
  state.isHudVisible = false;
  els.hud.classList.add('hud-hidden');
  els.btnRevealHud.classList.remove('opacity-0','pointer-events-none');
}
function resetIdleTimer() {
  if (!state.isHudVisible) showHUD();
  clearTimeout(state.idleTimer);
  state.idleTimer = setTimeout(() => {
    if (state.isPlaying && !state.isModalOpen && !state.isSettingsOpen && !state.isOptionsDrawerOpen) hideHUD();
  }, CONFIG.idleTimeout);
}
function showHudTemporarily() { showHUD(); resetIdleTimer(); }

function toggleOptionsDrawer(force) {
  const open = typeof force === 'boolean' ? force : !state.isOptionsDrawerOpen;
  state.isOptionsDrawerOpen = open;
  if (open) {
    els.optionsPanel.classList.remove('options-drawer-collapsed');
    els.optionsPanel.classList.add('options-drawer-expanded');
    els.toggleChevron.classList.add('rotate-180', 'text-cyan-400');
    clearTimeout(state.idleTimer);
  } else {
    els.optionsPanel.classList.remove('options-drawer-expanded');
    els.optionsPanel.classList.add('options-drawer-collapsed');
    els.toggleChevron.classList.remove('rotate-180', 'text-cyan-400');
    resetIdleTimer();
  }
}
function toggleInfoModal(open) {
  state.isModalOpen = typeof open === 'boolean' ? open : !state.isModalOpen;
  if (state.isModalOpen) {
    els.infoModal.classList.remove('opacity-0','pointer-events-none');
    els.infoModalCard.classList.remove('scale-95');
    els.infoModalCard.classList.add('scale-100');
  } else {
    els.infoModal.classList.add('opacity-0','pointer-events-none');
    els.infoModalCard.classList.add('scale-95');
    els.infoModalCard.classList.remove('scale-100');
  }
}
function toggleSettingsModal(open) {
  state.isSettingsOpen = typeof open === 'boolean' ? open : !state.isSettingsOpen;
  if (state.isSettingsOpen) {
    $('settings-modal').classList.remove('opacity-0','pointer-events-none');
    $('settings-card').classList.remove('translate-y-6','scale-95');
    $('settings-card').classList.add('translate-y-0','scale-100');
  } else {
    $('settings-modal').classList.add('opacity-0','pointer-events-none');
    $('settings-card').classList.add('translate-y-6','scale-95');
    $('settings-card').classList.remove('translate-y-0','scale-100');
  }
}
function applyAspectRatio(mode) {
  state.currentAspect = mode;
  els.wrapper.classList.remove('aspect-normal','aspect-stretch','aspect-16-9','aspect-4-3','aspect-zoom');
  els.wrapper.classList.add('aspect-' + mode);
  sendPlayerAction('setAspectRatio', { ratio: mode });
}
function applyQuality(q) {
  const ap = state.activePlayer;
  if (ap && ap.hls && ap.hls.levels && ap.hls.levels.length) {
    if (q === 'auto') ap.hls.currentLevel = -1;
    else {
      const wanted = parseInt(q, 10);
      let best = -1, bestDiff = Infinity;
      ap.hls.levels.forEach((lv, i) => {
        const d = Math.abs((lv.height || 0) - wanted);
        if (d < bestDiff) { bestDiff = d; best = i; }
      });
      if (best >= 0) ap.hls.currentLevel = best;
    }
  }
  sendPlayerAction('setQuality', { quality: q });
  triggerActionFlash(ICONS.play);
}

function switchLang(lang) {
  if (lang === state.currentLang) return;
  state.currentLang = lang;
  state.currentServerName = null;
  renderLangTabs();
  renderServerButtons(lang);
  verifyAllServers(lang).then(() => {
    const servers = state.servers[lang] || {};
    const first = Object.keys(servers).find(n => state.serverBadges[n] !== 'error');
    if (first && state.hasStarted) loadServer(first, servers[first]);
  });
}

document.querySelectorAll('[data-aspect]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-aspect]').forEach(b => b.classList.remove('tv-btn-active'));
    btn.classList.add('tv-btn-active');
    applyAspectRatio(btn.dataset.aspect);
  });
});
document.querySelectorAll('#group-resolucion-bar [data-res]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#group-resolucion-bar [data-res]').forEach(b => b.classList.remove('tv-btn-active'));
    btn.classList.add('tv-btn-active');
    applyQuality(btn.dataset.res);
  });
});

els.btnCenterPlay.addEventListener('click', launchPlayer);
$('btn-bar-idioma').addEventListener('click', () => toggleSettingsModal(true));
$('btn-bar-feedback').addEventListener('click', () => { triggerActionFlash(ICONS.play); });
$('btn-bar-reload').addEventListener('click', () => { if (state.currentLang) verifyAllServers(state.currentLang).then(() => {
  const servers = state.servers[state.currentLang] || {};
  const first = Object.keys(servers).find(n => state.serverBadges[n] !== 'error');
  if (first) loadServer(first, servers[first]);
});});
els.btnToggleOptions.addEventListener('click', e => { e.stopPropagation(); toggleOptionsDrawer(); });
els.btnRevealHud.addEventListener('click', () => { showHUD(); resetIdleTimer(); });
$('btn-close-modal').addEventListener('click', () => toggleInfoModal(false));
$('btn-close-settings').addEventListener('click', () => toggleSettingsModal(false));
$('btn-apply-settings').addEventListener('click', () => toggleSettingsModal(false));
$('poster-thumb').addEventListener('click', () => toggleInfoModal(true));
$('btn-legend-info').addEventListener('click', () => toggleInfoModal(true));
$('btn-legend-play').addEventListener('click', togglePlayPause);
$('btn-legend-rewind').addEventListener('click', rewind10);
$('btn-legend-forward').addEventListener('click', forward10);
$('btn-legend-exit').addEventListener('click', () => {
  if (state.isSettingsOpen) toggleSettingsModal(false);
  else if (state.isOptionsDrawerOpen) toggleOptionsDrawer(false);
  else if (state.isModalOpen) toggleInfoModal(false);
  else hideHUD();
});

els.slider.addEventListener('pointerdown', () => { state.isSeeking = true; });
els.slider.addEventListener('input', e => {
  const pct = parseFloat(e.target.value);
  state.currentTime = (pct / 100) * state.duration;
  els.progressFill.style.width = `${pct}%`;
  els.currentTimeText.textContent = formatTime(state.currentTime);
});
els.slider.addEventListener('change', e => {
  state.isSeeking = false;
  seekTo((parseFloat(e.target.value) / 100) * state.duration);
});
els.slider.addEventListener('pointerup', () => { state.isSeeking = false; });

els.interactionCatcher.addEventListener('click', () => {
  if (state.isSettingsOpen) return toggleSettingsModal(false);
  if (state.isOptionsDrawerOpen) return toggleOptionsDrawer(false);
  if (state.isModalOpen) return toggleInfoModal(false);
  togglePlayPause();
});

window.addEventListener('mousemove', resetIdleTimer);
window.addEventListener('touchstart', resetIdleTimer);

window.addEventListener('keydown', e => {
  switch (e.key) {
    case ' ': case 'Enter':
      if (state.isModalOpen || state.isSettingsOpen) return;
      e.preventDefault(); togglePlayPause(); break;
    case 'ArrowLeft':
      if (state.isSettingsOpen || state.isModalOpen) return;
      e.preventDefault(); rewind10(); break;
    case 'ArrowRight':
      if (state.isSettingsOpen || state.isModalOpen) return;
      e.preventDefault(); forward10(); break;
    case 'ArrowUp':
      if (state.isSettingsOpen) toggleSettingsModal(false);
      if (state.isOptionsDrawerOpen) toggleOptionsDrawer(false);
      e.preventDefault(); toggleInfoModal(!state.isModalOpen); break;
    case 'ArrowDown':
      e.preventDefault();
      if (state.isModalOpen) toggleInfoModal(false);
      if (state.isSettingsOpen) toggleSettingsModal(false);
      toggleOptionsDrawer(); break;
    case 'Backspace': case 'Escape':
      e.preventDefault();
      if (state.isSettingsOpen) toggleSettingsModal(false);
      else if (state.isOptionsDrawerOpen) toggleOptionsDrawer(false);
      else if (state.isModalOpen) toggleInfoModal(false);
      else hideHUD(); break;
  }
});

window.addEventListener('message', event => {
  const data = event.data;
  if (!data || typeof data !== 'object') return;
  let evt = null;
  if (data.type === 'player.event') evt = data.event || data.name;
  else if (data.name || data.event) evt = data.name || data.event;
  if (!evt) return;
  switch (evt) {
    case 'position': case 'timeupdate':
      if (typeof data.position === 'number') state.currentTime = data.position;
      else if (typeof data.currentTime === 'number') state.currentTime = data.currentTime;
      if (typeof data.duration === 'number' && data.duration > 0) state.duration = data.duration;
      updateScrubberUI(); break;
    case 'play': updatePlayPauseUI(true); break;
    case 'pause': updatePlayPauseUI(false); break;
    case 'ready': hideLoad(); break;
  }
});

async function init() {
  const params = new URLSearchParams(location.search);
  const tmdbId = params.get('id')   || CONFIG.DEFAULT_TMDB_ID;
  const type   = params.get('type') || CONFIG.DEFAULT_TYPE;

  updateVerifyBar(0, 0, 'Conectando con la API Render');
  showLoad('Buscando servidores…');

  try {
    const r = await fetch(`${CONFIG.API_URL}/api/servers?id=${tmdbId}&type=${type}`, {
      signal: AbortSignal.timeout(30000)
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();

    if (data.meta) {
      state.movie = { ...state.movie, ...data.meta };
      hydrateMetadata();
    }

    if (!data.servers || !Object.keys(data.servers).length) {
      updateVerifyBar(0, 0, 'No se encontraron servidores. Probá otro título.');
      hideLoad();
      return;
    }

    state.servers = data.servers;
    state.currentLang = data.servers.latino ? 'latino'
                      : data.servers.castellano ? 'castellano'
                      : data.servers.subtitulado ? 'subtitulado'
                      : Object.keys(data.servers)[0];

    renderLangTabs();
    renderServerButtons(state.currentLang);
    await verifyAllServers(state.currentLang);

    const servers = state.servers[state.currentLang] || {};
    const first = Object.keys(servers).find(n => state.serverBadges[n] !== 'error');
    if (first) {
      loadServer(first, servers[first]);
      setTimeout(() => launchPlayer(), 1500);
    } else {
      updateVerifyBar(0, 0, 'Ningún servidor respondió. Reintentá con ▼');
      hideLoad();
    }
  } catch (err) {
    console.error('[init]', err);
    updateVerifyBar(0, 0, 'Error de conexión con la API. ¿Está corriendo el backend?');
    hideLoad();
  }
}

init();
</script>
</body></html>
