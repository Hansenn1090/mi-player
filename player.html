<!DOCTYPE html>
<html class="h-full bg-black select-none" lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Smart TV Video Player</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest/dist/hls.min.js"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          brand: { cyan: '#00d2ff', blue: '#2563eb', dark: '#0a0a0c', track: '#383a42', card: 'rgba(20, 22, 28, 0.85)' }
        },
        fontFamily: { sans: ['Inter', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'sans-serif'] }
      }
    }
  }
</script>
<style>
  input[type=range] { -webkit-appearance: none; appearance: none; background: transparent; cursor: pointer; }
  input[type=range]:focus { outline: none; }
  input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 9999px; background: transparent; }
  input[type=range]::-moz-range-track { height: 4px; border-radius: 9999px; background: transparent; }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; height: 14px; width: 14px; border-radius: 50%;
    background: #00d2ff; margin-top: -5px; box-shadow: 0 0 10px rgba(0, 210, 255, 0.85);
    border: 2px solid #ffffff; transition: transform 0.15s ease;
  }
  input[type=range]::-moz-range-thumb {
    height: 14px; width: 14px; border-radius: 50%; background: #00d2ff;
    border: 2px solid #ffffff; box-shadow: 0 0 10px rgba(0, 210, 255, 0.85);
  }
  input[type=range]:hover::-webkit-slider-thumb { transform: scale(1.3); box-shadow: 0 0 14px #00d2ff; }
  .hud-transition { transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1), transform 0.35s cubic-bezier(0.16, 1, 0.3, 1); }
  .hud-hidden { opacity: 0 !important; pointer-events: none !important; transform: translateY(16px); }
  .key-badge {
    background: rgba(255, 255, 255, 0.9); color: #000; font-size: 10px; font-weight: 800;
    letter-spacing: 0.05em; border-radius: 2px; padding: 1px 4px;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .tv-btn-normal { background: rgba(43, 50, 63, 0.82); backdrop-filter: blur(10px); color: #d1d5db; transition: all 0.2s ease; }
  .tv-btn-normal:hover { background: rgba(60, 70, 88, 0.95); color: #ffffff; }
  .tv-btn-active {
    background: rgba(72, 85, 107, 0.98) !important; backdrop-filter: blur(10px);
    color: #ffffff !important; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4); border-color: #00d2ff !important;
  }
  .options-drawer-panel {
    transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1), transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), max-height 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .options-drawer-collapsed {
    opacity: 0; pointer-events: none; transform: translateY(16px) scale(0.98);
    max-height: 0; margin: 0 !important; padding: 0 !important; overflow: hidden;
  }
  .options-drawer-expanded { opacity: 1; pointer-events: auto; transform: translateY(0) scale(1); max-height: 600px; }
  .custom-scrollbar::-webkit-scrollbar { width: 4px; }
  .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(0, 210, 255, 0.4); border-radius: 4px; }
  .srv-skeleton {
    background: linear-gradient(90deg, rgba(43,50,63,0.4) 25%, rgba(60,70,88,0.6) 50%, rgba(43,50,63,0.4) 75%);
    background-size: 200% 100%; animation: srv-shimmer 1.4s infinite;
  }
  @keyframes srv-shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

  #stage { position: absolute; inset: 0; background: #000; z-index: 1; }
  #stage video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
</style>
</head>
<body class="h-full w-full overflow-hidden bg-black text-white font-sans antialiased relative">

<main class="relative w-full h-full bg-black overflow-hidden flex items-center justify-center" id="playerContainer">

  <div id="stage"></div>

  <div class="absolute inset-x-0 bottom-0 h-32 z-20 pointer-events-auto opacity-0" id="bottom-hover-detector"></div>

  <header class="absolute top-5 right-6 z-30 pointer-events-none hud-element hud-transition flex items-center justify-end">
    <aside class="pointer-events-auto flex items-center space-x-2 bg-black/60 backdrop-blur-md px-3 py-1.5 rounded-full border border-white/10 shadow-md">
      <span class="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
      <span class="text-white/90 text-xs sm:text-sm font-semibold tracking-wider font-mono" id="bitrate-indicator">4.2MB/S</span>
    </aside>
  </header>

  <div class="fixed top-6 left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 -translate-y-3 transition-all duration-300 flex items-center space-x-2.5 px-4 py-2 rounded-xl bg-zinc-900/90 border border-brand-cyan/40 text-brand-cyan shadow-xl backdrop-blur-md" id="toast-notify">
    <span class="w-2 h-2 rounded-full bg-brand-cyan animate-ping"></span>
    <span class="text-xs sm:text-sm font-medium text-white tracking-wide" id="toast-text">Cargando…</span>
  </div>

  <div class="absolute z-30 pointer-events-none opacity-0 scale-75 transition-all duration-300 ease-out flex items-center justify-center p-6 rounded-full bg-black/70 backdrop-blur-md border border-white/10 text-white shadow-2xl" id="action-flash" style="top:50%;left:50%;transform:translate(-50%,-50%) scale(.75);">
    <svg class="w-12 h-12" fill="currentColor" id="action-flash-icon" viewBox="0 0 24 24"></svg>
  </div>

  <div class="absolute inset-x-0 bottom-0 z-30 hud-element hud-transition pb-2 pt-20 bg-gradient-to-t from-black via-black/80 to-transparent pointer-events-none flex flex-col justify-end" id="osd-hud">
    <div class="w-full max-w-[1920px] mx-auto px-6 md:px-12 lg:px-14 pb-1 pointer-events-auto space-y-3">

      <div class="options-drawer-panel options-drawer-collapsed bg-zinc-950/95 backdrop-blur-xl border border-white/15 rounded-2xl p-4 sm:p-5 shadow-[0_20px_50px_rgba(0,0,0,0.9)] flex flex-col gap-3.5 mb-2 overflow-y-auto max-h-[560px] custom-scrollbar" id="options-panel-container">

        <div class="space-y-1.5 pb-3 border-b border-white/10" id="group-server-options">
          <div class="flex items-center justify-between">
            <div class="flex items-center space-x-2">
              <span class="block text-[11px] sm:text-xs font-semibold text-neutral-400 tracking-wider uppercase">SERVIDORES DE REPRODUCCIÓN</span>
              <span class="inline-flex items-center px-1.5 py-0.5 rounded text-[9px] font-semibold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30" id="servers-status-badge">CARGANDO</span>
            </div>
            <span class="text-[10px] text-brand-cyan/90 font-mono tracking-tight" id="badge-active-server">—</span>
          </div>
          <div class="flex flex-wrap sm:flex-nowrap items-center gap-2" role="group" id="servers-list">
            <div class="tv-btn-normal srv-skeleton px-4 py-2 text-xs sm:text-sm font-medium rounded-lg w-full sm:w-auto min-w-[200px] h-10"></div>
            <div class="tv-btn-normal srv-skeleton px-4 py-2 text-xs sm:text-sm font-medium rounded-lg w-full sm:w-auto min-w-[200px] h-10"></div>
          </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 pb-3 border-b border-white/10">
          <div class="space-y-1.5" id="group-audio-options">
            <div class="flex items-center justify-between">
              <span class="block text-[11px] sm:text-xs font-semibold text-neutral-400 tracking-wider uppercase">AUDIO Y DOBLAJE</span>
              <span class="text-[10px] text-brand-cyan/90 font-mono tracking-tight" id="badge-active-audio">🇲🇽 Español Latino</span>
            </div>
            <div class="inline-flex rounded overflow-hidden shadow-lg border border-white/10 divide-x divide-white/10 w-full" role="group">
              <button class="tv-btn-normal tv-btn-active px-3 sm:px-4 py-2 text-xs sm:text-sm font-medium flex-1 flex items-center justify-center space-x-1.5 transition" data-audio="latino" type="button">
                <svg class="w-3.5 h-3.5 fill-current text-white check-icon" viewBox="0 0 20 20"><path clip-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" fill-rule="evenodd"/></svg>
                <span>🇲🇽 Español Latino</span>
              </button>
              <button class="tv-btn-normal px-3 sm:px-4 py-2 text-xs sm:text-sm font-medium flex-1 flex items-center justify-center space-x-1.5 transition" data-audio="castellano" type="button">
                <svg class="w-3.5 h-3.5 fill-current text-white check-icon hidden" viewBox="0 0 20 20"><path clip-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" fill-rule="evenodd"/></svg>
                <span>🇪🇸 Castellano</span>
              </button>
              <button class="tv-btn-normal px-3 sm:px-4 py-2 text-xs sm:text-sm font-medium flex-1 flex items-center justify-center space-x-1.5 transition" data-audio="subtitulado" type="button">
                <svg class="w-3.5 h-3.5 fill-current text-white check-icon hidden" viewBox="0 0 20 20"><path clip-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" fill-rule="evenodd"/></svg>
                <span>📝 Subtitulado</span>
              </button>
            </div>
          </div>

          <div class="space-y-1.5" id="group-subtitle-options">
            <div class="flex items-center justify-between">
              <span class="block text-[11px] sm:text-xs font-semibold text-neutral-400 tracking-wider uppercase">SUBTÍTULOS</span>
              <span class="text-[10px] text-neutral-400 font-mono tracking-tight" id="badge-active-subtitle">DESACTIVADOS</span>
            </div>
            <div class="inline-flex rounded overflow-hidden shadow-lg border border-white/10 divide-x divide-white/10 w-full" role="group">
              <button class="tv-btn-normal tv-btn-active px-3 py-2 text-xs sm:text-sm font-medium flex-1 flex items-center justify-center space-x-1.5 transition" data-sub="off" type="button">
                <svg class="w-3.5 h-3.5 fill-current text-white check-icon" viewBox="0 0 20 20"><path clip-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" fill-rule="evenodd"/></svg>
                <span>Desactivados</span>
              </button>
              <button class="tv-btn-normal px-3 py-2 text-xs sm:text-sm font-medium flex-1 flex items-center justify-center space-x-1.5 transition" data-sub="es" type="button">
                <svg class="w-3.5 h-3.5 fill-current text-white check-icon hidden" viewBox="0 0 20 20"><path clip-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" fill-rule="evenodd"/></svg>
                <span>Español</span>
              </button>
              <button class="tv-btn-normal px-3 py-2 text-xs sm:text-sm font-medium flex-1 flex items-center justify-center space-x-1.5 transition" data-sub="en" type="button">
                <svg class="w-3.5 h-3.5 fill-current text-white check-icon hidden" viewBox="0 0 20 20"><path clip-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" fill-rule="evenodd"/></svg>
                <span>Inglés (CC)</span>
              </button>
            </div>
          </div>
        </div>

        <div class="flex flex-wrap items-center justify-between gap-x-6 gap-y-3 pt-1">
          <div class="space-y-1.5" id="group-formato-pantalla">
            <span class="block text-[11px] sm:text-xs font-semibold text-neutral-400 tracking-wider uppercase">FORMATO DE PANTALLA</span>
            <div class="inline-flex rounded overflow-hidden shadow-lg border border-white/10 divide-x divide-white/10" role="group">
              <button class="tv-btn-normal tv-btn-active px-3.5 sm:px-4 py-2 sm:py-2.5 text-xs sm:text-sm font-medium flex items-center space-x-1.5 transition" data-aspect="16-9" type="button">
                <svg class="w-3.5 h-3.5 fill-current text-white check-icon" viewBox="0 0 20 20"><path clip-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" fill-rule="evenodd"/></svg>
                <span>16:9 Normal</span>
              </button>
              <button class="tv-btn-normal px-3.5 sm:px-4 py-2 sm:py-2.5 text-xs sm:text-sm font-medium flex items-center space-x-1.5 transition" data-aspect="stretch" type="button">
                <svg class="w-3.5 h-3.5 fill-current text-white check-icon hidden" viewBox="0 0 20 20"><path clip-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" fill-rule="evenodd"/></svg>
                <span>Pantalla Completa</span>
              </button>
              <button class="tv-btn-normal px-3.5 sm:px-4 py-2 sm:py-2.5 text-xs sm:text-sm font-medium flex items-center space-x-1.5 transition" data-aspect="4-3" type="button">
                <svg class="w-3.5 h-3.5 fill-current text-white check-icon hidden" viewBox="0 0 20 20"><path clip-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" fill-rule="evenodd"/></svg>
                <span>4:3</span>
              </button>
            </div>
          </div>

          <div class="flex items-center space-x-2">
            <button class="tv-btn-normal px-3.5 py-2 text-xs rounded-lg text-rose-300 hover:text-white transition flex items-center space-x-1.5" id="btn-bar-feedback" type="button">
              <svg class="w-3.5 h-3.5 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/></svg>
              <span>Reportar Falla</span>
            </button>
          </div>
        </div>
      </div>

      <div class="flex items-center gap-4 sm:gap-5">
        <div class="w-14 h-20 sm:w-16 sm:h-24 md:w-20 md:h-28 rounded-lg overflow-hidden shadow-2xl bg-neutral-900 border border-white/10 flex-shrink-0 relative group cursor-pointer hover:border-brand-cyan transition" id="poster-thumb">
          <img alt="Poster" class="w-full h-full object-cover bg-neutral-800" id="poster-img" loading="lazy" src=""/>
          <div class="absolute inset-0 bg-black/20 group-hover:bg-transparent transition"></div>
        </div>

        <div class="flex-1 flex flex-col justify-center min-w-0 space-y-2.5 sm:space-y-3">
          <div class="flex items-center space-x-3 sm:space-x-4">
            <span class="text-xs sm:text-sm md:text-base font-medium tracking-tight text-white min-w-[45px] sm:min-w-[50px] text-right font-mono" id="current-time-text">00:00</span>
            <div class="relative flex-grow flex items-center group py-2" id="scrubber-container">
              <div class="w-full h-1 bg-brand-track rounded-full overflow-hidden relative pointer-events-none">
                <div class="h-full bg-gradient-to-r from-blue-500 to-brand-cyan transition-all duration-75" id="progress-fill" style="width: 0%;"></div>
              </div>
              <input aria-label="Seek" class="absolute inset-0 w-full h-full opacity-100 cursor-pointer z-10" id="seek-slider" max="100" min="0" step="0.05" type="range" value="0"/>
            </div>
            <span class="text-xs sm:text-sm md:text-base font-medium tracking-tight text-gray-300 min-w-[55px] sm:min-w-[65px] font-mono" id="duration-time-text">00:00</span>
          </div>

          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 sm:gap-4">
            <div class="min-w-0">
              <h1 class="text-base sm:text-xl md:text-2xl font-normal tracking-wide text-white drop-shadow truncate" id="movie-title">Cargando…</h1>
              <p class="text-[11px] sm:text-xs md:text-sm text-neutral-400 font-light truncate mt-0.5" id="movie-meta">—</p>
            </div>

            <div class="flex flex-wrap items-center gap-2.5 sm:gap-4 md:gap-5 text-xs sm:text-sm text-neutral-200 flex-shrink-0">
              <button class="flex items-center space-x-1.5 hover:text-white transition focus:outline-none" id="btn-legend-exit" type="button">
                <span class="key-badge">EXIT</span><span>Vuelta</span>
              </button>
              <button class="flex items-center space-x-1.5 hover:text-white transition focus:outline-none" id="btn-legend-play" type="button">
                <span class="key-badge">OK</span><span id="legend-play-label">Reproducir/Pausar</span>
              </button>
              <button class="flex items-center space-x-1.5 hover:text-white transition focus:outline-none" id="btn-legend-rewind" type="button">
                <span class="key-badge">◀</span><span>Detrás</span>
              </button>
              <button class="flex items-center space-x-1.5 hover:text-white transition focus:outline-none" id="btn-legend-forward" type="button">
                <span class="key-badge">▶</span><span>Adelante</span>
              </button>
              <button class="flex items-center space-x-1.5 hover:text-white text-cyan-400 font-medium transition focus:outline-none" id="btn-legend-info" type="button">
                <span class="key-badge bg-cyan-400 text-black">▲</span><span class="text-white">Info</span>
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="flex justify-center pb-2 pointer-events-auto">
        <button aria-label="Opciones" class="text-neutral-400 hover:text-white focus:outline-none transition-all duration-300 hover:scale-125 p-2 rounded-full hover:bg-white/10" id="btn-toggle-options">
          <svg class="w-7 h-7 transform transition-transform duration-300 ease-out" fill="none" id="toggle-chevron" stroke="currentColor" viewBox="0 0 24 24">
            <path d="M19 9l-7 7-7-7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <button aria-label="Mostrar controles" class="fixed bottom-3 left-1/2 -translate-x-1/2 z-30 opacity-0 pointer-events-none transition-all duration-300 p-2 text-white/70 hover:text-white bg-black/60 backdrop-blur rounded-full border border-white/15 shadow-xl hover:scale-110" id="btn-reveal-hud">
    <svg class="w-5 h-5 rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path d="M19 9l-7 7-7-7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"/>
    </svg>
  </button>

  <div class="fixed inset-0 z-50 bg-black/85 backdrop-blur-md opacity-0 pointer-events-none transition-opacity duration-300 flex items-center justify-center p-4" id="feedback-modal">
    <div class="bg-zinc-950 border border-white/15 max-w-md w-full rounded-2xl p-6 shadow-2xl relative transform scale-95 transition-transform duration-300" id="feedback-card">
      <button class="absolute top-4 right-4 text-neutral-400 hover:text-white p-2 rounded-lg bg-white/5 hover:bg-white/10 transition" id="btn-close-feedback">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/></svg>
      </button>
      <div class="flex items-center space-x-3 mb-4">
        <div class="p-2.5 rounded-xl bg-rose-500/20 text-rose-400 border border-rose-500/30">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/></svg>
        </div>
        <div>
          <h3 class="text-base font-semibold text-white">Reportar Falla</h3>
          <p class="text-xs text-neutral-400">¿Qué inconveniente estás experimentando?</p>
        </div>
      </div>
      <form class="space-y-3" id="feedback-form">
        <div class="space-y-2">
          <label class="flex items-center p-2.5 rounded-lg bg-white/5 border border-white/10 cursor-pointer hover:border-cyan-400/50 transition">
            <input class="text-cyan-500 bg-neutral-900 border-neutral-700" name="issue" type="radio" value="audio_sync"/>
            <span class="ml-2.5 text-xs text-neutral-200">Audio desfasado o sin sonido</span>
          </label>
          <label class="flex items-center p-2.5 rounded-lg bg-white/5 border border-white/10 cursor-pointer hover:border-cyan-400/50 transition">
            <input checked class="text-cyan-500 bg-neutral-900 border-neutral-700" name="issue" type="radio" value="stream_freeze"/>
            <span class="ml-2.5 text-xs text-neutral-200">Video pausado o buffer continuo</span>
          </label>
          <label class="flex items-center p-2.5 rounded-lg bg-white/5 border border-white/10 cursor-pointer hover:border-cyan-400/50 transition">
            <input class="text-cyan-500 bg-neutral-900 border-neutral-700" name="issue" type="radio" value="subtitle_issue"/>
            <span class="ml-2.5 text-xs text-neutral-200">Problemas con subtítulos</span>
          </label>
        </div>
        <div class="pt-3 flex justify-end space-x-2">
          <button class="px-4 py-2 rounded-lg bg-white/10 hover:bg-white/20 text-white text-xs font-medium transition" id="btn-cancel-feedback" type="button">Cancelar</button>
          <button class="px-4 py-2 rounded-lg bg-cyan-500 hover:bg-cyan-400 text-black text-xs font-semibold transition" type="submit">Enviar Reporte</button>
        </div>
      </form>
    </div>
  </div>

  <div class="fixed inset-0 z-50 bg-black/85 backdrop-blur-md opacity-0 pointer-events-none transition-opacity duration-300 flex items-center justify-center p-4" id="info-modal">
    <div class="bg-zinc-900/95 border border-white/15 max-w-2xl w-full rounded-2xl p-6 sm:p-8 shadow-2xl relative transform scale-95 transition-transform duration-300" id="info-modal-card">
      <button class="absolute top-4 right-4 text-neutral-400 hover:text-white p-2 rounded-lg bg-white/5 hover:bg-white/10 transition" id="btn-close-modal">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/></svg>
      </button>
      <div class="flex flex-col sm:flex-row gap-6">
        <img alt="Poster" class="w-32 h-48 sm:w-44 sm:h-64 object-cover rounded-lg shadow-md border border-white/10 flex-shrink-0 mx-auto bg-neutral-800" id="info-poster" src=""/>
        <div class="flex-1 space-y-3">
          <div class="flex items-center gap-2 flex-wrap" id="info-badges"></div>
          <h2 class="text-2xl font-bold text-white tracking-wide" id="info-title">—</h2>
          <p class="text-xs font-mono text-cyan-400" id="info-original">—</p>
          <p class="text-neutral-300 text-sm leading-relaxed" id="info-overview">—</p>
          <div class="pt-2 border-t border-white/10 grid grid-cols-2 gap-2 text-xs text-neutral-400" id="info-details"></div>
        </div>
      </div>
      <div class="mt-6 pt-4 border-t border-white/10 flex justify-end gap-3">
        <button class="px-4 py-2 rounded-lg bg-white/10 hover:bg-white/20 text-white font-medium text-sm transition" id="btn-modal-close-action">Cerrar</button>
        <button class="px-5 py-2 rounded-lg bg-cyan-500 hover:bg-cyan-400 text-black font-semibold text-sm transition flex items-center space-x-2" id="btn-modal-action-play">
          <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          <span>Continuar Viendo</span>
        </button>
      </div>
    </div>
  </div>
</main>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   CONFIGURACIÓN — URL de tu API en Render
   ══════════════════════════════════════════════════════════════════════════ */
const API_BASE = 'https://mi-player-api.onrender.com';
const PROXY_BASE = ''; // Opcional si decides usar un Worker para saltar CORS

/* ══════════════════════════════════════════════════════════════════════════
   ESTADO GLOBAL
   ══════════════════════════════════════════════════════════════════════════ */
const state = {
  isPlaying: false, currentTime: 0, duration: 0,
  isHudVisible: true, isOptionsDrawerOpen: false, isModalOpen: false, isFeedbackOpen: false,
  isSeeking: false, idleTimer: null, idleTimeoutDuration: 3800,
  currentAudio: 'latino', currentSubtitle: 'off', currentAspect: '16-9',
  currentServer: null, servers: {}, serversFlat: [],
  movieId: null, movieType: 'movie', meta: null,
};

const $ = id => document.getElementById(id);
const els = {
  stage: $('stage'), hud: $('osd-hud'), slider: $('seek-slider'),
  progressFill: $('progress-fill'), currentTimeText: $('current-time-text'),
  durationTimeText: $('duration-time-text'), optionsPanel: $('options-panel-container'),
  btnToggleOptions: $('btn-toggle-options'), btnRevealHud: $('btn-reveal-hud'),
  toggleChevron: $('toggle-chevron'), actionFlash: $('action-flash'),
  actionFlashIcon: $('action-flash-icon'), toastNotify: $('toast-notify'), toastText: $('toast-text'),
  infoModal: $('info-modal'), infoModalCard: $('info-modal-card'),
  btnCloseModal: $('btn-close-modal'), btnModalCloseAction: $('btn-modal-close-action'),
  btnModalPlay: $('btn-modal-action-play'), posterThumb: $('poster-thumb'),
  btnExit: $('btn-legend-exit'), btnPlay: $('btn-legend-play'),
  btnRewind: $('btn-legend-rewind'), btnForward: $('btn-legend-forward'),
  btnInfo: $('btn-legend-info'), legendPlayLabel: $('legend-play-label'),
  btnBarFeedback: $('btn-bar-feedback'), badgeActiveAudio: $('badge-active-audio'),
  badgeActiveSubtitle: $('badge-active-subtitle'), badgeActiveServer: $('badge-active-server'),
  serversList: $('servers-list'), serversStatusBadge: $('servers-status-badge'),
  feedbackModal: $('feedback-modal'), feedbackCard: $('feedback-card'),
  btnCloseFeedback: $('btn-close-feedback'), btnCancelFeedback: $('btn-cancel-feedback'),
  feedbackForm: $('feedback-form'), bottomHoverDetector: $('bottom-hover-detector'),
  posterImg: $('poster-img'), movieTitle: $('movie-title'), movieMeta: $('movie-meta'),
  infoPoster: $('info-poster'), infoTitle: $('info-title'), infoOriginal: $('info-original'),
  infoOverview: $('info-overview'), infoBadges: $('info-badges'), infoDetails: $('info-details'),
};

const ICONS = {
  play: '<polygon points="5 3 19 12 5 21 5 3"/>',
  pause: '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>',
  forward: '<polygon points="13 19 22 12 13 5 13 19"/><polygon points="2 19 11 12 2 5 2 19"/>',
  rewind: '<polygon points="11 19 2 12 11 5 11 19"/><polygon points="22 19 13 12 22 5 22 19"/>',
  check: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" fill="none" stroke="currentColor"/>',
};

let _currentHls = null;
let _currentVideoEl = null;
let _currentFrame = null;

/* ══════════════════════════════════════════════════════════════════════════
   UTILIDADES
   ══════════════════════════════════════════════════════════════════════════ */
function getQueryParam(name) { return new URLSearchParams(location.search).get(name); }
function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function detectByUrl(url) {
  if (!url) return null;
  if (/\.m3u8(\?|$)/i.test(url) || /master\.txt(\?|$)/i.test(url)) return 'hls';
  if (/\.mp4(\?|$)/i.test(url) || /\.webm(\?|$)/i.test(url)) return 'mp4';
  return null;
}
function formatTime(totalSeconds) {
  if (isNaN(totalSeconds) || totalSeconds < 0) totalSeconds = 0;
  const h = Math.floor(totalSeconds / 3600);
  const m = Math.floor((totalSeconds % 3600) / 60);
  const s = Math.floor(totalSeconds % 60);
  const p = n => String(n).padStart(2, '0');
  return h > 0 ? `${p(h)}:${p(m)}:${p(s)}` : `${p(m)}:${p(s)}`;
}
function showToast(message) {
  els.toastText.textContent = message;
  els.toastNotify.classList.remove('opacity-0', '-translate-y-3');
  els.toastNotify.classList.add('opacity-100', 'translate-y-0');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => {
    els.toastNotify.classList.remove('opacity-100', 'translate-y-0');
    els.toastNotify.classList.add('opacity-0', '-translate-y-3');
  }, 3000);
}
function triggerActionFlash(iconMarkup) {
  els.actionFlashIcon.innerHTML = iconMarkup;
  els.actionFlash.classList.remove('opacity-0', 'scale-75');
  els.actionFlash.classList.add('opacity-100', 'scale-100');
  clearTimeout(triggerActionFlash._t);
  triggerActionFlash._t = setTimeout(() => {
    els.actionFlash.classList.remove('opacity-100', 'scale-100');
    els.actionFlash.classList.add('opacity-0', 'scale-75');
  }, 550);
}

/* ══════════════════════════════════════════════════════════════════════════
   SERVIDORES
   ══════════════════════════════════════════════════════════════════════════ */
function buildServersFlat(servers) {
  const flat = [];
  let n = 1;
  for (const [lang, srvMap] of Object.entries(servers || {})) {
    if (!srvMap || typeof srvMap !== 'object') continue;
    for (const [hostKey, url] of Object.entries(srvMap)) {
      if (!url || typeof url !== 'string') continue;
      flat.push({ num: n++, host: hostKey, lang, url });
    }
  }
  return flat;
}

function renderServers() {
  const list = els.serversList;
  list.innerHTML = '';

  if (!state.serversFlat.length) {
    list.innerHTML = `<span class="text-[11px] text-neutral-400 italic">No hay servidores disponibles.</span>`;
    els.serversStatusBadge.textContent = 'SIN SERVIDORES';
    els.serversStatusBadge.className = 'inline-flex items-center px-1.5 py-0.5 rounded text-[9px] font-semibold bg-rose-500/20 text-rose-300 border border-rose-500/30';
    return;
  }

  els.serversStatusBadge.textContent = 'ONLINE';
  els.serversStatusBadge.className = 'inline-flex items-center px-1.5 py-0.5 rounded text-[9px] font-semibold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30';

  state.serversFlat.forEach(srv => {
    const isActive = srv.num === state.currentServer;
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = `tv-btn-normal ${isActive ? 'tv-btn-active' : ''} px-4 py-2 text-xs sm:text-sm font-medium rounded-lg flex items-center justify-center space-x-2 border transition shadow-sm w-full sm:w-auto min-w-[200px]`;
    btn.dataset.serverNum = srv.num;
    btn.innerHTML = `
      <svg class="w-3.5 h-3.5 fill-current text-white check-icon ${isActive ? '' : 'hidden'}" viewBox="0 0 20 20">
        <path clip-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" fill-rule="evenodd"/>
      </svg>
      <span class="font-medium">⚡ Server ${srv.num}</span>
    `;
    btn.addEventListener('click', () => selectServer(srv.num));
    list.appendChild(btn);
  });
}

/* ══════════════════════════════════════════════════════════════════════════
   TEARDOWN / MOUNT
   ══════════════════════════════════════════════════════════════════════════ */
function teardown() {
  if (_currentHls) { try { _currentHls.destroy(); } catch (_) {} _currentHls = null; }
  if (_currentFrame) { try { _currentFrame.remove(); } catch (_) {} _currentFrame = null; }
  if (_currentVideoEl) { try { _currentVideoEl.pause(); _currentVideoEl.src = ''; } catch (_) {} _currentVideoEl = null; }
}

function attachVideoEvents(vid) {
  vid.addEventListener('loadedmetadata', () => {
    state.duration = vid.duration || 0;
    updateScrubberUI();
  });
  vid.addEventListener('timeupdate', () => {
    state.currentTime = vid.currentTime || 0;
    if (!state.isSeeking) updateScrubberUI();
  });
  vid.addEventListener('play', () => {
    state.isPlaying = true;
    els.legendPlayLabel.textContent = 'Pausar';
  });
  vid.addEventListener('pause', () => {
    state.isPlaying = false;
    els.legendPlayLabel.textContent = 'Reproducir';
  });
}

function mountHls(url, referer) {
  const wrap = document.createElement('div');
  wrap.style.cssText = 'position:absolute;inset:0;background:#000';
  const vid = document.createElement('video');
  vid.playsInline = true; vid.preload = 'metadata'; vid.controls = false; vid.crossOrigin = 'anonymous';
  wrap.appendChild(vid);
  els.stage.appendChild(wrap);
  _currentFrame = wrap; _currentVideoEl = vid;
  attachVideoEvents(vid);

  const finalUrl = PROXY_BASE ? (PROXY_BASE + '/?url=' + encodeURIComponent(url) + '&referer=' + encodeURIComponent(referer || url)) : url;

  if (typeof Hls !== 'undefined' && Hls.isSupported()) {
    const hls = new Hls({ maxBufferLength: 30, startLevel: -1, enableWorker: true });
    _currentHls = hls;
    hls.loadSource(finalUrl);
    hls.attachMedia(vid);

    hls.on(Hls.Events.MANIFEST_PARSED, () => { vid.play().catch(() => {}); });
    hls.on(Hls.Events.ERROR, (_, d) => {
      if (d.fatal) {
        console.warn('[HLS] Error fatal:', d);
        showToast('Error HLS, prueba otro servidor');
      }
    });
  } else if (vid.canPlayType('application/vnd.apple.mpegurl')) {
    vid.src = finalUrl;
    vid.load();
    vid.addEventListener('canplay', () => vid.play().catch(() => {}), { once: true });
  }
}

function mountMp4(url) {
  const wrap = document.createElement('div');
  wrap.style.cssText = 'position:absolute;inset:0;background:#000';
  const vid = document.createElement('video');
  vid.playsInline = true; vid.preload = 'metadata'; vid.controls = false; vid.crossOrigin = 'anonymous';
  wrap.appendChild(vid);
  els.stage.appendChild(wrap);
  _currentFrame = wrap; _currentVideoEl = vid;
  attachVideoEvents(vid);

  vid.src = url;
  vid.load();
  vid.addEventListener('canplay', () => vid.play().catch(() => {}), { once: true });
}

function mountIframe(url) {
  const iframe = document.createElement('iframe');
  iframe.className = 'w-full h-full absolute inset-0 border-0';
  iframe.allow = 'autoplay; fullscreen; encrypted-media; picture-in-picture';
  iframe.allowFullscreen = true;
  iframe.setAttribute('allowfullscreen', '');
  iframe.setAttribute('referrerpolicy', 'no-referrer');
  iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-popups allow-presentation allow-downloads');
  iframe.src = url;
  els.stage.appendChild(iframe);
  _currentFrame = iframe; _currentVideoEl = null;
  state.duration = 0; state.currentTime = 0;
  updateScrubberUI();
}

/* ══════════════════════════════════════════════════════════════════════════
   EXTRACTOR (Backend)
   ══════════════════════════════════════════════════════════════════════════ */
async function extractFromBackend(embedUrl) {
  try {
    // Pide al backend que extraiga el stream (ej. de Vimeos o Uqload)
    const r = await fetch(`${API_BASE}/api/extract?url=${encodeURIComponent(embedUrl)}`);
    if (!r.ok) return null;
    const data = await r.json();
    if (data.error || !data.stream) return null;
    return { stream: data.stream, kind: data.kind || 'hls', referer: data.referer };
  } catch (e) {
    return null;
  }
}

/* ══════════════════════════════════════════════════════════════════════════
   SELECT SERVER
   ══════════════════════════════════════════════════════════════════════════ */
async function selectServer(num) {
  const srv = state.serversFlat.find(s => s.num === num);
  if (!srv) return;

  state.currentServer = num;
  els.badgeActiveServer.textContent = `Server ${num}`;

  els.serversList.querySelectorAll('button[data-server-num]').forEach(b => {
    const isNowActive = parseInt(b.dataset.serverNum, 10) === num;
    b.classList.toggle('tv-btn-active', isNowActive);
    const check = b.querySelector('.check-icon');
    if (check) check.classList.toggle('hidden', !isNowActive);
  });

  teardown();
  showToast(`Cargando Server ${num}…`);

  // Servidores que sabemos que NO se pueden extraer (siempre serán iframes)
  const ALWAYS_IFRAME = /playlatinsrc\.co|unlimplay\.com|player\.poseidonhd2\.co/i;
  
  if (ALWAYS_IFRAME.test(srv.url)) {
    console.log(`[player] Server ${num} → iframe directo`);
    mountIframe(srv.url);
    return;
  }

  // Si la URL ya es .m3u8 o .mp4 directo
  const byUrl = detectByUrl(srv.url);
  if (byUrl === 'hls') { mountHls(srv.url, srv.url); return; }
  if (byUrl === 'mp4') { mountMp4(srv.url); return; }

  // Si requiere extracción (ej. Vimeos, Uqload)
  const extracted = await extractFromBackend(srv.url);
  if (extracted && extracted.stream) {
    if (extracted.kind === 'hls') mountHls(extracted.stream, extracted.referer);
    else if (extracted.kind === 'mp4') mountMp4(extracted.stream);
    else mountIframe(srv.url);
    return;
  }

  // Fallback a iframe si falla la extracción
  mountIframe(srv.url);
}

/* ══════════════════════════════════════════════════════════════════════════
   CARGA DESDE EL BACKEND (ID de TMDB)
   ══════════════════════════════════════════════════════════════════════════ */
async function loadMovie(id, type) {
  state.movieId = id;
  state.movieType = type;

  try {
    // Pide los servidores y metadatos al backend (que consulta TMDB y los providers)
    const r = await fetch(`${API_BASE}/api/servers?id=${encodeURIComponent(id)}&type=${encodeURIComponent(type)}`);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();

    if (data.meta) {
      state.meta = data.meta;
      if (data.meta.title) els.movieTitle.textContent = data.meta.title;

      const parts = [];
      if (data.meta.year) parts.push(data.meta.year);
      if (data.meta.genres && data.meta.genres.length) parts.push(data.meta.genres.slice(0, 2).join(' / '));
      if (data.meta.runtime) {
        const h = Math.floor(data.meta.runtime / 60);
        const m = data.meta.runtime % 60;
        parts.push(h > 0 ? `${h}h ${m}m` : `${m}m`);
      }
      if (data.meta.voteAverage) parts.push('⭐ ' + data.meta.voteAverage.toFixed(1));
      els.movieMeta.textContent = parts.join(' • ') || '—';

      if (data.meta.poster) els.posterImg.src = data.meta.poster;
      if (data.meta.title) document.title = `${data.meta.title} — Smart TV Player`;

      // Info modal
      els.infoTitle.textContent = data.meta.title || '—';
      els.infoPoster.src = data.meta.poster || '';
      els.infoOverview.textContent = data.meta.overview || '—';
      els.infoOriginal.textContent = `${cap(type)} • TMDB ID: ${data.meta.tmdbId || id}`;

      const badges = [];
      if (data.meta.year) badges.push(`<span class="text-xs text-neutral-400">${data.meta.year}</span>`);
      if (data.meta.runtime) {
        const h = Math.floor(data.meta.runtime / 60);
        const m = data.meta.runtime % 60;
        badges.push(`<span class="text-xs text-neutral-400">• ${h > 0 ? h + 'h ' : ''}${m}m</span>`);
      }
      if (data.meta.voteAverage) badges.push(`<span class="px-2 py-0.5 text-xs font-semibold rounded bg-amber-500/20 text-amber-300 border border-amber-500/30">TMDB ${data.meta.voteAverage.toFixed(1)}</span>`);
      badges.push('<span class="px-1.5 py-0.2 text-[10px] uppercase font-bold border border-cyan-400/40 text-cyan-300 rounded">Full HD</span>');
      els.infoBadges.innerHTML = badges.join('');

      const details = [];
      if (data.meta.genres && data.meta.genres.length) details.push(`<div><strong class="text-neutral-200">Género:</strong> ${esc(data.meta.genres.join(', '))}</div>`);
      els.infoDetails.innerHTML = details.join('') || '';
    }

    // Carga los servidores
    state.servers = data.servers || {};
    state.serversFlat = buildServersFlat(state.servers);
    renderServers();

    if (state.serversFlat.length) {
      // Auto-selecciona el primer servidor
      await selectServer(state.serversFlat[0].num);
    } else {
      showToast('Sin servidores disponibles');
    }

  } catch (e) {
    console.error('[loadMovie] Error:', e);
    showToast('Error al cargar: ' + e.message);
    els.serversStatusBadge.textContent = 'ERROR';
    els.serversStatusBadge.className = 'inline-flex items-center px-1.5 py-0.5 rounded text-[9px] font-semibold bg-rose-500/20 text-rose-300 border border-rose-500/30';
  }
}

/* ══════════════════════════════════════════════════════════════════════════
   HUD: mostrar/ocultar y controles
   ══════════════════════════════════════════════════════════════════════════ */
function showHUD() {
  state.isHudVisible = true;
  els.hud.classList.remove('hud-hidden');
  els.btnRevealHud.classList.add('opacity-0', 'pointer-events-none');
}
function hideHUD() {
  if (state.isModalOpen || state.isFeedbackOpen || state.isOptionsDrawerOpen) return;
  state.isHudVisible = false;
  els.hud.classList.add('hud-hidden');
  els.btnRevealHud.classList.remove('opacity-0', 'pointer-events-none');
}
function resetIdleTimer() {
  if (!state.isHudVisible) showHUD();
  clearTimeout(state.idleTimer);
  state.idleTimer = setTimeout(() => {
    if (!state.isModalOpen && !state.isFeedbackOpen && !state.isOptionsDrawerOpen) hideHUD();
  }, state.idleTimeoutDuration);
}

function updateScrubberUI() {
  if (state.duration <= 0) {
    els.slider.value = 0;
    els.progressFill.style.width = '0%';
    els.currentTimeText.textContent = formatTime(state.currentTime);
    els.durationTimeText.textContent = '00:00';
    return;
  }
  const percentage = (state.currentTime / state.duration) * 100;
  const clampedPct = Math.min(Math.max(percentage, 0), 100);
  if (!state.isSeeking) els.slider.value = clampedPct;
  els.progressFill.style.width = `${clampedPct}%`;
  els.currentTimeText.textContent = formatTime(state.currentTime);
  els.durationTimeText.textContent = formatTime(state.duration);
}

function togglePlayPause() {
  if (_currentVideoEl) {
    if (_currentVideoEl.paused) _currentVideoEl.play().catch(() => {});
    else _currentVideoEl.pause();
  } else {
    showToast('Usá los controles del iframe');
  }
}
function rewind10() {
  if (_currentVideoEl) _currentVideoEl.currentTime = Math.max(0, _currentVideoEl.currentTime - 10);
  else showToast('Solo HLS/MP4');
}
function forward10() {
  if (_currentVideoEl) _currentVideoEl.currentTime = Math.min(_currentVideoEl.duration || Infinity, _currentVideoEl.currentTime + 10);
  else showToast('Solo HLS/MP4');
}
function toggleOptionsDrawer(force) {
  const shouldOpen = typeof force === 'boolean' ? force : !state.isOptionsDrawerOpen;
  state.isOptionsDrawerOpen = shouldOpen;
  if (shouldOpen) {
    els.optionsPanel.classList.remove('options-drawer-collapsed');
    els.optionsPanel.classList.add('options-drawer-expanded');
    els.toggleChevron.classList.add('rotate-180', 'text-brand-cyan');
    clearTimeout(state.idleTimer);
  } else {
    els.optionsPanel.classList.remove('options-drawer-expanded');
    els.optionsPanel.classList.add('options-drawer-collapsed');
    els.toggleChevron.classList.remove('rotate-180', 'text-brand-cyan');
    resetIdleTimer();
  }
}
function toggleInfoModal(open) {
  state.isModalOpen = typeof open === 'boolean' ? open : !state.isModalOpen;
  if (state.isModalOpen) {
    els.infoModal.classList.remove('opacity-0', 'pointer-events-none');
    els.infoModalCard.classList.remove('scale-95');
    els.infoModalCard.classList.add('scale-100');
    clearTimeout(state.idleTimer);
  } else {
    els.infoModal.classList.add('opacity-0', 'pointer-events-none');
    els.infoModalCard.classList.add('scale-95');
    els.infoModalCard.classList.remove('scale-100');
    resetIdleTimer();
  }
}
function toggleFeedbackModal(open) {
  state.isFeedbackOpen = typeof open === 'boolean' ? open : !state.isFeedbackOpen;
  if (state.isFeedbackOpen) {
    els.feedbackModal.classList.remove('opacity-0', 'pointer-events-none');
    els.feedbackCard.classList.remove('scale-95');
    els.feedbackCard.classList.add('scale-100');
  } else {
    els.feedbackModal.classList.add('opacity-0', 'pointer-events-none');
    els.feedbackCard.classList.add('scale-95');
    els.feedbackCard.classList.remove('scale-100');
  }
}

/* ══════════════════════════════════════════════════════════════════════════
   EVENTOS: FORMATO / AUDIO / SUBTÍTULOS
   ══════════════════════════════════════════════════════════════════════════ */
document.querySelectorAll('#group-formato-pantalla button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#group-formato-pantalla button').forEach(b => {
      b.classList.remove('tv-btn-active');
      const c = b.querySelector('.check-icon'); if (c) c.classList.add('hidden');
    });
    btn.classList.add('tv-btn-active');
    const check = btn.querySelector('.check-icon'); if (check) check.classList.remove('hidden');
    // Aplica formato (simple transform para demostración)
    if (_currentFrame) {
      _currentFrame.style.transform = btn.dataset.aspect === 'stretch' ? 'scale(1.05)' : 'scale(1)';
      _currentFrame.style.objectFit = btn.dataset.aspect === '4-3' ? 'cover' : 'contain';
    }
  });
});

document.querySelectorAll('#group-audio-options button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#group-audio-options button').forEach(b => {
      b.classList.remove('tv-btn-active');
      const c = b.querySelector('.check-icon'); if (c) c.classList.add('hidden');
    });
    btn.classList.add('tv-btn-active');
    const check = btn.querySelector('.check-icon'); if (check) check.classList.remove('hidden');
    const lang = btn.dataset.audio;
    state.currentAudio = lang;
    // Aquí podrías filtrar servidores por idioma si lo deseas
    els.badgeActiveAudio.textContent = lang === 'latino' ? '🇲🇽 Español Latino' : lang === 'castellano' ? '🇪🇸 Castellano' : '📝 Subtitulado';
    showToast(`Audio: ${lang}`);
  });
});

document.querySelectorAll('#group-subtitle-options button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#group-subtitle-options button').forEach(b => {
      b.classList.remove('tv-btn-active');
      const c = b.querySelector('.check-icon'); if (c) c.classList.add('hidden');
    });
    btn.classList.add('tv-btn-active');
    const check = btn.querySelector('.check-icon'); if (check) check.classList.remove('hidden');
    state.currentSubtitle = btn.dataset.sub;
    els.badgeActiveSubtitle.textContent = btn.dataset.sub === 'off' ? 'DESACTIVADOS' : btn.dataset.sub.toUpperCase();
    showToast(`Subtítulos: ${btn.textContent.trim()}`);
  });
});

/* ══════════════════════════════════════════════════════════════════════════
   EVENTOS: BOTONES
   ══════════════════════════════════════════════════════════════════════════ */
els.btnToggleOptions.addEventListener('click', (e) => { e.stopPropagation(); toggleOptionsDrawer(); });
els.btnInfo.addEventListener('click', () => toggleInfoModal(true));
els.posterThumb.addEventListener('click', () => toggleInfoModal(true));
els.btnCloseModal.addEventListener('click', () => toggleInfoModal(false));
els.btnModalCloseAction.addEventListener('click', () => toggleInfoModal(false));
els.btnModalPlay.addEventListener('click', () => toggleInfoModal(false));
els.btnBarFeedback.addEventListener('click', () => toggleFeedbackModal(true));
els.btnCloseFeedback.addEventListener('click', () => toggleFeedbackModal(false));
els.btnCancelFeedback.addEventListener('click', () => toggleFeedbackModal(false));
els.feedbackForm.addEventListener('submit', (e) => { e.preventDefault(); toggleFeedbackModal(false); showToast('Reporte enviado'); triggerActionFlash(ICONS.check); });
els.btnExit.addEventListener('click', () => { if (state.isFeedbackOpen) toggleFeedbackModal(false); else if (state.isOptionsDrawerOpen) toggleOptionsDrawer(false); else if (state.isModalOpen) toggleInfoModal(false); else hideHUD(); });
els.btnRevealHud.addEventListener('click', () => { showHUD(); resetIdleTimer(); });
els.btnPlay.addEventListener('click', togglePlayPause);
els.btnRewind.addEventListener('click', rewind10);
els.btnForward.addEventListener('click', forward10);

els.bottomHoverDetector.addEventListener('mouseenter', () => { showHUD(); resetIdleTimer(); });

els.slider.addEventListener('pointerdown', () => { state.isSeeking = true; });
els.slider.addEventListener('input', (e) => {
  const pct = parseFloat(e.target.value);
  state.currentTime = Math.floor((pct / 100) * state.duration);
  els.progressFill.style.width = `${pct}%`;
  els.currentTimeText.textContent = formatTime(state.currentTime);
  resetIdleTimer();
});
els.slider.addEventListener('change', (e) => {
  state.isSeeking = false;
  const pct = parseFloat(e.target.value);
  state.currentTime = Math.floor((pct / 100) * state.duration);
  if (_currentVideoEl) _currentVideoEl.currentTime = state.currentTime;
  resetIdleTimer();
});
els.slider.addEventListener('pointerup', () => { state.isSeeking = false; });

window.addEventListener('mousemove', resetIdleTimer);
window.addEventListener('touchstart', resetIdleTimer);

window.addEventListener('keydown', (e) => {
  if (state.isFeedbackOpen) { if (e.key === 'Escape') toggleFeedbackModal(false); return; }
  switch (e.key) {
    case ' ':
    case 'Enter':
      if (state.isModalOpen) { e.preventDefault(); toggleInfoModal(false); return; }
      e.preventDefault(); togglePlayPause(); break;
    case 'ArrowLeft': if (state.isModalOpen) return; e.preventDefault(); rewind10(); break;
    case 'ArrowRight': if (state.isModalOpen) return; e.preventDefault(); forward10(); break;
    case 'ArrowUp': e.preventDefault(); if (state.isOptionsDrawerOpen) toggleOptionsDrawer(false); toggleInfoModal(!state.isModalOpen); break;
    case 'ArrowDown': e.preventDefault(); if (state.isModalOpen) toggleInfoModal(false); toggleOptionsDrawer(); break;
    case 'f': case 'F': e.preventDefault(); if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {}); else document.exitFullscreen().catch(() => {}); break;
    case 'i': case 'I': e.preventDefault(); toggleInfoModal(!state.isModalOpen); break;
    case 'Escape': case 'Backspace':
      e.preventDefault();
      if (state.isFeedbackOpen) toggleFeedbackModal(false);
      else if (state.isOptionsDrawerOpen) toggleOptionsDrawer(false);
      else if (state.isModalOpen) toggleInfoModal(false);
      else hideHUD();
      break;
  }
});

/* Actualizar indicador de velocidad ficticio */
setInterval(() => {
  const speeds = ['4.2MB/S', '4.3MB/S', '4.1MB/S', '4.4MB/S', '4.2MB/S'];
  const pick = speeds[Math.floor(Math.random() * speeds.length)];
  const indicator = $('bitrate-indicator');
  if (indicator) indicator.textContent = pick;
}, 4000);

/* ══════════════════════════════════════════════════════════════════════════
   INIT — Arranca leyendo el ID de TMDB de la URL
   ══════════════════════════════════════════════════════════════════════════ */
(async function init() {
  // Aquí se configuran los parámetros de búsqueda (ID de TMDB y tipo)
  const id = getQueryParam('id') || '315635';  // ID por defecto (Spider-Man)
  const type = getQueryParam('type') || 'movie'; // 'movie' o 'tv'
  
  updateScrubberUI();
  resetIdleTimer();
  
  // Carga los datos y servidores usando el ID de TMDB
  await loadMovie(id, type);
})();
</script>
