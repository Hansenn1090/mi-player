<script>
/* ══════════════════════════════════════════════════════════════════════════
   1. SNIFFER DE RED
   ══════════════════════════════════════════════════════════════════════════ */
(function(){
  'use strict';
  const detected = new Set();
  function isMedia(u){
    if (!u || typeof u !== 'string') return false;
    const s = u.toLowerCase();
    return /\.(m3u8|mp4|webm|mkv|mov|ts|mpd)(\?|$)/i.test(s) || s.includes('m3u8') || s.includes('master.txt');
  }
  function emit(url, source){
    if (!url || detected.has(url)) return;
    detected.add(url);
    const kind = /\.m3u8(\?|$)/i.test(url) || url.includes('m3u8') ? 'hls' : 'mp4';
    console.log('%c[Sniffer] ' + kind.toUpperCase() + ' (' + source + '): ' + url, 'color:#00d2ff');
    window.dispatchEvent(new CustomEvent('ulp:mediaDetected', { detail: { url: url, kind: kind, source: source } }));
  }
  const _f = window.fetch;
  window.fetch = function(){
    var a = arguments;
    try { var u = typeof a[0]==='string' ? a[0] : (a[0] && a[0].url); if (isMedia(u)) emit(u,'fetch'); } catch(_){}
    return _f.apply(this, a);
  };
  const _o = XMLHttpRequest.prototype.open;
  XMLHttpRequest.prototype.open = function(m, u){
    try { if (isMedia(u)) emit(u,'xhr'); } catch(_){}
    var args = [m, u].concat(Array.prototype.slice.call(arguments, 2));
    return _o.apply(this, args);
  };
  new MutationObserver(function(muts){
    muts.forEach(function(m){
      m.addedNodes.forEach(function(n){
        if (n.nodeName === 'VIDEO' || n.nodeName === 'SOURCE'){
          var s = n.src || n.currentSrc;
          if (isMedia(s)) emit(s,'mutation');
        }
      });
    });
  }).observe(document.documentElement, { childList:true, subtree:true });
})();

/* ══════════════════════════════════════════════════════════════════════════
   2. TMDB — con tu API key integrada
   ══════════════════════════════════════════════════════════════════════════ */
const TMDB_CONFIG = {
  apiKey: '2d85217008ed46189916cf9cf1eaef53',   // ← TU API KEY
  language: 'es-ES',
  baseUrl: 'https://api.themoviedb.org/3',
  imageBase: 'https://image.tmdb.org/t/p',
  posterSize: 'w342',
  backdropSize: 'w1280',
  cache: new Map()
};

function _tmdbCacheGet(key){
  try { const v = sessionStorage.getItem('tmdb_' + key); return v ? JSON.parse(v) : null; }
  catch(_){ return null; }
}
function _tmdbCacheSet(key, val){
  try { sessionStorage.setItem('tmdb_' + key, JSON.stringify(val)); } catch(_){}
}

async function fetchTMDB(id, type){
  if (!id) return null;
  type = type || 'movie';
  const cacheKey = type + '_' + id;
  if (TMDB_CONFIG.cache.has(cacheKey)) return TMDB_CONFIG.cache.get(cacheKey);
  const cached = _tmdbCacheGet(cacheKey);
  if (cached){ TMDB_CONFIG.cache.set(cacheKey, cached); return cached; }

  const url = TMDB_CONFIG.baseUrl + '/' + type + '/' + id + '?api_key=' + TMDB_CONFIG.apiKey + '&language=' + TMDB_CONFIG.language;
  try {
    const r = await fetch(url, { credentials: 'omit' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();

    const info = {
      id: data.id,
      title: data.title || data.name || 'Sin título',
      overview: data.overview || '',
      year: (data.release_date || data.first_air_date || '').slice(0,4),
      runtime: data.runtime || (data.episode_run_time && data.episode_run_time[0]) || 0,
      voteAverage: Math.round((data.vote_average || 0) * 10) / 10,
      genres: (data.genres || []).map(function(g){ return g.name; }),
      poster: data.poster_path ? TMDB_CONFIG.imageBase + '/' + TMDB_CONFIG.posterSize + data.poster_path : null,
      backdrop: data.backdrop_path ? TMDB_CONFIG.imageBase + '/' + TMDB_CONFIG.backdropSize + data.backdrop_path : null
    };

    TMDB_CONFIG.cache.set(cacheKey, info);
    _tmdbCacheSet(cacheKey, info);
    return info;
  } catch(e){
    console.warn('[TMDB] Error:', e.message);
    return null;
  }
}

function applyTMDBInfo(info){
  if (!info) return;
  const titleEl = document.getElementById('title-el');
  if (titleEl) titleEl.textContent = info.title;

  const backdropImg = document.getElementById('poster-backdrop-img');
  if (backdropImg && info.backdrop){ backdropImg.src = info.backdrop; backdropImg.alt = info.title; }

  const posterImg = document.getElementById('poster-img');
  if (posterImg && info.poster){ posterImg.src = info.poster; posterImg.alt = info.title; }

  const metaEl = document.getElementById('meta-el');
  if (metaEl){
    const parts = [];
    if (info.year) parts.push(info.year);
    if (info.genres && info.genres.length) parts.push(info.genres.slice(0, 2).join(' / '));
    if (info.runtime){
      const h = Math.floor(info.runtime / 60);
      const m = info.runtime % 60;
      parts.push(h > 0 ? h + 'h ' + m + 'm' : m + 'm');
    }
    if (info.voteAverage > 0) parts.push('⭐ ' + info.voteAverage);
    metaEl.textContent = parts.join(' • ') || 'Sin información';
  }

  console.log('%c[TMDB] ' + info.title + ' (' + info.year + ')', 'color:#01b4e4;font-weight:bold');
}

  'español':     { label:'ESPAÑOL', flag:'es' },
  'subtitulado': { label:'SUBTITULADO', flag:'us' }
};
const PROVIDER_DISPLAY = {
  streamwish:'StreamWish', vidhide:'VidHide', filelions:'FileLions',
  voe:'VOE', vidmoly:'Vidmoly', uqload:'Uqload', vidspeed:'VidSpeed',
  doodstream:'DoodStream', primeload:'PrimeLoad', powvideo:'PowVideo',
  streamplay:'Streamplay', streamhide:'StreamHide', hxfile:'HXFile',
  mp4upload:'Mp4Upload', filemoon:'FileMoon', streamtape:'StreamTape',
  rapidvideo:'RapidVideo', mixdrop:'MixDrop', okru:'Ok.ru', fembed:'FEmbed',
  direct:'Direct', remux:'Remux', fastream:'Fastream'
};
const esc = function(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); };
const cap = function(s){ return s ? s.charAt(0).toUpperCase()+s.slice(1) : s; };
function trueBase(n){
  let b=n||'',p;
  do{p=b;b=b.replace(/[\s_-]+\d+$/,'').replace(/(?<=[a-zA-Z]{3})\d+$/,'');}while(b!==p);
  return b;
}
function normKey(n){
  let b=(n||'').toLowerCase().replace(/[\s_-]+\d+$/,'');
  if(['hglink','flaswish','wishfast','awish'].includes(b)) return 'streamwish';
  if(['filelions','minochinos','vihide','vidhidepro','callistanise','hgcloud','earnvids','masukesting','morencius'].includes(b)) return 'vidhide';
  if(['dood','doodcx','doodpm','doodto','doodla','d0000d'].includes(b)) return 'doodstream';
  return b;
}
const HLS_RE = [/\.m3u8(\?|$)/i, /master\.txt(\?|$)/i, /\/stream(\?|\.m3u8\?|\.php\?)url=/i, /hls_proxy1\.php/i];
const MP4_RE = [/\.mp4(\?|$)/i, /\.webm(\?|$)/i, /\.mov(\?|$)/i, /\.mkv(\?|$)/i, /\.ts(\?|$)/i];
function detectByUrl(url){
  if (!url) return null;
  for (let i = 0; i < HLS_RE.length; i++) if (HLS_RE[i].test(url)) return 'hls';
  if (/remux\.unlimplay\.com/i.test(url)) return 'hls';
  for (let i = 0; i < MP4_RE.length; i++) if (MP4_RE[i].test(url)) return 'mp4';
  return null;
}

/* ══════════════════════════════════════════════════════════════════════════
   5. EXTRACTOR BACKEND
   ══════════════════════════════════════════════════════════════════════════ */
async function extractFromBackend(embedUrl, timeoutMs){
  timeoutMs = timeoutMs || 20000;
  const ctrl = new AbortController();
  const t = setTimeout(function(){ ctrl.abort(); }, timeoutMs);
  try {
    const r = await fetch('extract.php?url=' + encodeURIComponent(embedUrl), {
      signal: ctrl.signal, credentials: 'omit'
    });
    clearTimeout(t);
    if (!r.ok) return null;
    const data = await r.json();
    if (data.error || !data.stream) return null;
    return { stream: data.stream, kind: data.kind, referer: data.referer || embedUrl };
  } catch(e){
    clearTimeout(t);
    return null;
  }
}

/* ══════════════════════════════════════════════════════════════════════════
   7. EXTRACCIÓN MASIVA
   ══════════════════════════════════════════════════════════════════════════ */
async function extractAllServers(srvs){
  const entries = Object.entries(srvs);
  const total = entries.length;
  if (!total) return;
  showExtractPanel(Object.keys(srvs));

  let done = 0, okCount = 0, failCount = 0;
  const extracted = {};

  await Promise.all(entries.map(async function(entry){
    const name = entry[0], url = entry[1];
    const byUrl = detectByUrl(url);
    if (byUrl){
      extracted[name] = { url: url, stream: url, kind: byUrl, referer: url };
      updateExtractItem(name, byUrl, true);
      okCount++;
    } else {
      const res = await extractFromBackend(url);
      if (res){
        extracted[name] = { url: url, stream: res.stream, kind: res.kind, referer: res.referer };
        updateExtractItem(name, res.kind, true);
        okCount++;
      } else {
        extracted[name] = { url: url, stream: null, kind: 'iframe', referer: url };
        updateExtractItem(name, 'iframe', false);
        failCount++;
      }
    }
    done++;
    updateExtractProgress(done, total);
  }));

  _extracted = extracted;
  finishExtractPanel(okCount, failCount);
  await new Promise(function(r){ setTimeout(r, 1200); });
}

/* ══════════════════════════════════════════════════════════════════════════
   8. MONTAJE
   ══════════════════════════════════════════════════════════════════════════ */
function teardown(){
  if (_currentHls){ try{ _currentHls.destroy(); }catch(_){} _currentHls = null; }
  if (_currentFrame){ try{ _currentFrame.remove(); }catch(_){} _currentFrame = null; }
  _currentVideoEl = null;
  _snifferHandled = false;
}
function attachVideoEvents(vid){
  vid.addEventListener('loadedmetadata', function(){ state.duration = vid.duration || 0; updateScrubber(); hideLoading(); });
  vid.addEventListener('timeupdate', function(){ state.currentTime = vid.currentTime || 0; if (!state.isSeeking) updateScrubber(); });
  vid.addEventListener('play',  function(){ state.isPlaying=true; updatePlayPauseUI(true); });
  vid.addEventListener('pause', function(){ state.isPlaying=false; updatePlayPauseUI(false); });
}
function mountHls(url){
  _currentKind = 'hls';
  const wrap = document.createElement('div');
  wrap.style.cssText = 'position:absolute;inset:0;background:#000';
  const vid = document.createElement('video');
  vid.playsInline = true; vid.preload = 'metadata'; vid.controls = false;
  vid.style.cssText = 'width:100%;height:100%;object-fit:contain;background:#000';
  wrap.appendChild(vid);
  els.videoStage.appendChild(wrap);
  _currentFrame = wrap; _currentVideoEl = vid;
  attachVideoEvents(vid);

  if (typeof Hls !== 'undefined' && Hls.isSupported()){
    const hls = new Hls({ maxBufferLength:30, startLevel:-1, enableWorker:true });
    _currentHls = hls;
    hls.loadSource(url); hls.attachMedia(vid);
    hls.on(Hls.Events.MANIFEST_PARSED, function(){ hideLoading(); vid.play().catch(function(){}); });
    hls.on(Hls.Events.ERROR, function(_, d){ if (d.fatal) showToast('Error HLS'); });
  } else if (vid.canPlayType('application/vnd.apple.mpegurl')){
    vid.src = url; vid.load();
    vid.addEventListener('canplay', function(){ hideLoading(); vid.play().catch(function(){}); }, { once:true });
  }
}
function mountMp4(url){
  _currentKind = 'mp4';
  const wrap = document.createElement('div');
  wrap.style.cssText = 'position:absolute;inset:0;background:#000';
  const vid = document.createElement('video');
  vid.playsInline = true; vid.preload = 'metadata'; vid.controls = false;
  vid.style.cssText = 'width:100%;height:100%;object-fit:contain;background:#000';
  wrap.appendChild(vid);
  els.videoStage.appendChild(wrap);
  _currentFrame = wrap; _currentVideoEl = vid;
  attachVideoEvents(vid);
  vid.src = url; vid.load();
  vid.addEventListener('canplay', function(){ hideLoading(); vid.play().catch(function(){}); }, { once:true });
}
function mountIframe(url){
  _currentKind = 'iframe';
  const iframe = document.createElement('iframe');
  iframe.className = 'ulp-iframe';
  iframe.allow = 'autoplay *; fullscreen *; encrypted-media *; picture-in-picture *; web-share *; clipboard-write; display-capture; camera; microphone; payment';
  iframe.allowFullscreen = true;
  iframe.setAttribute('allowfullscreen','');
  iframe.setAttribute('mozallowfullscreen','true');
  iframe.setAttribute('webkitallowfullscreen','true');
  iframe.setAttribute('referrerpolicy','no-referrer');
  iframe.setAttribute('scrolling','no');
  iframe.src = url;
  iframe.addEventListener('load', function(){ hideLoading(); });
  els.videoStage.appendChild(iframe);
  _currentFrame = iframe;
  _currentVideoEl = null;
  state.duration = 0; state.currentTime = 0;
  updateScrubber();
  els.hud.classList.add('hud-hidden');
  clearTimeout(state.idleTimer);
}

/* ══════════════════════════════════════════════════════════════════════════
   9. CARGA DE SERVIDOR
   ══════════════════════════════════════════════════════════════════════════ */
function loadServer(name){
  const srv = _extracted[name];
  if (!srv) return;
  state.currentSrv = name;
  els.serverButtonsScroll.querySelectorAll('button').forEach(function(b){
    b.classList.toggle('tv-btn-active', b.dataset.srv === name);
  });
  if (els.btnOpenDirect) els.btnOpenDirect.dataset.url = srv.stream || srv.url;

  const disp = PROVIDER_DISPLAY[normKey(trueBase(name))] || cap(trueBase(name));
  const label = srv.kind === 'hls' ? 'HLS' : srv.kind === 'mp4' ? 'MP4' : 'iframe';
  showLoading('Cargando ' + disp + ' (' + label + ')…');
  setModeChip(srv.kind);

  teardown();
  els.centerPlayWrapper.classList.add('opacity-0','scale-90','pointer-events-none');
  els.centerPlayWrapper.style.display = 'none';
  els.backdropContainer.classList.add('opacity-0');

  if (srv.stream && srv.kind === 'hls') mountHls(srv.stream);
  else if (srv.stream && srv.kind === 'mp4') mountMp4(srv.stream);
  else mountIframe(srv.url);

  state.hasStarted = true;
  updatePlayPauseUI(true);

  if (srv.kind === 'iframe') clearTimeout(state.idleTimer);
  else resetIdleTimer();
}

/* ══════════════════════════════════════════════════════════════════════════
   10. AUTO-CARGA
   ══════════════════════════════════════════════════════════════════════════ */
function autoLoadBest(){
  const names = Object.keys(_extracted);
  if (!names.length) return;
  const prio = { hls:0, mp4:1, iframe:2 };
  names.sort(function(a,b){ return (prio[_extracted[a].kind]||3) - (prio[_extracted[b].kind]||3); });
  loadServer(names[0]);
}

/* ══════════════════════════════════════════════════════════════════════════
   11. AUTO-DISPATCH desde sniffer
   ══════════════════════════════════════════════════════════════════════════ */
window.addEventListener('ulp:mediaDetected', function(e){
  const detail = e.detail;
  if (_snifferHandled || _currentKind !== 'iframe') return;
  if (detail.kind !== 'hls' && detail.kind !== 'mp4') return;
  _snifferHandled = true;
  showToast('¡' + detail.kind.toUpperCase() + ' limpio! Tomando control...');
  setTimeout(function(){
    teardown();
    if (detail.kind === 'hls') mountHls(detail.url); else mountMp4(detail.url);
    setModeChip(detail.kind);
  }, 400);
});

/* ══════════════════════════════════════════════════════════════════════════
   12. RENDER BOTONES
   ══════════════════════════════════════════════════════════════════════════ */
function renderServerButtons(){
  const c = els.serverButtonsScroll;
  c.innerHTML = '';
  const names = Object.keys(_extracted);
  if (!names.length){
    c.innerHTML = '<span class="text-xs text-neutral-500 italic">Sin servidores</span>';
    return;
  }
  const totals = {}, seen = {};
  names.forEach(function(n){
    const k = normKey(trueBase(n));
    totals[k] = (totals[k]||0)+1;
  });
  const prio = { hls:0, mp4:1, iframe:2 };
  names.sort(function(a,b){ return (prio[_extracted[a].kind]||3) - (prio[_extracted[b].kind]||3); });

  names.forEach(function(name){
    const kind = _extracted[name].kind;
    const base = trueBase(name);
    const key = normKey(base);
    seen[key] = (seen[key]||0)+1;
    const num = totals[key] > 1 ? seen[key] : null;
    const disp = PROVIDER_DISPLAY[key] || cap(base);

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.dataset.srv = name;
    btn.className = 'tv-btn-normal px-3 py-2 text-xs sm:text-sm font-medium flex items-center space-x-2 rounded-lg border border-white/10 transition whitespace-nowrap';
    btn.innerHTML = '<span>' + esc(disp) + (num ? ' <span class="text-[10px] opacity-70">#' + num + '</span>' : '') + '</span>' +
                    '<span class="fmt-badge fmt-' + kind + '">' + kind.toUpperCase() + '</span>';
    btn.addEventListener('click', function(){ loadServer(name); });
    c.appendChild(btn);
  });

  if (els.badgeServerStatus){
    const clean = names.filter(function(n){ return _extracted[n].kind !== 'iframe'; }).length;
    els.badgeServerStatus.textContent = '✓ ' + clean + ' limpios + ' + (names.length - clean) + ' iframe';
  }
}

/* ══════════════════════════════════════════════════════════════════════════
   13. IDIOMA
   ══════════════════════════════════════════════════════════════════════════ */
function renderLangButtons(){
  const b = els.langButtons;

    if (!embeds[lang]) return;
    const m = LANG_META[lang];

    btn.innerHTML = '<img src="https://flagcdn.com/w20/' + m.flag + '.png" width="16" class="rounded-sm"><span>' + m.label + '</span>';

async function switchLang(lang){
  if (lang === state.currentLang) return;
  state.currentLang = lang;
  renderLangButtons();
  const srvs = embeds[lang] || {};

/* ══════════════════════════════════════════════════════════════════════════
   14. SCRUBBER / PLAY
   ══════════════════════════════════════════════════════════════════════════ */
function updateScrubber(){
  if (state.duration <= 0){
    els.progressFill.style.width='0%';
    els.currentTimeText.textContent = fmt(state.currentTime);
    els.durationTimeText.textContent = _currentKind==='iframe' ? '—' : '00:00';
    return;
  }
  const pct = Math.min(Math.max((state.currentTime/state.duration)*100,0),100);
  if (!state.isSeeking) els.slider.value = pct;
  els.progressFill.style.width = pct+'%';
  els.currentTimeText.textContent = fmt(state.currentTime);
  els.durationTimeText.textContent = fmt(state.duration);
}
function updatePlayPauseUI(p){
  state.isPlaying = p;
  if (els.legendPlayLabel) els.legendPlayLabel.textContent = p ? 'Pausar' : 'Reproducir';
}
function togglePlayPause(){
  if (_currentKind === 'iframe'){
    try { _currentFrame.contentWindow.postMessage({ type: state.isPlaying?'pause':'play' }, '*'); } catch(_){}
    state.isPlaying = !state.isPlaying;
    updatePlayPauseUI(state.isPlaying);
    flashIcon(state.isPlaying ? ICONS.play : ICONS.pause);
    return;
  }
  if (_currentVideoEl){
    if (_currentVideoEl.paused){ _currentVideoEl.play().catch(function(){}); flashIcon(ICONS.play); }
    else { _currentVideoEl.pause(); flashIcon(ICONS.pause); }
  }
  showHudTemporarily();
}
function rewind10(){
  if (_currentVideoEl){ _currentVideoEl.currentTime = Math.max(0, _currentVideoEl.currentTime-10); flashIcon(ICONS.rewind); showHudTemporarily(); }
  else showToast('Solo disponible en HLS/MP4');
}
function forward10(){
  if (_currentVideoEl){ _currentVideoEl.currentTime = Math.min(_currentVideoEl.duration||Infinity, _currentVideoEl.currentTime+10); flashIcon(ICONS.forward); showHudTemporarily(); }
  else showToast('Solo disponible en HLS/MP4');
}

/* ══════════════════════════════════════════════════════════════════════════
   15. HUD
   ══════════════════════════════════════════════════════════════════════════ */
function showHUD(){ state.isHudVisible=true; els.hud.classList.remove('hud-hidden'); els.btnRevealHud.classList.add('opacity-0','pointer-events-none'); }
function hideHUD(){ if (state.isOptionsDrawerOpen) return; state.isHudVisible=false; els.hud.classList.add('hud-hidden'); els.btnRevealHud.classList.remove('opacity-0','pointer-events-none'); }
function resetIdleTimer(){
  if (!state.isHudVisible) showHUD();
  clearTimeout(state.idleTimer);
  state.idleTimer = setTimeout(function(){
    if (state.isPlaying && !state.isOptionsDrawerOpen) hideHUD();
  }, state.idleTimeoutDuration);
}
function showHudTemporarily(){ showHUD(); resetIdleTimer(); }
function toggleOptionsDrawer(force){
  const open = typeof force==='boolean' ? force : !state.isOptionsDrawerOpen;
  state.isOptionsDrawerOpen = open;
  if (open){
    els.optionsPanel.classList.remove('options-drawer-collapsed');
    els.optionsPanel.classList.add('options-drawer-expanded');
    els.toggleChevron.classList.add('rotate-180','text-brand-cyan');
    clearTimeout(state.idleTimer);
  } else {
    els.optionsPanel.classList.remove('options-drawer-expanded');
    els.optionsPanel.classList.add('options-drawer-collapsed');
    els.toggleChevron.classList.remove('rotate-180','text-brand-cyan');
    resetIdleTimer();
  }
}
function applyAspect(mode){
  state.currentAspect = mode;
  els.videoWrapper.classList.remove('aspect-mode-16-9','aspect-mode-stretch','aspect-mode-zoom','aspect-mode-4-3');
  els.videoWrapper.classList.add('aspect-mode-'+mode);
  showToast('Pantalla: '+mode);
}

/* ══════════════════════════════════════════════════════════════════════════
   16. LISTENERS
   ══════════════════════════════════════════════════════════════════════════ */
els.btnToggleOptions.addEventListener('click', function(e){ e.stopPropagation(); toggleOptionsDrawer(); });
els.btnRevealHud.addEventListener('click', function(){ showHUD(); resetIdleTimer(); });
els.btnCenterPlay.addEventListener('click', function(){ if (!state.hasStarted) autoLoadBest(); else togglePlayPause(); });
els.btnLegendPlay.addEventListener('click', togglePlayPause);
els.btnLegendRewind.addEventListener('click', rewind10);
els.btnLegendForward.addEventListener('click', forward10);
els.btnReloadSrv.addEventListener('click', function(){ if (state.currentSrv){ loadServer(state.currentSrv); showToast('Recargando…'); } });
els.btnOpenDirect.addEventListener('click', function(){ const u = els.btnOpenDirect.dataset.url; if (u) window.open(u, '_blank', 'noopener'); });
els.btnVerifyAgain.addEventListener('click', async function(){
  const srvs = embeds[state.currentLang] || {};
  await extractAllServers(srvs);
  renderServerButtons();
  autoLoadBest();
  showToast('Re-extracción completa');
});

document.querySelectorAll('#aspect-buttons button').forEach(function(btn){
  btn.addEventListener('click', function(){
    document.querySelectorAll('#aspect-buttons button').forEach(function(b){ b.classList.remove('tv-btn-active'); });
    btn.classList.add('tv-btn-active');
    applyAspect(btn.dataset.aspect);
  });
});

els.slider.addEventListener('input', function(e){
  if (_currentKind === 'iframe'){ e.target.value = 0; return; }
  const pct = parseFloat(e.target.value);
  state.currentTime = (pct/100)*state.duration;
  els.progressFill.style.width = pct+'%';
  els.currentTimeText.textContent = fmt(state.currentTime);
  resetIdleTimer();
});
els.slider.addEventListener('change', function(e){
  if (_currentKind === 'iframe') return;
  state.isSeeking = false;
  const sec = (parseFloat(e.target.value)/100)*state.duration;
  if (_currentVideoEl) _currentVideoEl.currentTime = sec;
  state.currentTime = sec;
  updateScrubber();
  resetIdleTimer();
});
els.slider.addEventListener('pointerdown', function(){ state.isSeeking = true; });
els.slider.addEventListener('pointerup', function(){ state.isSeeking = false; });

window.addEventListener('mousemove', resetIdleTimer);
window.addEventListener('touchstart', resetIdleTimer);
window.addEventListener('keydown', function(e){
  if (['INPUT','TEXTAREA'].includes(document.activeElement && document.activeElement.tagName)) return;
  switch(e.key){
    case ' ': case 'Enter': e.preventDefault(); togglePlayPause(); break;
    case 'ArrowLeft': e.preventDefault(); rewind10(); break;
    case 'ArrowRight': e.preventDefault(); forward10(); break;
    case 'ArrowDown': e.preventDefault(); toggleOptionsDrawer(); break;
    case 'Escape': case 'Backspace': e.preventDefault();
      if (state.isOptionsDrawerOpen) toggleOptionsDrawer(false);
      else hideHUD();
      break;
  }
});

/* ══════════════════════════════════════════════════════════════════════════
   17. FINALIZE PLAYER — con TMDB
   ══════════════════════════════════════════════════════════════════════════ */
function filterEmbeds(raw){
  const out = {};
  LANG_ORDER.forEach(function(lang){
    if (!raw[lang] || !Object.keys(raw[lang]).length) return;
    out[lang] = {};
    Object.keys(raw[lang]).forEach(function(n){ out[lang][n] = raw[lang][n]; });
  });
  return out;
}

window.finalizePlayer = async function(finalData, tmdbId, tmdbType){
  embeds = filterEmbeds(finalData || {});
  if (!Object.keys(embeds).length){ showToast('Sin servidores'); return; }

  if (tmdbId){
    fetchTMDB(tmdbId, tmdbType || 'movie').then(function(info){
      if (info) applyTMDBInfo(info);
    }).catch(function(){});
  }

  state.currentLang = LANG_ORDER.find(function(l){ return embeds[l]; }) || Object.keys(embeds)[0];
  if (_playerBuilt) return;
  _playerBuilt = true;
  renderLangButtons();

  const srvs = embeds[state.currentLang] || {};
  await extractAllServers(srvs);
  renderServerButtons();
  setTimeout(autoLoadBest, 300);
};

renderLangButtons();
resetIdleTimer();
</script>
