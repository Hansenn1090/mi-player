<!DOCTYPE html>
<html class="h-full bg-black select-none" lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, user-scalable=no" name="viewport"/>
<title>UnLim Play</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest/dist/hls.min.js"></script>
<style>
  html,body{margin:0;padding:0;background:#000;color:#fff;font-family:system-ui,sans-serif;touch-action:manipulation;overflow:hidden;height:100%}
  #video-stage{position:absolute;inset:0;background:#000;display:flex;align-items:center;justify-content:center}
  #video-stage iframe.ulp-iframe{position:absolute;inset:0;width:100%;height:100%;border:0;z-index:10;pointer-events:auto;background:#000}
  #video-stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
  #playerContainer{position:fixed;inset:0}
  .hud-hidden{opacity:0!important;pointer-events:none!important;transform:translateY(12px)}
  #osd-hud{position:absolute;left:0;right:0;bottom:0;z-index:30;padding:20px 16px 12px;background:linear-gradient(to top,rgba(0,0,0,.95),rgba(0,0,0,.7) 60%,transparent);pointer-events:none;transition:opacity .35s,transform .35s}
  #osd-hud > *{pointer-events:auto}
  .tv-btn{background:rgba(43,50,63,.85);color:#d1d5db;border:1px solid rgba(255,255,255,.12);padding:7px 11px;border-radius:8px;font-size:12.5px;font-weight:500;cursor:pointer;transition:all .15s;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
  .tv-btn:hover{background:rgba(60,70,88,.95);color:#fff}
  .tv-btn.active{background:rgba(72,85,107,.95);color:#fff;border-color:#00d2ff;box-shadow:0 0 12px rgba(0,210,255,.3)}
  .fmt-badge{font-size:9px;font-weight:800;letter-spacing:.06em;padding:2px 6px;border-radius:4px;line-height:1}
  .fmt-hls{background:rgba(34,197,94,.25);color:#86efac;border:1px solid rgba(34,197,94,.5)}
  .fmt-mp4{background:rgba(59,130,246,.25);color:#93c5fd;border:1px solid rgba(59,130,246,.5)}
  .fmt-iframe{background:rgba(148,163,184,.25);color:#cbd5e1;border:1px solid rgba(148,163,184,.4)}
  #mode-chip{position:fixed;top:14px;left:14px;z-index:40;padding:5px 10px;border-radius:999px;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.15);color:#fff;pointer-events:none}
  #mode-chip.hls{background:rgba(34,197,94,.25);border-color:rgba(34,197,94,.5);color:#bbf7d0}
  #mode-chip.mp4{background:rgba(59,130,246,.25);border-color:rgba(59,130,246,.5);color:#bfdbfe}
  #mode-chip.iframe{background:rgba(148,163,184,.25);border-color:rgba(148,163,184,.5);color:#e2e8f0}
  #mode-chip.hidden{opacity:0}
  #toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-30px);z-index:60;padding:10px 18px;border-radius:10px;background:rgba(10,11,18,.95);border:1px solid rgba(96,165,250,.4);color:#93c5fd;font-size:13px;font-weight:500;backdrop-filter:blur(12px);opacity:0;transition:all .3s;pointer-events:none;max-width:90vw;text-align:center}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  #loading{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:25;display:none;align-items:center;gap:10px;padding:12px 20px;border-radius:14px;background:rgba(0,0,0,.85);border:1px solid rgba(96,165,250,.4);color:#93c5fd;font-size:13px;backdrop-filter:blur(12px)}
  #loading.on{display:flex}
  #loading .sp{width:16px;height:16px;border:2px solid rgba(96,165,250,.2);border-top-color:#60a5fa;border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  input[type=range]{-webkit-appearance:none;width:100%;background:transparent;cursor:pointer;height:20px}
  input[type=range]::-webkit-slider-runnable-track{height:4px;background:rgba(255,255,255,.15);border-radius:9999px}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;background:#00d2ff;border-radius:50%;margin-top:-5px;border:2px solid #fff;box-shadow:0 0 8px rgba(0,210,255,.8)}
  #video-title{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:40;font-size:13px;font-weight:600;color:#fff;background:rgba(0,0,0,.6);padding:6px 14px;border-radius:8px;backdrop-filter:blur(10px);pointer-events:none;max-width:70vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:none}
</style>
</head>
<body>

<div id="playerContainer">
  <div id="video-stage"></div>
  <div id="mode-chip" class="hidden">—</div>
  <div id="video-title"></div>
  <div id="loading"><div class="sp"></div><span id="loading-text">Cargando…</span></div>
  <div id="toast"></div>

  <div id="osd-hud">
    <div id="options-panel" style="max-height:0;overflow:hidden;transition:max-height .35s ease,padding .35s ease;background:rgba(10,11,18,.96);border-radius:14px;padding:0 16px;margin-bottom:10px">
      <div style="margin-bottom:12px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <span style="font-size:10px;font-weight:700;color:rgba(255,255,255,.5);letter-spacing:.08em;text-transform:uppercase">Servidores</span>
          <span id="srv-status-badge" style="font-size:10px;color:#60a5fa;font-family:monospace">—</span>
        </div>
        <div id="server-buttons" style="display:flex;flex-wrap:wrap;gap:6px"></div>
      </div>
      <div style="margin-bottom:12px">
        <div style="font-size:10px;font-weight:700;color:rgba(255,255,255,.5);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px">Idioma</div>
        <div id="lang-buttons" style="display:flex;gap:4px;flex-wrap:wrap"></div>
      </div>
    </div>

    <div style="display:flex;align-items:center;gap:10px">
      <button id="btn-toggle-panel" style="background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff;width:38px;height:38px;border-radius:8px;cursor:pointer;font-size:18px;flex-shrink:0">☰</button>
      <span id="time-current" style="font-size:12px;font-family:monospace;color:#fff;min-width:50px;text-align:right">00:00</span>
      <div style="flex:1"><input type="range" id="seek-slider" min="0" max="100" value="0" step="0.1"></div>
      <span id="time-duration" style="font-size:12px;font-family:monospace;color:#ccc;min-width:50px">00:00</span>
      <button id="btn-play" style="background:rgba(96,165,250,.15);border:1px solid rgba(96,165,250,.4);color:#93c5fd;width:38px;height:38px;border-radius:8px;cursor:pointer;font-size:14px">▶</button>
      <button id="btn-rewind" style="background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff;width:38px;height:38px;border-radius:8px;cursor:pointer;font-size:14px">⏪</button>
      <button id="btn-forward" style="background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff;width:38px;height:38px;border-radius:8px;cursor:pointer;font-size:14px">⏩</button>
    </div>
  </div>
</div>

<script>
const state = {
  isPlaying: false, currentTime: 0, duration: 0,
  isSeeking: false, isPanelOpen: false,
  currentLang: null, currentSrv: null, currentKind: null,
};
let embeds = {};
let _extracted = {};
let _currentFrame = null, _currentVideoEl = null, _currentHls = null;

const $ = id => document.getElementById(id);
const els = {
  stage: $('video-stage'), modeChip: $('mode-chip'), videoTitle: $('video-title'),
  loading: $('loading'), loadingText: $('loading-text'), toast: $('toast'),
  hud: $('osd-hud'), optionsPanel: $('options-panel'), btnTogglePanel: $('btn-toggle-panel'),
  serverButtons: $('server-buttons'), srvStatusBadge: $('srv-status-badge'),
  langButtons: $('lang-buttons'),
  timeCurrent: $('time-current'), timeDuration: $('time-duration'),
  seekSlider: $('seek-slider'), btnPlay: $('btn-play'),
  btnRewind: $('btn-rewind'), btnForward: $('btn-forward'),
};

const LANG_ORDER = ['latino','español','subtitulado'];
const LANG_META = {
  'latino':      { label:'LATINO', flag:'mx' },
  'español':     { label:'ESPAÑOL', flag:'es' },
  'subtitulado': { label:'SUBTITULADO', flag:'us' },
};
const PROVIDER_DISPLAY = {
  vimeos:'Vimeos', voe:'VOE', streamwish:'StreamWish', vidhide:'VidHide',
  filelions:'FileLions', filemoon:'FileMoon', doodstream:'DoodStream',
  fembed:'Fembed', streamtape:'StreamTape', mixdrop:'MixDrop', okru:'OkRu',
  uqload:'Uqload', vidspeed:'VidSpeed', vidmoly:'Vidmoly',
  mp4upload:'Mp4Upload', netu:'Netu', fastream:'Fastream',
};

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function cap(s){ return s ? s.charAt(0).toUpperCase()+s.slice(1) : s; }
function normKey(n){
  let b = (n||'').toLowerCase().replace(/[\s_-]+\d+$/,'');
  if (['hglink','flaswish','wishfast','awish'].includes(b)) return 'streamwish';
  if (['filelions','minochinos','vihide','vidhidepro','callistanise','hgcloud','earnvids','masukesting','morencius'].includes(b)) return 'vidhide';
  if (['dood','doodcx','doodpm','doodto','doodla','d0000d'].includes(b)) return 'doodstream';
  return b;
}
function trueBase(n){
  let b=n||'',p;
  do{p=b;b=b.replace(/[\s_-]+\d+$/,'').replace(/(?<=[a-zA-Z]{3})\d+$/,'');}while(b!==p);
  return b;
}
const HLS_RE = [/\.m3u8(\?|$)/i, /master\.txt(\?|$)/i, /\/stream(\?|\.m3u8\?|\.php\?)url=/i, /hls_proxy1\.php/i];
const MP4_RE = [/\.mp4(\?|$)/i, /\.webm(\?|$)/i, /\.mov(\?|$)/i];
function detectByUrl(url){
  if (!url) return null;
  for (const re of HLS_RE) if (re.test(url)) return 'hls';
  for (const re of MP4_RE) if (re.test(url)) return 'mp4';
  return null;
}

function showToast(m, d){
  d = d || 3000;
  els.toast.textContent = m;
  els.toast.classList.add('on');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => els.toast.classList.remove('on'), d);
}
function showLoading(t){ els.loadingText.textContent = t || 'Cargando…'; els.loading.classList.add('on'); }
function hideLoading(){ els.loading.classList.remove('on'); }
function fmt(s){
  if (!isFinite(s) || s<0) s=0;
  const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),x=Math.floor(s%60);
  const p=n=>String(n).padStart(2,'0');
  return h>0?`${p(h)}:${p(m)}:${p(x)}`:`${p(m)}:${p(x)}`;
}
function setModeChip(k){
  if (!k){ els.modeChip.classList.add('hidden'); return; }
  els.modeChip.className = k;
  els.modeChip.classList.remove('hidden');
  els.modeChip.textContent = k==='hls' ? '● HLS NATIVO • CONTROL TOTAL'
                          : k==='mp4' ? '● MP4 NATIVO • CONTROL TOTAL'
                          : '● IFRAME EXTERNO • CONTROLES DEL EMBED';
}

async function extractFromBackend(embedUrl){
  try {
    const r = await fetch('/api/extract?url=' + encodeURIComponent(embedUrl));
    if (!r.ok) return null;
    const data = await r.json();
    if (data.error || !data.stream) return null;
    return { stream: data.stream, kind: data.kind || 'hls', referer: data.referer };
  } catch(e){ return null; }
}

async function extractAllServers(srvs){
  const entries = Object.entries(srvs);
  const extracted = {};
  for (let i = 0; i < entries.length; i++){
    const name = entries[i][0];
    const url = entries[i][1];
    const byUrl = detectByUrl(url);
    if (byUrl){
      extracted[name] = { url, stream: url, kind: byUrl, referer: url };
      continue;
    }
    showLoading('Extrayendo ' + (i+1) + '/' + entries.length + ': ' + cap(name) + '…');
    const res = await extractFromBackend(url);
    if (res){
      extracted[name] = { url, stream: res.stream, kind: res.kind, referer: res.referer };
    } else {
      extracted[name] = { url, stream: null, kind: 'iframe', referer: url };
    }
  }
  hideLoading();
  _extracted = extracted;
}

function teardown(){
  if (_currentHls){ try{ _currentHls.destroy(); }catch(_){} _currentHls = null; }
  if (_currentFrame){ try{ _currentFrame.remove(); }catch(_){} _currentFrame = null; }
  _currentVideoEl = null;
}
function attachVideo(vid){
  vid.addEventListener('loadedmetadata', () => { state.duration = vid.duration || 0; updateScrubber(); hideLoading(); });
  vid.addEventListener('timeupdate', () => { state.currentTime = vid.currentTime || 0; if (!state.isSeeking) updateScrubber(); });
  vid.addEventListener('play',  () => { state.isPlaying=true;  els.btnPlay.textContent='❚❚'; });
  vid.addEventListener('pause', () => { state.isPlaying=false; els.btnPlay.textContent='▶'; });
}
function mountHls(url){
  state.currentKind = 'hls';
  const wrap = document.createElement('div');
  wrap.style.cssText = 'position:absolute;inset:0;background:#000';
  const vid = document.createElement('video');
  vid.playsInline = true; vid.preload = 'metadata'; vid.controls = false;
  wrap.appendChild(vid);
  els.stage.appendChild(wrap);
  _currentFrame = wrap; _currentVideoEl = vid;
  attachVideo(vid);
  if (typeof Hls !== 'undefined' && Hls.isSupported()){
    const hls = new Hls({ maxBufferLength:30, startLevel:-1, enableWorker:true });
    _currentHls = hls;
    hls.loadSource(url); hls.attachMedia(vid);
    hls.on(Hls.Events.MANIFEST_PARSED, () => { hideLoading(); vid.play().catch(()=>{}); });
    hls.on(Hls.Events.ERROR, (_, d) => { if (d.fatal) showToast('Error HLS'); });
  } else if (vid.canPlayType('application/vnd.apple.mpegurl')){
    vid.src = url; vid.load();
    vid.addEventListener('canplay', () => { hideLoading(); vid.play().catch(()=>{}); }, { once:true });
  }
}
function mountMp4(url){
  state.currentKind = 'mp4';
  const wrap = document.createElement('div');
  wrap.style.cssText = 'position:absolute;inset:0;background:#000';
  const vid = document.createElement('video');
  vid.playsInline = true; vid.preload = 'metadata'; vid.controls = false;
  wrap.appendChild(vid);
  els.stage.appendChild(wrap);
  _currentFrame = wrap; _currentVideoEl = vid;
  attachVideo(vid);
  vid.src = url; vid.load();
  vid.addEventListener('canplay', () => { hideLoading(); vid.play().catch(()=>{}); }, { once:true });
}
function mountIframe(url){
  state.currentKind = 'iframe';
  const iframe = document.createElement('iframe');
  iframe.className = 'ulp-iframe';
  iframe.allow = 'autoplay *; fullscreen *; encrypted-media *; picture-in-picture *; web-share *';
  iframe.allowFullscreen = true;
  iframe.setAttribute('allowfullscreen','');
  iframe.setAttribute('referrerpolicy','no-referrer');
  iframe.setAttribute('scrolling','no');
  iframe.src = url;
  iframe.addEventListener('load', () => hideLoading());
  els.stage.appendChild(iframe);
  _currentFrame = iframe;
  _currentVideoEl = null;
  state.duration = 0; state.currentTime = 0;
  updateScrubber();
  els.hud.classList.add('hud-hidden');
}

function loadServer(name){
  const srv = _extracted[name];
  if (!srv) return;
  state.currentSrv = name;
  els.serverButtons.querySelectorAll('button').forEach(b => {
    b.classList.toggle('active', b.dataset.srv === name);
  });
  const disp = PROVIDER_DISPLAY[normKey(trueBase(name))] || cap(name);
  const label = srv.kind === 'hls' ? 'HLS' : srv.kind === 'mp4' ? 'MP4' : 'iframe';
  showLoading('Cargando ' + disp + ' (' + label + ')…');
  setModeChip(srv.kind);
  teardown();
  if (srv.stream && srv.kind === 'hls') mountHls(srv.stream);
  else if (srv.stream && srv.kind === 'mp4') mountMp4(srv.stream);
  else mountIframe(srv.url);
}
function autoLoadBest(){
  const names = Object.keys(_extracted);
  if (!names.length) return;
  const prio = { hls:0, mp4:1, iframe:2 };
  names.sort((a,b) => (prio[_extracted[a].kind]||3) - (prio[_extracted[b].kind]||3));
  loadServer(names[0]);
}
function renderServerButtons(){
  els.serverButtons.innerHTML = '';
  const names = Object.keys(_extracted);
  if (!names.length){
    els.serverButtons.innerHTML = '<span style="font-size:12px;color:rgba(255,255,255,.4);font-style:italic">Sin servidores</span>';
    return;
  }
  const prio = { hls:0, mp4:1, iframe:2 };
  names.sort((a,b) => (prio[_extracted[a].kind]||3) - (prio[_extracted[b].kind]||3));
  names.forEach(name => {
    const kind = _extracted[name].kind;
    const disp = PROVIDER_DISPLAY[normKey(trueBase(name))] || cap(name);
    const btn = document.createElement('button');
    btn.className = 'tv-btn';
    btn.dataset.srv = name;
    btn.innerHTML = esc(disp) + ' <span class="fmt-badge fmt-' + kind + '">' + kind.toUpperCase() + '</span>';
    btn.onclick = () => loadServer(name);
    els.serverButtons.appendChild(btn);
  });
  const clean = names.filter(n => _extracted[n].kind !== 'iframe').length;
  els.srvStatusBadge.textContent = '✓ ' + clean + ' nativos + ' + (names.length - clean) + ' iframe';
}
function renderLangButtons(){
  els.langButtons.innerHTML = '';
  LANG_ORDER.forEach(lang => {
    if (!embeds[lang]) return;
    const m = LANG_META[lang];
    const btn = document.createElement('button');
    btn.className = 'tv-btn' + (lang === state.currentLang ? ' active' : '');
    btn.innerHTML = '<img src="https://flagcdn.com/w20/' + m.flag + '.png" width="14" style="vertical-align:middle;margin-right:4px">' + m.label;
    btn.onclick = () => switchLang(lang);
    els.langButtons.appendChild(btn);
  });
}
async function switchLang(lang){
  if (lang === state.currentLang) return;
  state.currentLang = lang;
  renderLangButtons();
  const srvs = embeds[lang] || {};
  await extractAllServers(srvs);
  renderServerButtons();
  autoLoadBest();
  showToast('Idioma: ' + LANG_META[lang].label);
}

function updateScrubber(){
  if (state.duration <= 0){
    els.seekSlider.value = 0;
    els.timeCurrent.textContent = fmt(state.currentTime);
    els.timeDuration.textContent = state.currentKind === 'iframe' ? '—' : '00:00';
    return;
  }
  const pct = Math.min(Math.max((state.currentTime/state.duration)*100, 0), 100);
  if (!state.isSeeking) els.seekSlider.value = pct;
  els.timeCurrent.textContent = fmt(state.currentTime);
  els.timeDuration.textContent = fmt(state.duration);
}
function togglePlay(){
  if (state.currentKind === 'iframe'){ showToast('Usá los controles del iframe'); return; }
  if (_currentVideoEl){
    if (_currentVideoEl.paused) _currentVideoEl.play().catch(()=>{});
    else _currentVideoEl.pause();
  }
}
function rewind10(){
  if (_currentVideoEl) _currentVideoEl.currentTime = Math.max(0, _currentVideoEl.currentTime - 10);
  else showToast('Solo en HLS/MP4');
}
function forward10(){
  if (_currentVideoEl) _currentVideoEl.currentTime = Math.min(_currentVideoEl.duration||Infinity, _currentVideoEl.currentTime + 10);
  else showToast('Solo en HLS/MP4');
}

els.btnPlay.onclick = togglePlay;
els.btnRewind.onclick = rewind10;
els.btnForward.onclick = forward10;
els.btnTogglePanel.onclick = () => {
  state.isPanelOpen = !state.isPanelOpen;
  els.optionsPanel.style.maxHeight = state.isPanelOpen ? '600px' : '0';
  els.optionsPanel.style.padding = state.isPanelOpen ? '14px 16px' : '0 16px';
};
els.seekSlider.addEventListener('input', e => {
  if (state.currentKind === 'iframe') return;
  const pct = parseFloat(e.target.value);
  state.currentTime = (pct/100) * state.duration;
  els.timeCurrent.textContent = fmt(state.currentTime);
});
els.seekSlider.addEventListener('change', e => {
  if (state.currentKind === 'iframe') return;
  state.isSeeking = false;
  const sec = (parseFloat(e.target.value)/100) * state.duration;
  if (_currentVideoEl) _currentVideoEl.currentTime = sec;
  state.currentTime = sec;
});
els.seekSlider.addEventListener('pointerdown', () => state.isSeeking = true);
els.seekSlider.addEventListener('pointerup', () => state.isSeeking = false);

function getQueryParam(name){
  return new URLSearchParams(location.search).get(name);
}
async function init(){
  const id = getQueryParam('id') || '293660';
  const type = getQueryParam('type') || 'movie';
  showLoading('Buscando servidores…');
  try {
    const r = await fetch('/api/servers?id=' + encodeURIComponent(id) + '&type=' + encodeURIComponent(type));
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    if (!data.servers || !Object.keys(data.servers).length){
      showToast('Sin servidores disponibles');
      hideLoading();
      return;
    }
    if (data.meta && data.meta.title){
      document.title = data.meta.title + ' — UnLim Play';
      els.videoTitle.style.display = 'block';
      els.videoTitle.textContent = data.meta.title + (data.meta.year ? ' (' + data.meta.year + ')' : '');
    }
    embeds = data.servers;
    state.currentLang = LANG_ORDER.find(l => embeds[l]) || Object.keys(embeds)[0];
    renderLangButtons();
    hideLoading();
    const srvs = embeds[state.currentLang] || {};
    await extractAllServers(srvs);
    renderServerButtons();
    autoLoadBest();
  } catch(e){
    console.error('[Init]', e);
    showToast('Error: ' + e.message);
    hideLoading();
  }
}
init();
</script>

</body>
</html>
