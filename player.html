<!DOCTYPE html>
<html class="h-full bg-black select-none" lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Smart TV Video Player</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
  tailwind.config = {
    theme: { extend: {
      colors: { brand: { cyan: '#00d2ff', blue: '#2563eb', dark: '#0a0a0c', track: '#383a42', card: 'rgba(20, 22, 28, 0.85)' } },
      fontFamily: { sans: ['Inter', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'sans-serif'] }
    }}
  }
</script>

<!-- ═══════════════════════════════════════════════════════════════════════ -->
<!-- CONFIGURACIÓN — CAMBIA SOLO backendUrl -->
<!-- ═══════════════════════════════════════════════════════════════════════ -->
<script>
window.APP_CONFIG = {
  // ⚠️ CAMBIA ESTO: URL de tu servicio en Render
  backendUrl: 'https://mi-jugador.onrender.com',

  // Endpoint del backend (definido en servidor.js)
  serversPath: '/api/servidores',
  healthPath:  '/api/health',

  // Archivo SW (mismo directorio que este HTML)
  swFile: 'sw-adblock.js',
  enableSW: true,

  // Película por defecto
  defaultMovieId: '550',       // Fight Club como ejemplo
  defaultType:    'pelicula',  // 'pelicula' | 'televisor'

  // Cold start de Render Free (30-60s al despertar)
  coldStartTimeout: 90000,     // 90s
  normalTimeout:    30000,     // 30s
};
</script>

<!-- SW con scope relativo (funciona en GitHub Pages subcarpetas) -->
<script>
if (window.APP_CONFIG.enableSW && 'serviceWorker' in navigator) {
  navigator.serviceWorker.register(window.APP_CONFIG.swFile, { scope: './' })
    .then(reg => console.log('[SW] scope:', reg.scope))
    .catch(err => console.warn('[SW] error:', err.message));
}
</script>

<style data-purpose="scrubber-range-styling">
  input[type=range] { -webkit-appearance: none; appearance: none; background: transparent; cursor: pointer; }
  input[type=range]:focus { outline: none; }
  input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 9999px; background: transparent; }
  input[type=range]::-moz-range-track { height: 4px; border-radius: 9999px; background: transparent; }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    height: 14px; width: 14px; border-radius: 50%;
    background: #00d2ff; margin-top: -5px;
    box-shadow: 0 0 10px rgba(0, 210, 255, 0.85);
    border: 2px solid #ffffff;
  }
  input[type=range]::-moz-range-thumb {
    height: 14px; width: 14px; border-radius: 50%;
    background: #00d2ff; border: 2px solid #ffffff;
  }
  input[type=range]:hover::-webkit-slider-thumb { transform: scale(1.3); }
</style>

<style data-purpose="animations-and-helpers">
  .hud-transition { transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
  .hud-hidden { opacity: 0 !important; pointer-events: none !important; transform: translateY(12px); }
  .key-badge {
    background: rgba(255, 255, 255, 0.9); color: #000;
    font-size: 10px; font-weight: 800; letter-spacing: 0.05em;
    border-radius: 2px; padding: 1px 4px;
    display: inline-flex; align-items: center; justify-content: center; line-height: 1.2;
  }
  .aspect-mode-16-9 { width: 100% !important; height: 100% !important; object-fit: contain; }
  .aspect-mode-stretch { width: 100% !important; height: 100% !important; transform: scale(1.05); }
  .aspect-mode-zoom { width: 100% !important; height: 100% !important; transform: scale(1.33); }
  .aspect-mode-4-3 { width: 75% !important; height: 100% !important; margin: 0 auto; }
  .tv-btn-normal { background: rgba(43, 50, 63, 0.78); backdrop-filter: blur(8px); color: #d1d5db; transition: all 0.2s ease; }
  .tv-btn-normal:hover { background: rgba(60, 70, 88, 0.9); color: #ffffff; }
  .tv-btn-active {
    background: rgba(72, 85, 107, 0.95) !important; backdrop-filter: blur(8px);
    color: #ffffff !important; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
    border-color: #00d2ff !important;
  }
  .options-drawer-panel {
    transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1), transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), max-height 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .options-drawer-collapsed { opacity: 0; pointer-events: none; transform: translateY(18px) scale(0.98); max-height: 0; padding: 0 !important; overflow: hidden; }
  .options-drawer-expanded { opacity: 1; pointer-events: auto; transform: translateY(0) scale(1); max-height: 600px; }
  .custom-scrollbar::-webkit-scrollbar { width: 4px; }
  .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(0, 210, 255, 0.4); border-radius: 4px; }

  .server-badge { display: inline-flex; align-items: center; gap: 3px; padding: 1px 5px; border-radius: 4px; font-size: 9px; font-weight: 800; letter-spacing: .5px; line-height: 15px; flex-shrink: 0; }
  .server-badge.hls    { background: rgba(34,197,94,.18);  border: 1px solid rgba(34,197,94,.35);  color: #4ade80; }
  .server-badge.iframe { background: rgba(148,163,184,.12); border: 1px solid rgba(148,163,184,.25); color: #94a3b8; }
  .server-badge.error  { background: rgba(239,68,68,.15);  border: 1px solid rgba(239,68,68,.35);  color: #f87171; }
  .server-btn { display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 8px; background: rgba(43,50,63,0.78); backdrop-filter: blur(8px); color: #d1d5db; border: 1px solid rgba(255,255,255,.1); font-size: 11px; font-weight: 600; cursor: pointer; transition: all .2s ease; white-space: nowrap; }
  .server-btn:hover { background: rgba(60,70,88,0.9); color: #fff; }
  .server-btn.active { background: rgba(72,85,107,.95) !important; color: #fff !important; border-color: #00d2ff !important; box-shadow: 0 2px 12px rgba(0,210,255,.35); }
  .server-btn .srv-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.2); flex-shrink: 0; }
  .server-btn.ok .srv-dot { background: #22c55e; box-shadow: 0 0 6px rgba(34,197,94,.6); }
  .server-btn.iframe .srv-dot { background: #94a3b8; }

  #native-video-layer { position: absolute; inset: 0; z-index: 11; background: #000; display: none; }
  #native-video-layer.active { display: block; }
  #native-video-layer video { width: 100%; height: 100%; object-fit: contain; background: #000; }
  #native-video-layer video::-webkit-media-controls { display: none !important; }
  #iframe-host { position: absolute; inset: 0; z-index: 10; }
  #iframe-host > iframe { width: 100% !important; height: 100% !important; border: 0; display: block; }

  #uncontrollable-notice {
    position: absolute; top: 76px; left: 50%; transform: translateX(-50%);
    z-index: 40; pointer-events: none;
    display: none; align-items: center; gap: 8px;
    padding: 8px 14px; border-radius: 24px;
    background: rgba(10,11,18,.92); backdrop-filter: blur(14px);
    border: 1px solid rgba(251,191,36,.4);
    color: #fbbf24; font-size: 11px; font-weight: 600;
    box-shadow: 0 4px 18px rgba(0,0,0,.5);
  }
  #uncontrollable-notice.show { display: flex; }

  #adblock-badge {
    position: absolute; top: 6px; right: 8px; z-index: 40; pointer-events: none;
    display: flex; align-items: center; gap: 5px;
    padding: 3px 8px; border-radius: 20px;
    background: rgba(34,197,94,.15); border: 1px solid rgba(34,197,94,.35);
    color: #4ade80; font-size: 9px; font-weight: 800; letter-spacing: .4px;
    text-transform: uppercase;
  }
  #backend-badge {
    position: absolute; top: 6px; left: 8px; z-index: 40; pointer-events: none;
    display: flex; align-items: center; gap: 5px;
    padding: 3px 8px; border-radius: 20px;
    background: rgba(148,163,184,.15); border: 1px solid rgba(148,163,184,.35);
    color: #94a3b8; font-size: 9px; font-weight: 800; letter-spacing: .4px;
    text-transform: uppercase; transition: all .3s;
  }
  #backend-badge .dot { width: 5px; height: 5px; border-radius: 50%; background: #94a3b8; }
  #backend-badge.online { background: rgba(34,197,94,.15); border-color: rgba(34,197,94,.35); color: #4ade80; }
  #backend-badge.online .dot { background: #4ade80; box-shadow: 0 0 6px rgba(74,222,128,.9); }
  #backend-badge.cold   { background: rgba(251,191,36,.15); border-color: rgba(251,191,36,.35); color: #fbbf24; }
  #backend-badge.cold .dot { background: #fbbf24; animation: cold-pulse 1s infinite; }
  #backend-badge.error  { background: rgba(239,68,68,.15); border-color: rgba(239,68,68,.35); color: #f87171; }
  #backend-badge.error .dot { background: #f87171; }
  @keyframes cold-pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
</style>
</head>

<body class="h-full w-full overflow-hidden bg-black text-white font-sans antialiased relative">
<main class="relative w-full h-full bg-black overflow-hidden flex items-center justify-center" id="playerContainer">

<!-- Badge AdBlock -->
<div id="adblock-badge" title="Bloqueador activo">
  <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
  <span>AdBlock ON</span>
</div>

<!-- Badge Backend -->
<div id="backend-badge" title="Estado del backend Render">
  <span class="dot"></span>
  <span id="backend-text">Conectando…</span>
</div>

<!-- Aviso iframe no controlable -->
<div id="uncontrollable-notice">
  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
  <span>Este servidor no acepta controles externos. Usa los botones dentro del reproductor.</span>
</div>

<!-- Video wrapper -->
<div class="w-full h-full flex items-center justify-center transition-all duration-300 absolute inset-0 z-10 opacity-100" id="video-wrapper">
  <div id="iframe-host"></div>
  <div id="native-video-layer">
    <video id="native-video" playsinline preload="auto"></video>
  </div>
</div>

<!-- Loading -->
<div class="absolute z-20 pointer-events-none opacity-0 transition-opacity duration-300 flex items-center space-x-3 px-5 py-3 rounded-2xl bg-black/80 backdrop-blur-md border border-cyan-500/40 text-cyan-300 shadow-2xl" id="loading-indicator">
  <svg class="animate-spin h-5 w-5" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>
  <span class="text-sm font-medium" id="loading-text">Cargando…</span>
</div>

<!-- Backdrop -->
<div class="absolute inset-0 z-20 overflow-hidden transition-opacity duration-700 pointer-events-none" id="poster-backdrop-container">
  <img alt="Backdrop" class="w-full h-full object-cover object-center filter brightness-[0.9]" id="poster-backdrop-img" src=""/>
  <div class="absolute inset-0 bg-gradient-to-t from-black/85 via-black/20 to-black/35"></div>
</div>

<!-- Botón Play central -->
<div class="absolute inset-0 z-30 flex items-center justify-center pointer-events-none transition-all duration-500" id="center-play-wrapper">
  <div class="relative flex items-center justify-center">
    <div class="absolute w-24 h-24 sm:w-28 sm:h-28 rounded-full bg-blue-500/40 backdrop-blur-sm -translate-x-2 -translate-y-1 scale-105 pointer-events-none"></div>
    <button aria-label="Play" class="relative z-10 w-20 h-20 sm:w-24 sm:h-24 rounded-full bg-blue-600 hover:bg-blue-500 active:scale-95 shadow-[0_0_35px_rgba(37,99,235,0.75)] flex items-center justify-center pointer-events-auto transition-transform duration-200 group focus:outline-none" id="btn-center-play">
      <svg class="w-10 h-10 sm:w-11 sm:h-11 text-white fill-current ml-1 group-hover:scale-110 transition-transform" viewBox="0 0 24 24"><polygon points="6,4 20,12 6,20"></polygon></svg>
    </button>
  </div>
</div>

<!-- Network Badge -->
<aside class="absolute top-6 right-8 z-30 pointer-events-none flex items-center space-x-2">
  <span class="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
  <span class="text-white/90 text-sm font-semibold" id="bitrate-indicator">—</span>
</aside>

<!-- Toast -->
<div class="fixed top-6 left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 -translate-y-3 transition-all duration-300 flex items-center space-x-2.5 px-4 py-2 rounded-xl bg-zinc-900/90 border border-brand-cyan/40 text-brand-cyan shadow-xl backdrop-blur-md" id="toast-notify">
  <span class="w-2 h-2 rounded-full bg-brand-cyan animate-ping"></span>
  <span class="text-xs sm:text-sm font-medium text-white" id="toast-text"></span>
</div>

<!-- Action Flash -->
<div class="absolute z-30 pointer-events-none opacity-0 scale-75 transition-all duration-300 flex items-center justify-center p-6 rounded-full bg-black/60 backdrop-blur-md border border-white/10 text-white shadow-2xl" id="action-flash">
  <svg class="w-12 h-12" fill="currentColor" id="action-flash-icon" viewBox="0 0 24 24"></svg>
</div>

<!-- HUD / Drawer -->
<div class="absolute inset-x-0 bottom-0 z-30 hud-transition pb-2 pt-28 bg-gradient-to-t from-black via-black/85 to-transparent pointer-events-none flex flex-col justify-end hud-hidden" id="osd-hud">
  <div class="w-full max-w-[1920px] mx-auto px-6 md:px-12 lg:px-14 pb-2 pointer-events-auto space-y-3">

    <!-- Panel de opciones -->
    <div class="options-drawer-panel options-drawer-collapsed bg-zinc-950/90 backdrop-blur-xl border border-white/15 rounded-2xl p-4 sm:p-5 shadow-[0_20px_50px_rgba(0,0,0,0.85)] flex flex-col gap-3.5 mb-2 max-h-[540px] overflow-y-auto custom-scrollbar" id="options-panel-container">

      <!-- Fila 1: IDIOMA + SUBTÍTULOS -->
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 pb-3 border-b border-white/10">
        <div class="space-y-1.5" id="group-audio-options">
          <div class="flex items-center justify-between">
            <span class="block text-[11px] sm:text-xs font-semibold text-neutral-400 tracking-wider uppercase">IDIOMA</span>
            <span class="text-[10px] text-brand-cyan/90 font-mono" id="badge-active-audio">—</span>
          </div>
          <div class="inline-flex rounded overflow-hidden shadow-lg border border-white/10 divide-x divide-white/10 w-full" id="audio-buttons-row" role="group"></div>
        </div>
        <div class="space-y-1.5" id="group-subtitle-options">
          <div class="flex items-center justify-between">
            <span class="block text-[11px] sm:text-xs font-semibold text-neutral-400 tracking-wider uppercase">SUBTÍTULOS</span>
            <span class="text-[10px] text-neutral-400 font-mono" id="badge-active-subtitle">DESACTIVADOS</span>
          </div>
          <div class="inline-flex rounded overflow-hidden shadow-lg border border-white/10 divide-x divide-white/10 w-full" role="group">
            <button class="tv-btn-normal tv-btn-active px-3 py-2 text-xs sm:text-sm font-medium flex-1 flex items-center justify-center space-x-1.5" data-sub="off" type="button">
              <svg class="w-3.5 h-3.5 fill-current text-white check-icon" viewBox="0 0 20 20"><path d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"></path></svg>
              <span>Off</span>
            </button>
            <button class="tv-btn-normal px-3 py-2 text-xs sm:text-sm font-medium flex-1 flex items-center justify-center space-x-1.5" data-sub="es" type="button">
              <svg class="w-3.5 h-3.5 fill-current text-white check-icon hidden" viewBox="0 0 20 20"><path d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"></path></svg>
              <span>Español</span>
            </button>
            <button class="tv-btn-normal px-3 py-2 text-xs sm:text-sm font-medium flex-1 flex items-center justify-center space-x-1.5" data-sub="en" type="button">
              <svg class="w-3.5 h-3.5 fill-current text-white check-icon hidden" viewBox="0 0 20 20"><path d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"></path></svg>
              <span>Inglés</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Fila 2: PANTALLA + CALIDAD -->
      <div class="flex flex-wrap items-end justify-between gap-x-6 gap-y-3">
        <div class="space-y-1.5" id="group-formato-pantalla">
          <span class="block text-[11px] sm:text-xs font-semibold text-neutral-400 tracking-wider uppercase">PANTALLA</span>
          <div class="inline-flex rounded overflow-hidden shadow-lg border border-white/10 divide-x divide-white/10" role="group">
            <button class="tv-btn-normal tv-btn-active px-3.5 py-2 text-xs sm:text-sm font-medium" data-aspect="normal" type="button">Normal</button>
            <button class="tv-btn-normal px-3.5 py-2 text-xs sm:text-sm font-medium" data-aspect="stretch" type="button">Llena</button>
            <button class="tv-btn-normal px-3.5 py-2 text-xs sm:text-sm font-medium" data-aspect="16-9" type="button">16:9</button>
            <button class="tv-btn-normal px-3.5 py-2 text-xs sm:text-sm font-medium" data-aspect="4-3" type="button">4:3</button>
          </div>
        </div>
        <div class="space-y-1.5 flex-1 max-w-xl" id="group-resolucion-bar">
          <div class="flex items-center justify-between">
            <span class="block text-[11px] sm:text-xs font-semibold text-neutral-400 tracking-wider uppercase">CALIDAD</span>
            <span class="text-[10px] text-emerald-400 font-mono" id="quality-info">AUTO</span>
          </div>
          <div class="inline-flex rounded overflow-hidden shadow-lg border border-white/10 divide-x divide-white/10 w-full">
            <button class="tv-btn-normal tv-btn-active px-3 py-2 text-xs sm:text-sm font-medium flex-1" data-res="auto" type="button">Auto</button>
            <button class="tv-btn-normal px-3 py-2 text-xs sm:text-sm font-medium flex-1" data-res="1080" type="button">1080p</button>
            <button class="tv-btn-normal px-3 py-2 text-xs sm:text-sm font-medium flex-1" data-res="720" type="button">720p</button>
            <button class="tv-btn-normal px-3 py-2 text-xs sm:text-sm font-medium flex-1" data-res="480" type="button">480p</button>
          </div>
        </div>
      </div>

      <!-- Fila 3: SERVIDORES + INFO -->
      <div class="flex flex-wrap items-end justify-between gap-x-6 gap-y-3 pt-1">
        <div class="space-y-1.5 flex-1" id="group-reproductor-bar">
          <div class="flex items-center justify-between">
            <span class="block text-[11px] sm:text-xs font-semibold text-neutral-400 tracking-wider uppercase">SERVIDORES DISPONIBLES</span>
            <div class="flex items-center space-x-2">
              <span class="text-[10px] text-brand-cyan/90 font-mono" id="badge-server-status">Cargando lista…</span>
              <button class="text-neutral-400 hover:text-brand-cyan p-1 rounded transition" id="btn-reload-servers" title="Recargar">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/></svg>
              </button>
            </div>
          </div>
          <div class="flex flex-wrap gap-2 rounded-lg p-2 bg-black/40 border border-white/10 w-full" id="dynamic-server-list">
            <div class="flex items-center space-x-2 px-3 py-2 text-xs text-neutral-400">
              <svg class="animate-spin h-3.5 w-3.5 text-brand-cyan" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>
              <span>Consultando backend…</span>
            </div>
          </div>
        </div>
        <div class="space-y-1.5">
          <span class="block text-[11px] sm:text-xs font-semibold text-neutral-400 tracking-wider uppercase">INFO</span>
          <div class="inline-flex rounded overflow-hidden shadow-lg border border-white/10">
            <button class="tv-btn-normal px-4 py-2 text-xs sm:text-sm font-medium flex items-center space-x-2 text-rose-300 hover:text-rose-200" id="btn-bar-feedback" type="button">
              <svg class="w-4 h-4 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
              <span>Reportar</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Scrubber + título -->
    <div class="flex items-center gap-4 sm:gap-5">
      <div class="w-14 h-20 sm:w-16 sm:h-24 rounded-lg overflow-hidden shadow-2xl bg-neutral-900 border border-white/10 flex-shrink-0 relative group cursor-pointer hover:border-brand-cyan transition" id="poster-thumb">
        <img alt="Poster" class="w-full h-full object-cover" id="poster-img" src=""/>
      </div>
      <div class="flex-1 flex flex-col justify-center min-w-0 space-y-2.5">
        <div class="flex items-center space-x-3 sm:space-x-4">
          <span class="text-xs sm:text-sm md:text-base font-medium tracking-tight text-white min-w-[50px] text-right font-mono" id="current-time-text">00:00</span>
          <div class="relative flex-grow flex items-center group py-2">
            <div class="w-full h-1 bg-brand-track rounded-full overflow-hidden relative pointer-events-none">
              <div class="h-full bg-gradient-to-r from-blue-500 to-brand-cyan transition-all duration-75" id="progress-fill" style="width: 0%;"></div>
            </div>

<!-- IFRAME DINÁMICO SIN SANDBOX -->
<!-- ═══════════════════════════════════════════════════════════════════════ -->
<script>
let _iframeEl = null;

function buildIframe(url) {
  const host = document.getElementById('iframe-host');
  if (!host) return null;
  if (_iframeEl && _iframeEl.parentNode) {
    try { _iframeEl.src = 'about:blank'; } catch (_) {}
    _iframeEl.remove();
  }
  host.innerHTML = '';
  const iframe = document.createElement('iframe');
  iframe.id = 'stream-iframe';
  iframe.title = 'Video Stream';
  iframe.setAttribute('allowfullscreen', 'true');
  iframe.setAttribute('webkitallowfullscreen', 'true');
  iframe.setAttribute('mozallowfullscreen', 'true');
  iframe.setAttribute('scrolling', 'no');
  iframe.setAttribute('referrerpolicy', 'no-referrer');
  iframe.setAttribute('allow', 'autoplay; fullscreen; encrypted-media; picture-in-picture; web-share; clipboard-write; screen-wake-lock');
  iframe.src = url || 'about:blank';
  host.appendChild(iframe);
  _iframeEl = iframe;
  return iframe;
}

function setIframeSrc(url) {
  if (!_iframeEl) { buildIframe(url); return; }
  _iframeEl.src = url;
}
window.setIframeSrc = setIframeSrc;
document.addEventListener('DOMContentLoaded', () => buildIframe('about:blank'));
</script>

<!-- CONTROL BRIDGE (multi-protocolo postMessage) -->
<!-- ═══════════════════════════════════════════════════════════════════════ -->
<script>
const CONTROL_BRIDGE = {
  acked: false,
  ackTimer: null,

  send(iframe, command, args = []) {
    if (!iframe || !iframe.contentWindow) return;
    const w = iframe.contentWindow;
    const sec = Number(args[0]) || 0;
    const payloads = [
      { type: 'unlimplay:command', command, args },
      { event: 'command', func: command === 'play' ? 'playVideo' : command === 'pause' ? 'pauseVideo' : command === 'seek' ? 'seekTo' : command, args: [sec, true] },
      { method: command === 'play' ? 'play' : command === 'pause' ? 'pause' : command === 'seek' ? 'setCurrentTime' : command, value: sec },
      { type: 'jwplayer', command, args },
      { type: 'plyr', action: command, value: sec },
      { type: 'videojs', action: command, value: sec },
      { type: 'kaltura', notification: command, value: sec },
      { type: 'brightcove', action: command, value: sec },
      { type: command, action: command, command, value: sec, position: sec, args },
      { action: command, value: sec, position: sec },
      { event: command, value: sec },
      { command, args },
      `{"event":"${command}","position":${sec}}`,
    ];
    payloads.forEach(p => { try { w.postMessage(p, '*'); } catch (_) {} });
  },
  play(iframe)   { this.send(iframe, 'play'); },
  pause(iframe)  { this.send(iframe, 'pause'); },
  seek(iframe,s) { this.send(iframe, 'seek', [Math.floor(s)]); },
  markAcked() {
    this.acked = true;
    if (this.ackTimer) { clearTimeout(this.ackTimer); this.ackTimer = null; }
    const n = document.getElementById('uncontrollable-notice');
    if (n) n.classList.remove('show');
  },
  expectAck(iframe, timeoutMs = 3000) {
    this.acked = false;
    if (this.ackTimer) clearTimeout(this.ackTimer);
    this.ackTimer = setTimeout(() => {
      if (!this.acked) {
        const n = document.getElementById('uncontrollable-notice');
        if (n) { n.classList.add('show'); setTimeout(() => n.classList.remove('show'), 6000); }
      }
    }, timeoutMs);
  }
};
window.CONTROL_BRIDGE = CONTROL_BRIDGE;

// Ack detector
window.addEventListener('message', (event) => {
  const d = event.data;
  if (!d) return;
  const isAck = (typeof d === 'object' && (
    d.type === 'timeupdate' || d.type === 'play' || d.type === 'pause' ||
    d.type === 'playing' || d.type === 'paused' || d.type === 'ready' ||
    d.event === 'ready' || d.event === 'play' || d.event === 'pause' ||
    d.event === 'onStateChange' || d.info === 'ready' ||
    d.method === 'ready' || d.status === 'ready'
  )) || d === 'ready' || d === 'playing';
  if (isAck) CONTROL_BRIDGE.markAcked();
});
</script>

// ═══════════════════════════════════════════════════════════════════════
// ── FETCH AL BACKEND ──────────────────────────────────────────────────
// Hace UNA sola petición a /api/servidores y parsea el formato:
//   { servidores: { latino: { "HLS-Name": "url", "IFRAME-Name": "url" } } }
// ═══════════════════════════════════════════════════════════════════════
async function fetchServers(isColdRetry = false) {
  setBackendBadge('cold', isColdRetry ? 'Iniciando…' : 'Conectando…');
  els.serverStatus.textContent = isColdRetry ? 'Despertando backend…' : 'Consultando…';

  const url = new URL(window.APP_CONFIG.serversPath, window.APP_CONFIG.backendUrl);
  url.searchParams.set('id', state.movieId);
  url.searchParams.set('tipo', state.movieType);
  url.searchParams.set('estacion', '');
  url.searchParams.set('episodio', '');

  const ctrl = new AbortController();
  const timeout = setTimeout(() => ctrl.abort(),
    isColdRetry ? window.APP_CONFIG.coldStartTimeout : window.APP_CONFIG.normalTimeout);

  try {
    const res = await fetch(url.toString(), { signal: ctrl.signal, mode: 'cors', cache: 'no-store' });
    clearTimeout(timeout);

    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    const data = await res.json();
    setBackendBadge('online', 'API Online');
    state.backendWarmed = true;

    // Parsear meta
    state.meta = data.meta || {};
    renderMeta(state.meta);

    // Parsear servidores
    const rawServers = data.servidores || {};
    state.allServers = {};

    for (const lang of ['latino', 'castellano', 'subtitulado']) {
      const langObj = rawServers[lang] || {};
      const list = Object.entries(langObj).map(([key, url]) => {
        const isHLS = key.startsWith('HLS-');
        const isIframe = key.startsWith('IFRAME-');
        const cleanName = key.replace(/^(HLS-|IFRAME-)/, '').trim();
        return {
          id: key.toLowerCase().replace(/[^a-z0-9]+/g, '_'),
          name: cleanName,
          url: url,
          type: isHLS ? 'hls' : isIframe ? 'iframe' : 'iframe',
          rawKey: key,
        };
      });
      // HLS primero, iframes después
      list.sort((a, b) => (a.type === 'hls' ? 0 : 1) - (b.type === 'hls' ? 0 : 1));
      state.allServers[lang] = list;
    }

    console.log('[Backend] Servidores:', state.allServers);
    return true;
  } catch (err) {
    clearTimeout(timeout);
    const isTimeout = err.name === 'AbortError';
    console.warn('[Backend] Error:', err.message);

    if (!state.backendWarmed && !isColdRetry) {
      // Primer intento falló → reintentar como cold start
      console.log('[Backend] Reintentando (cold start)…');
      setBackendBadge('cold', 'Despertando…');
      return fetchServers(true);
    }

    setBackendBadge('error', isTimeout ? 'Timeout' : 'Offline');
    els.serverStatus.textContent = 'Sin respuesta';
    return false;
  }
}

// ═══════════════════════════════════════════════════════════════════════
// ── RENDER META ───────────────────────────────────────────────────────
// ═══════════════════════════════════════════════════════════════════════
function renderMeta(meta) {
  const title = meta.título || meta.titulo || 'Sin título';
  const year = meta.año || meta.ano || '';
  const desc = meta['descripción general'] || meta.descripcion_general || '';
  const poster = meta.póster || meta.poster || '';
  const backdrop = meta.fondo || '';
  const dur = meta['tiempo de ejecución'] || meta.tiempo_ejecucion || 0;
  const genres = meta.géneros || meta.generos || '';
  const rating = meta['promedio de votos'] || meta.promedio_de_votos || 0;

  els.mediaTitle.textContent = title;
  els.mediaMeta.textContent = [year, genres, dur ? `${dur} min` : '', rating ? `⭐ ${rating}` : ''].filter(Boolean).join(' • ');
  if (poster) els.posterImg.src = poster;
  if (backdrop) els.backdropImg.src = backdrop;
  document.title = `${title} — Smart TV Player`;
}

// ═══════════════════════════════════════════════════════════════════════
// ── RENDER IDIOMAS DISPONIBLES ────────────────────────────────────────
// ═══════════════════════════════════════════════════════════════════════
function renderAudioButtons() {
  const row = els.audioRow;
  row.innerHTML = '';

  const langs = Object.keys(state.allServers).filter(l => state.allServers[l].length > 0);
  if (!langs.length) {
    row.innerHTML = '<span class="text-xs text-neutral-400 px-3 py-2">Sin idiomas disponibles</span>';
    return;
  }

  // Si el idioma actual no está disponible, cambiar al primero
  if (!langs.includes(state.currentAudio)) state.currentAudio = langs[0];

  const LANG_LABELS = { latino: 'Latino', castellano: 'Castellano', subtitulado: 'Subtitulado' };
  langs.forEach(lang => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'tv-btn-normal px-3 py-2 text-xs sm:text-sm font-medium flex-1 flex items-center justify-center transition' + (lang === state.currentAudio ? ' tv-btn-active' : '');
    btn.textContent = LANG_LABELS[lang] || lang;
    btn.addEventListener('click', () => switchLanguage(lang));
    row.appendChild(btn);
  });
}

// ═══════════════════════════════════════════════════════════════════════
// ── RENDER SERVIDORES DEL IDIOMA ACTUAL ──────────────────────────────
// ═══════════════════════════════════════════════════════════════════════
function renderServerList() {
  const box = els.serverList;
  box.innerHTML = '';

  const list = state.allServers[state.currentAudio] || [];
  if (!list.length) {
    box.innerHTML = '<span class="text-xs text-neutral-400 px-3 py-2">Sin servidores para este idioma.</span>';
    els.serverStatus.textContent = 'Sin fuentes';
    return;
  }

  els.serverStatus.textContent = `${list.length} disponible${list.length !== 1 ? 's' : ''}`;

  list.forEach(srv => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'server-btn ' + (srv.type === 'hls' ? 'ok' : 'iframe');
    btn.dataset.serverId = srv.id;
    if (state.currentServerId === srv.id) btn.classList.add('active');

    const badgeClass = srv.type === 'hls' ? 'hls' : 'iframe';
    const badgeText = srv.type === 'hls' ? 'HLS' : 'IFRAME';

    btn.innerHTML = `
      <span class="srv-dot"></span>
      <span class="srv-name">${srv.name}</span>
      <span class="server-badge ${badgeClass}">${badgeText}</span>
    `;
    btn.addEventListener('click', () => selectServer(srv.id));
    box.appendChild(btn);
  });
}

// ═══════════════════════════════════════════════════════════════════════
// ── CAMBIO DE IDIOMA ─────────────────────────────────────────────────
// ═══════════════════════════════════════════════════════════════════════
function switchLanguage(lang) {
  if (lang === state.currentAudio) return;
  state.currentAudio = lang;
  state.currentServerId = null;
  els.badgeActiveAudio.textContent = lang.toUpperCase();
  showToast(`Idioma: ${lang}`);
  renderAudioButtons();
  renderServerList();
}

// ═══════════════════════════════════════════════════════════════════════
// ── SELECCIÓN DE SERVIDOR ────────────────────────────────────────────
// ═══════════════════════════════════════════════════════════════════════
function selectServer(serverId) {
  const list = state.allServers[state.currentAudio] || [];
  const srv = list.find(s => s.id === serverId);
  if (!srv) return;

  state.currentServerId = serverId;
  document.querySelectorAll('.server-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.serverId === serverId)
  );

  const preserved = Math.floor(state.currentTime || 0);

  if (srv.type === 'hls') {
    loadNativeHLS(srv, preserved);
  } else {
    loadIframe(srv, preserved);
  }
}

// ── Cargar HLS nativo ──
function loadNativeHLS(srv, preserved) {
  els.nativeVideoLayer.classList.add('active');
  const iframe = document.getElementById('stream-iframe');
  if (iframe) { iframe.style.opacity = '0'; iframe.style.pointerEvents = 'none'; }
  const notice = document.getElementById('uncontrollable-notice');
  if (notice) notice.classList.remove('show');

  const v = els.nativeVideo;
  if (v._hls) { try { v._hls.destroy(); } catch(e){} v._hls = null; }

  showLoading(`Cargando ${srv.name}…`);

  if (window.Hls && Hls.isSupported()) {
    const hls = new Hls({
      enableWorker: true,
      lowLatencyMode: false,
      capLevelToPlayerSize: false,
      maxBufferLength: 30,
    });
    hls.loadSource(srv.url);
    hls.attachMedia(v);
    v._hls = hls;
    window.hls = hls;

    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      hideLoading();
      if (preserved > 0) v.currentTime = preserved;
      v.play().catch(()=>{});
    });
    hls.on(Hls.Events.ERROR, (e, d) => {
      if (d.fatal) {
        showToast(`Falló ${srv.name} — probando siguiente`);
        try { hls.destroy(); } catch(_) {}
        autoAdvance(srv.id);
      }
    });
  } else if (v.canPlayType('application/vnd.apple.mpegurl')) {
    v.src = srv.url;
    v.addEventListener('loadedmetadata', () => {
      hideLoading();
      if (preserved > 0) v.currentTime = preserved;
      v.play().catch(()=>{});
    }, { once: true });
  }

  showToast(`${srv.name} (HLS)`);
  flash(ICONS.settings);
}

// ── Cargar iframe ──
function loadIframe(srv, preserved) {
  els.nativeVideoLayer.classList.remove('active');
  const v = els.nativeVideo;
  if (v._hls) { try { v._hls.destroy(); } catch(e){} v._hls = null; }
  v.removeAttribute('src');
  v.load();

  const iframe = document.getElementById('stream-iframe');
  if (iframe) { iframe.style.opacity = '1'; iframe.style.pointerEvents = 'auto'; }

  showLoading(`Cargando ${srv.name}…`);
  setIframeSrc(srv.url);
  setTimeout(hideLoading, 3000);

  CONTROL_BRIDGE.expectAck(iframe, 3500);

  setTimeout(() => {
    if (iframe) {
      CONTROL_BRIDGE.play(iframe);
      if (preserved > 0) CONTROL_BRIDGE.seek(iframe, preserved);
    }
  }, 1500);

  showToast(`${srv.name} (iframe)`);
  flash(ICONS.settings);
}

// ── Auto-avanzar si falla ──
function autoAdvance(failedId) {
  const list = state.allServers[state.currentAudio] || [];
  const next = list.find(s => s.id !== failedId);
  if (next) {
    setTimeout(() => selectServer(next.id), 800);
  } else {
    showToast('Todos los servidores fallaron');
  }
}

// ═══════════════════════════════════════════════════════════════════════
// ── CONTROLES ────────────────────────────────────────────────────────
// ═══════════════════════════════════════════════════════════════════════
function isNativeActive() {
  return els.nativeVideoLayer.classList.contains('active');
}

function togglePlayPause() {
  if (!state.hasStarted) { launch(); return; }

  if (isNativeActive()) {
    if (els.nativeVideo.paused) {
      els.nativeVideo.play().catch(()=>{});
      updatePlayPauseUI(true); flash(ICONS.play);
    } else {
      els.nativeVideo.pause();
      updatePlayPauseUI(false); flash(ICONS.pause);
    }
  } else {
    const iframe = document.getElementById('stream-iframe');
    if (!iframe) return;
    if (state.isPlaying) { CONTROL_BRIDGE.pause(iframe); updatePlayPauseUI(false); flash(ICONS.pause); }
    else { CONTROL_BRIDGE.play(iframe); updatePlayPauseUI(true); flash(ICONS.play); }
  }
  showHudTemporarily();
}

function rewind10() {
  const t = Math.max(0, state.currentTime - 10);
  state.currentTime = t;
  if (isNativeActive()) els.nativeVideo.currentTime = t;
  else {
    const iframe = document.getElementById('stream-iframe');
    if (iframe) CONTROL_BRIDGE.seek(iframe, t);
  }
  updateScrubber(); flash(ICONS.rewind); showHudTemporarily();
}

function forward10() {
  const t = Math.min(state.duration || 0, state.currentTime + 10);
  state.currentTime = t;
  if (isNativeActive()) els.nativeVideo.currentTime = t;
  else {
    const iframe = document.getElementById('stream-iframe');
    if (iframe) CONTROL_BRIDGE.seek(iframe, t);
  }
  updateScrubber(); flash(ICONS.forward); showHudTemporarily();
}

function seekTo(t) {
  const c = Math.max(0, Math.min(state.duration || 0, Math.floor(t)));
  state.currentTime = c;
  if (isNativeActive()) els.nativeVideo.currentTime = c;
  else {
    const iframe = document.getElementById('stream-iframe');
    if (iframe) CONTROL_BRIDGE.seek(iframe, c);
  }
  updateScrubber();
}

// ── HUD ──
function showHUD() {
  state.isHudVisible = true;
  els.hud.classList.remove('hud-hidden');
  els.btnRevealHud.classList.add('opacity-0', 'pointer-events-none');
}
function hideHUD() {
  if (state.isOptionsDrawerOpen) return;
  state.isHudVisible = false;
  els.hud.classList.add('hud-hidden');
  els.btnRevealHud.classList.remove('opacity-0', 'pointer-events-none');
}
function resetIdle() {
  if (!state.isHudVisible) showHUD();
  clearTimeout(state.idleTimer);
  state.idleTimer = setTimeout(() => {
    if (state.isPlaying && !state.isOptionsDrawerOpen) hideHUD();
  }, state.idleTimeout);
}
function showHudTemporarily() { showHUD(); resetIdle(); }

function toggleDrawer(force) {
  const open = typeof force === 'boolean' ? force : !state.isOptionsDrawerOpen;
  state.isOptionsDrawerOpen = open;
  if (open) {
    els.optionsPanel.classList.remove('options-drawer-collapsed');
    els.optionsPanel.classList.add('options-drawer-expanded');
    els.toggleChevron.classList.add('rotate-180', 'text-brand-cyan');
    clearTimeout(state.idleTimer);
  } else {
    els.optionsPanel.classList.remove('options-drawer-expanded');
    els.optionsPanel.classList.add('options-drawer-collapsed');
    els.toggleChevron.classList.remove('rotate-180', 'text-brand-cyan');
    resetIdle();
  }
}

function applyAspect(mode) {
  state.currentAspect = mode;
  const targets = [document.getElementById('stream-iframe'), els.nativeVideo].filter(Boolean);
  targets.forEach(t => {
    t.classList.remove('aspect-mode-16-9', 'aspect-mode-stretch', 'aspect-mode-zoom', 'aspect-mode-4-3');
    if (mode === 'stretch') t.classList.add('aspect-mode-stretch');
    else if (mode === '4-3') t.classList.add('aspect-mode-4-3');
    else if (mode === '16-9') t.classList.add('aspect-mode-16-9');
    else t.classList.add('aspect-mode-16-9');
  });
  showToast(`Formato: ${mode}`);
}

function applyQuality(q) {
  state.currentQuality = q;
  if (isNativeActive() && window.hls) {
    if (q === 'auto') window.hls.currentLevel = -1;
    else {
      const target = parseInt(q, 10);
      const idx = window.hls.levels.findIndex(l => l.height === target);
      if (idx >= 0) window.hls.currentLevel = idx;
    }
  }
  showToast(`Calidad: ${q}`);
}

// ═══════════════════════════════════════════════════════════════════════
// ── LANZAR REPRODUCCIÓN ──────────────────────────────────────────────
// ═══════════════════════════════════════════════════════════════════════
function launch() {
  if (!state.allServers[state.currentAudio]?.length) {
    showToast('Esperando servidores…');
    return;
  }
  state.hasStarted = true;
  state.isPlaying = true;
  els.backdrop.classList.add('opacity-0', 'pointer-events-none');
  els.centerPlay.classList.add('opacity-0', 'scale-90', 'pointer-events-none');
  els.videoWrapper.classList.remove('opacity-0', 'pointer-events-none');
  els.videoWrapper.classList.add('opacity-100', 'pointer-events-auto');

  const best = state.allServers[state.currentAudio].find(s => s.type === 'hls')
            || state.allServers[state.currentAudio][0];
  if (best) selectServer(best.id);

  updateScrubber();
  updatePlayPauseUI(true);
  resetIdle();
}

// ═══════════════════════════════════════════════════════════════════════
// ── LISTENERS ────────────────────────────────────────────────────────
// ═══════════════════════════════════════════════════════════════════════
document.querySelectorAll('#group-formato-pantalla button').forEach(btn => btn.addEventListener('click', () => {
  document.querySelectorAll('#group-formato-pantalla button').forEach(b => b.classList.remove('tv-btn-active'));
  btn.classList.add('tv-btn-active');
  applyAspect(btn.dataset.aspect);
}));

document.querySelectorAll('#group-resolucion-bar button').forEach(btn => btn.addEventListener('click', () => {
  document.querySelectorAll('#group-resolucion-bar button').forEach(b => b.classList.remove('tv-btn-active'));
  btn.classList.add('tv-btn-active');
  applyQuality(btn.dataset.res);
}));

document.querySelectorAll('#group-subtitle-options button').forEach(btn => btn.addEventListener('click', () => {
  document.querySelectorAll('#group-subtitle-options button').forEach(b => {
    b.classList.remove('tv-btn-active');
    b.querySelector('.check-icon')?.classList.add('hidden');
  });
  btn.classList.add('tv-btn-active');
  btn.querySelector('.check-icon')?.classList.remove('hidden');
  state.currentSubtitle = btn.dataset.sub;
  const iframe = document.getElementById('stream-iframe');
  if (iframe) CONTROL_BRIDGE.send(iframe, 'setSubtitle', [btn.dataset.sub]);
  showToast(`Subtítulos: ${btn.dataset.sub}`);
}));

els.btnCenterPlay.addEventListener('click', launch);
els.btnPlay.addEventListener('click', togglePlayPause);
els.btnRewind.addEventListener('click', rewind10);
els.btnForward.addEventListener('click', forward10);
els.btnToggleOptions.addEventListener('click', (e) => { e.stopPropagation(); toggleDrawer(); });
els.btnRevealHud.addEventListener('click', () => { showHUD(); resetIdle(); });
els.btnExit.addEventListener('click', () => {
  if (state.isOptionsDrawerOpen) toggleDrawer(false);
  else hideHUD();
});
els.btnBarFeedback.addEventListener('click', () => showToast('Reporta el problema desde tu plataforma'));
els.btnReloadServers.addEventListener('click', () => loadBackend());

// Slider
els.slider.addEventListener('input', (e) => {
  const pct = parseFloat(e.target.value);
  state.currentTime = Math.floor((pct / 100) * state.duration);
  els.progressFill.style.width = `${pct}%`;
  els.currentTimeText.textContent = fmt(state.currentTime);
});
els.slider.addEventListener('change', (e) => {
  state.isSeeking = false;
  const pct = parseFloat(e.target.value);
  seekTo((pct / 100) * state.duration);
  resetIdle();
});
els.slider.addEventListener('pointerdown', () => state.isSeeking = true);

window.addEventListener('mousemove', resetIdle);
window.addEventListener('touchstart', resetIdle);

// Teclado
window.addEventListener('keydown', (e) => {
  switch (e.key) {
    case ' ': case 'Enter':
      e.preventDefault();
      if (!state.hasStarted) launch(); else togglePlayPause();
      break;
    case 'ArrowLeft': e.preventDefault(); rewind10(); break;
    case 'ArrowRight': e.preventDefault(); forward10(); break;
    case 'ArrowDown':
      e.preventDefault();
      if (!state.isOptionsDrawerOpen) toggleDrawer(true);
      break;
    case 'ArrowUp':
      e.preventDefault();
      if (state.isOptionsDrawerOpen) toggleDrawer(false);
      break;
    case 'Escape': case 'Backspace':
      e.preventDefault();
      if (state.isOptionsDrawerOpen) toggleDrawer(false);
      else hideHUD();
      break;
  }
});

// ── Video nativo sincroniza UI ──
els.nativeVideo.addEventListener('timeupdate', () => {
  state.currentTime = Math.floor(els.nativeVideo.currentTime);
  state.duration = els.nativeVideo.duration || 0;
  if (!state.isSeeking) updateScrubber();
});
els.nativeVideo.addEventListener('play', () => updatePlayPauseUI(true));
els.nativeVideo.addEventListener('pause', () => updatePlayPauseUI(false));
els.nativeVideo.addEventListener('ended', () => updatePlayPauseUI(false));
els.nativeVideo.addEventListener('waiting', () => showLoading('Buffering…'));
els.nativeVideo.addEventListener('playing', () => hideLoading());

// ── Bitrate simulado ──
setInterval(() => {
  const s = ['4.2MB/S', '4.3MB/S', '4.1MB/S', '4.4MB/S'];
  const ind = document.getElementById('bitrate-indicator');
  if (ind && !ind.textContent.includes('—')) ind.textContent = s[Math.floor(Math.random() * s.length)];
  else if (ind) ind.textContent = s[0];
}, 4000);

// ═══════════════════════════════════════════════════════════════════════
// ── ARRANQUE ─────────────────────────────────────────────────────────
// ═══════════════════════════════════════════════════════════════════════
async function loadBackend() {
  els.serverList.innerHTML = `
    <div class="flex items-center space-x-2 px-3 py-2 text-xs text-neutral-400">
      <svg class="animate-spin h-3.5 w-3.5 text-brand-cyan" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
      </svg>
      <span>Consultando backend…</span>
    </div>`;

  const ok = await fetchServers();
  if (!ok) {
    els.serverList.innerHTML = `
      <div class="flex flex-col gap-2 px-3 py-2 text-xs">
        <span class="text-rose-400">No se pudo conectar con el backend.</span>
        <button class="text-brand-cyan underline text-[11px]" onclick="loadBackend()">Reintentar</button>
      </div>`;
    return;
  }

  renderAudioButtons();
  renderServerList();
  if (state.currentAudio) els.badgeActiveAudio.textContent = state.currentAudio.toUpperCase();
}

// Warmup opcional: ping al health para despertar Render
async function warmBackend() {
  try {
    const ctrl = new AbortController();
    setTimeout(() => ctrl.abort(), 3000);
    await fetch(window.APP_CONFIG.backendUrl + window.APP_CONFIG.healthPath,
      { signal: ctrl.signal, mode: 'cors', cache: 'no-store' });
    console.log('[Backend] warmup OK');
  } catch (_) { /* silencioso */ }
}

window.addEventListener('load', () => {
  warmBackend().then(() => loadBackend());
});

// Exponer para el botón de reintento
window.loadBackend = loadBackend;
</script>
